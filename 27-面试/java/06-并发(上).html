const PAGE_KEY = 'interview:java:06';
const QA = [
  // ───────────── 线程 ─────────────
  { sec: '线程', q: '什么是线程和进程？', star: true,
    a: `<ul><li><b>进程</b>：程序的一次运行过程，是操作系统<b>分配资源</b>（内存空间、文件句柄等）的基本单位。启动一个 <code>main</code> 方法，就是启动了一个 JVM 进程。</li>
<li><b>线程</b>：进程里更小的执行单元，是 CPU <b>调度</b>的基本单位。一个进程可以有多个线程，它们共享进程的<b>堆</b>和<b>方法区</b>，但各自有自己的<b>程序计数器、虚拟机栈、本地方法栈</b>。</li></ul>
<p>因为线程之间共享大部分资源，创建和切换线程比进程便宜得多，所以线程也叫"轻量级进程"。</p>
<p>补充一句：Java 程序天生就是多线程的。就算你只写了 main，JVM 里也还有 <code>Reference Handler</code>、<code>Finalizer</code>、<code>Signal Dispatcher</code> 以及 GC、JIT 编译等后台线程。</p>`,
    more: `<p><b>生活类比</b>：进程像一家餐厅，有自己的厨房、仓库（内存等资源）；线程像餐厅里的厨师，大家共用厨房和仓库，但每个人手里有自己正在做的那道菜的进度（程序计数器、栈）。开一家新餐厅（新进程）成本高，多招一个厨师（新线程）成本低。</p>`,
    links: [['进程 vs 线程', '../../02-并发/basics/05-进程vs线程.html'], ['进程是什么', '../../11-操作系统/process/01-进程是什么.html']] },

  { sec: '线程', q: 'Java 线程和操作系统的线程有什么区别？',
    a: `<p>先解释两个术语：</p>
<ul><li><b>用户线程</b>：由用户空间的程序（运行时库）自己管理和调度，内核不知道它的存在。</li>
<li><b>内核线程</b>：由操作系统内核管理和调度，能直接被分到不同 CPU 核上。</li></ul>
<p>Java 的情况分三个阶段说：</p>
<ol><li><b>早期（JDK 1.2 之前）</b>：用"绿色线程"，也就是 JVM 自己在用户态模拟的线程，所有线程挤在一个内核线程上，用不了多核。</li>
<li><b>现在的平台线程</b>：<code>new Thread()</code> 创建的线程，在 HotSpot + Windows/Linux 上是 <b>1:1 映射</b>到操作系统线程，调度完全交给 OS。</li>
<li><b>JDK 21 虚拟线程</b>：由 JVM 调度，大量虚拟线程挂载到少量平台线程（载体线程）上执行，属于 <b>M:N</b> 模型。</li></ol>
<p>所以现在不能笼统地说"Java 线程 = OS 线程"：平台线程是，虚拟线程不是。</p>`,
    more: `<p><b>三种线程模型</b>：一对一（实现简单、能用多核，但创建和切换要进内核，贵）；多对一（切换快，但一个线程阻塞在系统调用上，整个进程都卡住，也用不了多核）；多对多（兼顾两者，实现最复杂）。虚拟线程选多对多，就是为了让"一个请求一个线程"的写法在百万并发下也扛得住。</p>`,
    trap: `<p>虚拟线程适合 <b>IO 密集</b>任务，对 CPU 密集任务没有加速效果——CPU 核数没变。另外不要把虚拟线程放进线程池"复用"，它本身就很便宜，用完就扔。</p>`,
    links: [['用户级线程与内核级线程', '../../11-操作系统/concur/02-用户级线程与内核级线程.html'], ['线程实现与协程简介', '../../08-JVM/concurrency/02-线程实现与协程简介.html'], ['虚拟线程简介', '../../02-并发/modern/06-虚拟线程VirtualThreads简介.html']] },

  { sec: '线程', q: '请简要描述线程与进程的关系、区别及优缺点？', star: true,
    a: `<p><b>关系</b>：一个进程包含多个线程，线程是进程划分出来的更小执行单位。</p>
<p><b>从 JVM 内存区域看</b>：</p>
<ul><li><b>线程共享</b>：堆（放对象）、方法区 / 元空间（放类信息、静态变量、常量）。</li>
<li><b>线程私有</b>：程序计数器、虚拟机栈、本地方法栈。</li></ul>
<p><b>优缺点</b>：进程之间基本相互独立，一个崩了不影响另一个，隔离性好但开销大；线程开销小、通信方便（直接读写共享内存），但共享也意味着会互相影响，需要同步来保护数据。</p>`,
    more: `<p><b>追问：为什么程序计数器是私有的？</b>程序计数器记录"当前线程执行到哪条字节码"。CPU 会在线程之间来回切换，切回来时要知道从哪继续，所以每个线程必须有自己的一份。（执行 native 方法时它的值是 undefined。）</p>
<p><b>追问：为什么虚拟机栈、本地方法栈是私有的？</b>每次方法调用都会压入一个栈帧，里面放局部变量、操作数栈等。私有是为了保证一个线程的局部变量不会被别的线程看到，这也是"局部变量天然线程安全"的原因。HotSpot 里这两个栈其实合二为一。</p>`,
    trap: `<p>"局部变量线程安全"只对变量本身成立。如果局部变量引用的<b>对象</b>被放进了共享的地方（比如静态集合），这个对象仍然可能被多线程访问。</p>`,
    links: [['程序计数器', '../../08-JVM/memory/01-程序计数器.html'], ['Java 虚拟机栈与栈帧', '../../08-JVM/memory/02-Java虚拟机栈与栈帧.html'], ['本地方法栈', '../../08-JVM/memory/03-本地方法栈.html']] },

  { sec: '线程', q: '如何创建线程？',
    a: `<p>常说的方式有：继承 <code>Thread</code>、实现 <code>Runnable</code>、实现 <code>Callable</code>（配合 <code>FutureTask</code>）、线程池、<code>CompletableFuture</code>。</p>
<p>但<b>严格说，Java 创建线程只有一种方式：<code>new Thread(...).start()</code></b>。其他写法只是提供"要执行的任务"，线程池内部最终也是 new Thread 再 start。</p>
<pre><code>Runnable task = () -&gt; System.out.println("run in " + Thread.currentThread().getName());
new Thread(task).start();   // 真正让 OS 创建线程的是 start()</code></pre>`,
    more: `<p><b>为什么推荐实现 Runnable 而不是继承 Thread？</b>Java 是单继承，继承了 Thread 就不能再继承别的类；而且"任务"和"执行任务的线程"本来就是两件事，分开后任务可以交给线程池复用。<code>Callable</code> 比 <code>Runnable</code> 多了返回值和可以抛受检异常。</p>
<p>JDK 21 起还能用 <code>Thread.ofVirtual().start(task)</code> 创建虚拟线程。</p>`,
    trap: `<p>同一个 Thread 对象调用两次 <code>start()</code> 会抛 <code>IllegalThreadStateException</code>，线程是一次性的。实际项目里也不要到处手动 new Thread，应该用线程池统一管理。</p>`,
    links: [['线程的创建与生命周期', '../../02-并发/basics/06-线程的创建与生命周期.html'], ['Callable 与 Future', '../../02-并发/exec/02-Callable-Future.html']] },

  { sec: '线程', q: '说说线程的生命周期和状态？', star: true,
    a: `<p><code>Thread.State</code> 定义了 6 种状态，任意时刻一个线程只处于其中一种：</p>
<table><tr><th>状态</th><th>含义 / 怎么进入</th></tr>
<tr><td>NEW</td><td>创建了但还没调 <code>start()</code></td></tr>
<tr><td>RUNNABLE</td><td>调了 <code>start()</code>，正在运行<b>或</b>等待 CPU</td></tr>
<tr><td>BLOCKED</td><td>等 <code>synchronized</code> 的锁（进入同步块，或 wait 被唤醒后重新抢锁）</td></tr>
<tr><td>WAITING</td><td>无限期等待别人唤醒：<code>wait()</code>、<code>join()</code>、<code>LockSupport.park()</code></td></tr>
<tr><td>TIMED_WAITING</td><td>带超时的等待：<code>sleep(ms)</code>、<code>wait(ms)</code>、<code>join(ms)</code></td></tr>
<tr><td>TERMINATED</td><td><code>run()</code> 执行完（正常结束或抛异常）</td></tr></table>`,
    more: `<p><b>追问：为什么 JVM 不区分 READY 和 RUNNING？</b>操作系统层面线程有"就绪"和"运行"两种状态，但它们之间的切换由 OS 调度器决定，非常频繁，JVM 既管不了也没必要跟踪，所以统一叫 RUNNABLE。</p>
<p>同理，线程在做阻塞 IO（比如读 socket）时，Java 层面看到的通常仍是 <b>RUNNABLE</b>，虽然 OS 层面它在睡觉。</p>`,
    trap: `<ul><li><b>BLOCKED 只和 synchronized 有关</b>。用 <code>ReentrantLock</code> 抢不到锁时，线程是通过 <code>LockSupport.park()</code> 挂起的，jstack 里看到的是 <b>WAITING</b>，不是 BLOCKED。</li>
<li>面试画状态图时，别漏了 wait 被 notify 之后要<b>先进 BLOCKED 重新抢锁</b>，抢到才回 RUNNABLE。</li></ul>`,
    links: [['线程的创建与生命周期', '../../02-并发/basics/06-线程的创建与生命周期.html']] },

  { sec: '线程', q: '什么是线程上下文切换？',
    a: `<p><b>上下文</b>就是线程运行时的"现场"：程序计数器、寄存器、栈信息等。CPU 从线程 A 换到线程 B 时，要先把 A 的现场保存起来，再把 B 的现场恢复出来，这个过程叫<b>上下文切换</b>。</p>
<p><b>什么时候会切换</b>：</p>
<ol><li>主动让出 CPU：<code>sleep()</code>、<code>wait()</code> 等。</li>
<li>时间片用完：OS 防止一个线程一直霸占 CPU。</li>
<li>发起阻塞式系统调用：比如读文件、等网络。</li></ol>
<p>（线程执行结束也会让出 CPU，但它不需要再保存现场。）</p>
<p><b>代价</b>：保存和恢复现场要花 CPU 时间，线程切换还会让 CPU 缓存、TLB 里的数据失效。切换太频繁，CPU 大量时间花在"换人"上而不是干活。</p>`,
    more: `<p>线程切换需要进入内核态，这是它比函数调用贵得多的根本原因。减少上下文切换的常见手段：减少锁竞争（无锁/CAS）、线程数别开太多、用协程/虚拟线程（切换发生在用户态，只需保存很少的状态）。Linux 下可以用 <code>vmstat</code> 的 <code>cs</code> 列观察每秒切换次数。</p>`,
    links: [['系统调用的本质', '../../11-操作系统/link/03-系统调用的本质.html'], ['常见调度算法', '../../11-操作系统/classic/01-常见调度算法.html']] },

  { sec: '线程', q: 'Thread.sleep() 和 Object.wait() 有什么区别？',
    a: `<p>共同点：都能让当前线程暂停。区别如下：</p>
<table><tr><th>维度</th><th>sleep()</th><th>wait()</th></tr>
<tr><td>是否释放锁</td><td><b>不释放</b></td><td><b>释放</b>当前对象的锁</td></tr>
<tr><td>定义在哪</td><td><code>Thread</code> 的静态方法</td><td><code>Object</code> 的实例方法</td></tr>
<tr><td>调用前提</td><td>任何地方都能调</td><td>必须在 <code>synchronized</code> 里、持有该对象的锁</td></tr>
<tr><td>怎么醒来</td><td>时间到自动醒</td><td>被 <code>notify/notifyAll</code> 唤醒，或 <code>wait(ms)</code> 超时</td></tr>
<tr><td>用途</td><td>单纯暂停一会儿</td><td>线程间协作通信</td></tr></table>`,
    trap: `<ul><li>没持有锁就调 <code>wait()</code>，会抛 <code>IllegalMonitorStateException</code>。</li>
<li><code>wait()</code> 要放在 <b>while 循环</b>里判断条件，而不是 if：线程可能被"虚假唤醒"，或者被唤醒时条件已经又被别人改掉了。</li>
<li>两者都会响应中断，抛 <code>InterruptedException</code>，而且抛出时会<b>清除中断标志</b>。</li></ul>`,
    links: [['interrupt 中断', '../../02-并发/exec/07-interrupt中断.html'], ['Condition', '../../02-并发/advanced/04-Condition.html']] },

  { sec: '线程', q: '为什么 wait() 方法定义在 Object 中，而不是 Thread 中？',
    a: `<p>因为 <code>wait()</code> 要做的事是"<b>释放某个对象的锁</b>，然后在这个对象上等待"。锁是属于对象的——Java 里<b>每个对象</b>都能当锁用（每个对象都可以关联一个 monitor）。等待和唤醒都是围绕"哪个对象的锁"来组织的，所以方法自然放在 <code>Object</code> 上。</p>
<p>反过来，<code>sleep()</code> 只是让<b>当前线程</b>暂停，跟任何对象、任何锁都没关系，所以放在 <code>Thread</code> 上，而且是静态方法。</p>`,
    more: `<p>底层看：HotSpot 里每个对象的锁膨胀后对应一个 <code>ObjectMonitor</code>，它里面有一个 <b>WaitSet</b>（等待队列）。调 <code>obj.wait()</code> 就是把当前线程放进 obj 的 WaitSet；<code>obj.notify()</code> 就是从 obj 的 WaitSet 里挑一个出来。</p>`,
    trap: `<p><code>Thread.sleep()</code> 是静态方法，写成 <code>t.sleep(1000)</code> 睡的仍然是<b>当前线程</b>，不是 t。</p>` },

  { sec: '线程', q: '可以直接调用 Thread 的 run() 方法吗？',
    a: `<p>可以调，但<b>不会启动新线程</b>。</p>
<ul><li><code>start()</code>：让 JVM 向操作系统申请创建一个新线程，线程进入就绪状态，拿到 CPU 后<b>在新线程里</b>执行 <code>run()</code>。</li>
<li>直接调 <code>run()</code>：只是一次普通的方法调用，在<b>当前线程</b>里同步执行完。</li></ul>
<pre><code>Thread t = new Thread(() -&gt; System.out.println(Thread.currentThread().getName()));
t.run();    // 打印 main
t.start();  // 打印 Thread-0</code></pre>`,
    more: `<p><code>start()</code> 内部调用的是 native 方法 <code>start0()</code>，由 JVM 创建操作系统线程并做好准备工作，再回调 <code>run()</code>。这就是"只有 start 才真正创建线程"的原因。</p>` },

  // ───────────── 多线程 ─────────────
  { sec: '多线程', q: '并发与并行有什么区别？',
    a: `<ul><li><b>并发（Concurrency）</b>：多个任务在同一<b>时间段</b>内推进，可以是轮流执行。</li>
<li><b>并行（Parallelism）</b>：多个任务在同一<b>时刻</b>真正同时执行，需要多核。</li></ul>
<p>关键就是<b>是否同时</b>。类比：一个人边做饭边接电话，来回切换，是并发；两个人一个做饭一个接电话，是并行。单核 CPU 只能并发，多核才能并行。</p>` },

  { sec: '多线程', q: '同步和异步有什么区别？',
    a: `<ul><li><b>同步</b>：发出调用后，在拿到结果之前一直等，调用不返回。</li>
<li><b>异步</b>：发出调用后立刻返回，结果以后通过回调、Future 或通知的方式拿到。</li></ul>
<p>例子：<code>future.get()</code> 是同步等待；<code>CompletableFuture.thenAccept(...)</code> 是注册回调，异步处理结果。</p>`,
    trap: `<p>别把"同步/异步"和"阻塞/非阻塞"混为一谈。前者关注<b>结果怎么拿</b>（等着要 vs 被通知），后者关注<b>等待时线程能不能干别的</b>。比如同步非阻塞 IO：线程不挂起，但要自己反复去问"好了没"。</p>`,
    links: [['CompletableFuture', '../../02-并发/exec/03-CompletableFuture.html'], ['阻塞 IO 与非阻塞 IO', '../../11-操作系统/io/02-阻塞IO与非阻塞IO.html']] },

  { sec: '多线程', q: '为什么要使用多线程？', star: true,
    a: `<p><b>总体上</b>：线程比进程轻量，切换成本低；现在的系统动辄要求高并发，多线程是基础。</p>
<p><b>分两种情况讲更有说服力</b>：</p>
<ul><li><b>单核时代——提高 CPU 和 IO 的利用率</b>：只有一个线程时，它去等 IO，CPU 就闲着。开多个线程后，一个线程等 IO，另一个线程可以用 CPU，两者都不闲着。</li>
<li><b>多核时代——利用多核算力</b>：一个线程同一时刻只能跑在一个核上。一个计算任务拆成多个线程，就能同时用上多个核，理想情况下耗时接近"单线程耗时 / 核数"。</li></ul>`,
    more: `<p>理想加速比达不到，是因为任务里总有必须串行的部分，这就是 <b>Amdahl 定律</b>：串行部分占比越高，加核收益越小。线程之间的锁竞争也会让实际效果打折扣。</p>`,
    links: [['锁竞争与可伸缩性', '../../02-并发/advanced/11-锁竞争与可伸缩性.html']] },

  { sec: '多线程', q: '单核 CPU 支持 Java 多线程吗？', star: true,
    a: `<p><b>支持</b>。操作系统用<b>时间片轮转</b>把 CPU 时间分给不同线程，单核同一时刻只执行一个线程，但切换得足够快，看起来就像同时在跑（这就是并发而非并行）。</p>
<p>顺带说调度方式：</p>
<ul><li><b>抢占式调度</b>：由 OS 决定什么时候暂停当前线程、换别的线程上（时钟中断、更高优先级任务到来等）。公平，一个线程卡住不会拖死整个系统。</li>
<li><b>协同式调度</b>：线程自己执行完或主动让出，才切换。切换开销小，但一个线程不让就全卡住。</li></ul>
<p><b>Java 平台线程用的是抢占式调度</b>：JVM 自己不调度，交给 OS。线程优先级只是给 OS 的"建议"。</p>`,
    trap: `<p>不要依赖 <code>setPriority()</code> 保证执行顺序。不同 OS 对 Java 的 1~10 优先级映射不一样，有的平台甚至直接忽略。</p>`,
    links: [['常见调度算法', '../../11-操作系统/classic/01-常见调度算法.html']] },

  { sec: '多线程', q: '单核 CPU 上运行多个线程，效率一定会更高吗？', star: true,
    a: `<p><b>不一定，要看任务类型</b>：</p>
<ul><li><b>CPU 密集型</b>（大量计算，比如加解密、压缩）：单核上开多个线程并不能多算一点，反而增加上下文切换开销，<b>效率会下降</b>。</li>
<li><b>IO 密集型</b>（大量等待，比如读文件、调接口、查数据库）：一个线程等 IO 时，别的线程可以用 CPU，<b>效率会提高</b>。</li></ul>
<p>当然线程数也要适度，太多会耗尽内存（每个平台线程都有自己的栈），切换开销也会变大。</p>`,
    more: `<p>这也是线程池参数的经验公式来源：CPU 密集型线程数约等于 <b>核数 + 1</b>；IO 密集型约等于 <b>核数 × (1 + 等待时间 / 计算时间)</b>，常被简化成 2 × 核数。经验值只是起点，最终要靠压测确定。</p>`,
    links: [['ThreadPoolExecutor', '../../02-并发/exec/04-ThreadPoolExecutor.html']] },

  { sec: '多线程', q: '使用多线程可能带来什么问题？',
    a: `<p>多线程不是免费的，常见问题有：</p>
<ul><li><b>线程安全问题</b>：多个线程同时读写共享数据，结果出错（比如计数丢失）。</li>
<li><b>死锁、活锁、饥饿</b>：线程互相等待，或一直得不到执行机会。</li>
<li><b>性能问题</b>：上下文切换、锁竞争，线程开多了反而更慢。</li>
<li><b>内存问题</b>：线程过多耗尽内存；<code>ThreadLocal</code> 用完不 <code>remove()</code> 在线程池里造成内存泄漏。</li>
<li><b>调试困难</b>：问题和时序有关，难以复现。</li></ul>`,
    links: [['死锁', '../../02-并发/advanced/09-死锁.html'], ['活锁与饥饿', '../../02-并发/advanced/10-活锁与饥饿.html']] },

  { sec: '多线程', q: '如何理解线程安全和线程不安全？',
    a: `<p>说的是<b>多个线程同时访问同一份数据时，结果还对不对</b>：</p>
<ul><li><b>线程安全</b>：不管多少线程、以什么顺序交替执行，调用方都不需要额外同步，结果始终正确。</li>
<li><b>线程不安全</b>：多线程同时访问时，数据可能错乱、丢失。经典例子是多个线程对同一个 <code>int</code> 做 <code>count++</code>，最终结果小于预期。</li></ul>
<p>出问题的根源可以归结为三点：<b>原子性</b>（一个操作被拆开、中途被打断）、<b>可见性</b>（一个线程改了，另一个线程看不到）、<b>有序性</b>（指令被重排序）。</p>`,
    more: `<p>让代码线程安全的思路大致三类：<b>不共享</b>（局部变量、ThreadLocal、线程封闭）、<b>不可变</b>（final、不可变对象）、<b>共享就同步</b>（synchronized、Lock、原子类、并发容器）。</p>`,
    trap: `<p>"每个方法都是线程安全的"不等于"组合起来也线程安全"。比如对 <code>ConcurrentHashMap</code> 先 <code>containsKey</code> 再 <code>put</code>，两步之间可能被别人插入，应改用 <code>putIfAbsent</code> / <code>computeIfAbsent</code>。</p>`,
    links: [['线程安全的定义', '../../02-并发/basics/07-线程安全的定义.html'], ['竞态条件的底层硬件原因', '../../11-操作系统/concur/03-竞态条件的底层硬件原因.html']] },

  // ───────────── 死锁 ─────────────
  { sec: '死锁', q: '什么是线程死锁？产生死锁的条件是什么？', star: true,
    a: `<p><b>死锁</b>：多个线程各自持有一部分资源，又都在等对方手里的资源，谁也不让，于是全部无限期阻塞下去。</p>
<pre><code>// 线程 1                         // 线程 2
synchronized (a) {               synchronized (b) {
    sleep(1000);                     sleep(1000);
    synchronized (b) { }             synchronized (a) { }   // 互相等，死锁
}                                }</code></pre>
<p><b>四个必要条件</b>（同时满足才会死锁）：</p>
<ol><li><b>互斥</b>：资源同一时刻只能被一个线程占用。</li>
<li><b>请求与保持</b>：拿着已有的资源不放，同时去申请新的。</li>
<li><b>不可剥夺</b>：别人不能强行抢走你已经拿到的资源。</li>
<li><b>循环等待</b>：线程之间形成首尾相接的等待环。</li></ol>`,
    trap: `<p>示例里的 <code>sleep</code> 只是为了让两个线程各自先拿到第一把锁，稳定复现死锁。实际代码里没有 sleep 也可能死锁，只是概率低，所以更难排查。</p>`,
    links: [['死锁', '../../02-并发/advanced/09-死锁.html'], ['死锁的四个必要条件', '../../11-操作系统/classic/02-死锁的四个必要条件.html']] },

  { sec: '死锁', q: '如何检测死锁？', star: true,
    a: `<ul><li><b>命令行</b>：<code>jps</code> 找到进程号，再 <code>jstack &lt;pid&gt;</code>（或 <code>jcmd &lt;pid&gt; Thread.print</code>）打印线程栈。如果有 Java 级别的死锁，输出末尾会直接写 <code>Found one Java-level deadlock</code>，并列出每个线程持有哪把锁、在等哪把锁。</li>
<li><b>图形工具</b>：JConsole 的"线程"页有"检测死锁"按钮；VisualVM 也会提示死锁。</li>
<li><b>代码里</b>：<code>ThreadMXBean.findDeadlockedThreads()</code> 可以在程序里定时检测，用来做监控告警。</li></ul>`,
    trap: `<p><code>jmap</code> 是看堆内存、导出堆转储用的，不是查死锁的工具，别答错。另外 jstack 能自动识别 synchronized 和 <code>ReentrantLock</code> 这类 JUC 锁造成的死锁，但如果是"线程 A 等 B 的消息、B 等 A 的消息"这类逻辑上的互相等待，它不会报死锁，要靠自己看线程栈分析。</p>`,
    links: [['jps / jstat / jmap / jstack 速查', '../../08-JVM/profiling/01-jps-jstat-jmap-jstack速查.html'], ['JConsole 与 VisualVM', '../../08-JVM/profiling/02-JConsole与VisualVM.html']] },

  { sec: '死锁', q: '如何预防和避免线程死锁？', star: true,
    a: `<p><b>预防</b>：破坏四个必要条件中的一个（互斥通常破坏不了）：</p>
<ul><li><b>破坏请求与保持</b>：一次性申请所有需要的资源。</li>
<li><b>破坏不可剥夺</b>：申请不到新资源时，主动释放已占有的资源。Java 里就是用 <code>tryLock(timeout)</code>，拿不到就放手重试。</li>
<li><b>破坏循环等待</b>：所有线程<b>按固定顺序</b>加锁，反序释放。这是实际开发中最常用的办法。</li></ul>
<p><b>避免</b>：在分配资源前先做计算，确保系统始终处于"安全状态"（存在一种执行顺序能让所有线程都完成），代表是<b>银行家算法</b>。</p>
<pre><code>// 转账时按账户 id 大小决定加锁顺序，所有线程顺序一致，就不会成环
Account first = a.id &lt; b.id ? a : b, second = a.id &lt; b.id ? b : a;
synchronized (first) { synchronized (second) { /* 转账 */ } }</code></pre>`,
    more: `<p>银行家算法在操作系统教材里常见，但业务代码几乎不用：它要求事先知道每个线程最多要多少资源，现实中很难做到。工程上主要靠<b>固定加锁顺序 + 超时放弃 + 缩小锁范围</b>。</p>`,
    links: [['死锁预防、避免、检测与恢复', '../../11-操作系统/classic/03-死锁预防避免检测与恢复.html'], ['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
