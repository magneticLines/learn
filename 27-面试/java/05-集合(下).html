const PAGE_KEY = 'interview:java:05';
const QA = [
  // ───────────── Map ─────────────
  { sec: 'Map', q: 'HashMap 和 Hashtable 有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>HashMap</th><th>Hashtable</th></tr>
<tr><td>线程安全</td><td>不安全</td><td>安全，方法都加了 <code>synchronized</code></td></tr>
<tr><td>性能</td><td>高</td><td>低，整张表共用一把锁</td></tr>
<tr><td>null</td><td>允许 1 个 null key、多个 null value</td><td>key 和 value 都不允许，抛 NPE</td></tr>
<tr><td>默认容量 / 扩容</td><td>16，扩为 2 倍</td><td>11，扩为 2n+1</td></tr>
<tr><td>指定初始容量</td><td>会调整成 ≥ 它的最小 2 的幂</td><td>直接用你给的值</td></tr>
<tr><td>底层（JDK 8）</td><td>数组 + 链表 / 红黑树</td><td>数组 + 链表，没有树化</td></tr></table>
<p>Hashtable 是 JDK 1.0 的老类，已经基本淘汰。要线程安全就用 <code>ConcurrentHashMap</code>。</p>`,
    more: `<p><b>容量为什么一个是 2 的幂、一个是 11？</b>HashMap 用 <code>(n - 1) &amp; hash</code> 算下标，要求 n 是 2 的幂（见后面的题）。Hashtable 用 <code>% n</code> 取模，选奇数、质数更能让结果分散。这是两种不同的设计取舍。</p>
<p>指定容量时，HashMap 靠 <code>tableSizeFor(cap)</code> 用一串位运算把它向上取到 2 的幂，比如传 10 实际是 16。</p>`,
    links: [['散列函数与冲突', '../../01-数据结构/tree/08-散列函数与冲突.html'], ['同步容器', '../../02-并发/blocks/01-同步容器.html']] },

  { sec: 'Map', q: 'HashMap 和 HashSet 有什么区别？',
    a: `<p><b>HashSet 就是用 HashMap 实现的</b>，源码里几乎只是转调：</p>
<pre><code>private transient HashMap&lt;E, Object&gt; map;
private static final Object PRESENT = new Object();  // 所有 value 共用的占位对象

public boolean add(E e) {
    return map.put(e, PRESENT) == null;   // put 返回旧值，为 null 说明是新 key
}</code></pre>
<table><tr><th>HashMap</th><th>HashSet</th></tr>
<tr><td>实现 <code>Map</code></td><td>实现 <code>Set</code></td></tr>
<tr><td>存键值对</td><td>只存元素（元素就是 HashMap 的 key）</td></tr>
<tr><td><code>put</code> 添加</td><td><code>add</code> 添加</td></tr>
<tr><td>用 key 算 hashCode</td><td>用元素本身算 hashCode</td></tr></table>` },

  { sec: 'Map', q: 'HashMap 和 TreeMap 有什么区别？', star: true,
    a: `<ul><li><b>底层</b>：HashMap 是哈希表；TreeMap 是<b>红黑树</b>（一种能自动保持平衡的二叉搜索树）。</li>
<li><b>顺序</b>：HashMap 无序；TreeMap <b>按 key 排序</b>，默认升序，也可以传 <code>Comparator</code> 自定义。</li>
<li><b>复杂度</b>：HashMap 增删查平均 O(1)；TreeMap 都是 O(log n)。</li>
<li><b>额外能力</b>：TreeMap 实现了 <code>NavigableMap</code>，支持<b>范围和邻近查找</b>，比如 <code>firstKey()</code>、<code>floorKey(k)</code>（≤k 的最大 key）、<code>ceilingKey(k)</code>（≥k 的最小 key）、<code>subMap</code>、<code>headMap</code>、<code>tailMap</code>。</li></ul>
<p><b>选法</b>：只要快速存取就用 HashMap；需要按 key 有序遍历或范围查询就用 TreeMap。</p>`,
    more: `<p>TreeMap 的典型场景：按时间戳找"最近一次"记录、一致性哈希环（用 <code>ceilingKey</code> 找顺时针第一个节点）、排行榜。</p>`,
    trap: `<p>TreeMap 判断 key 是否相同用的是 <code>compareTo</code> / <code>compare</code> 返回 0，<b>不是 equals</b>。比较规则写得不严谨，就会把不同的 key 当成同一个覆盖掉。</p>`,
    links: [['红黑树', '../../01-数据结构/tree/05-红黑树.html'], ['二叉搜索树BST', '../../01-数据结构/tree/03-二叉搜索树BST.html']] },

  { sec: 'Map', q: 'HashSet 是如何检查重复的？',
    a: `<p>分两步，<b>先比 hashCode，再比 equals</b>：</p>
<ol><li>先用元素的 <code>hashCode()</code>（经扰动后）算出它该放哪个桶。桶是空的，肯定不重复，直接放。</li>
<li>桶里已经有元素了，就逐个比较：<b>hash 值相同，并且 <code>==</code> 或 <code>equals()</code> 为 true</b>，才算重复，这时不插入，<code>add</code> 返回 false。</li></ol>
<p>先比 hashCode 是为了<b>快</b>：绝大多数不相等的元素在第一步就被排除了，只有少数撞在同一个桶里的才需要调 equals。</p>`,
    trap: `<p>记住 <b>hashCode 和 equals 的约定</b>：equals 相等 → hashCode <b>必须</b>相等；hashCode 相等 → equals <b>不一定</b>相等（这就是哈希冲突）。所以重写 equals 就必须重写 hashCode，否则 HashSet 去重会失效。</p>`,
    links: [['equals与hashCode', '../../00-Java基础/oop/20-equals与hashCode.html']] },

  { sec: 'Map', q: '讲一讲 HashMap 的底层实现。', star: true,
    a: `<p><b>JDK 8 之前</b>：数组 + 链表。数组的每个位置叫一个<b>桶</b>，key 算出桶的下标，多个 key 落到同一个桶（哈希冲突）时就在桶里串成链表，这叫<b>拉链法</b>。</p>
<p><b>JDK 8 之后</b>：数组 + 链表 + <b>红黑树</b>。关键点：</p>
<ol><li><b>定位</b>：<code>hash = h ^ (h &gt;&gt;&gt; 16)</code>（h 是 key 的 hashCode），下标 <code>= (n - 1) &amp; hash</code>。</li>
<li><b>插入</b>：桶空就直接放；不空就遍历链表，找到相同 key 就覆盖 value，找不到就接到<b>链表尾部</b>（JDK 7 是头插）。</li>
<li><b>树化</b>：链表长度超过 <b>8</b>，而且数组长度 ≥ <b>64</b>，就把链表转成红黑树；数组不到 64 就先<b>扩容</b>。树的节点数降到 <b>6</b> 及以下时退化回链表。</li>
<li><b>扩容</b>：元素个数超过 <code>容量 × 负载因子(默认 0.75)</code> 就扩成 2 倍。</li></ol>`,
    more: `<ul><li><b>扰动函数</b> <code>h ^ (h &gt;&gt;&gt; 16)</code>：数组不大时，<code>(n-1) &amp; hash</code> 只用得到 hash 的低几位。把高 16 位异或到低 16 位，让高位也参与计算，减少冲突。JDK 7 的扰动做了多次移位异或，JDK 8 简化成一次。</li>
<li><b>为什么阈值是 8</b>：源码注释说，hashCode 分布良好时，一个桶里的节点数近似服从<b>泊松分布</b>，负载因子 0.75 下长度达到 8 的概率不到千万分之一。树节点的大小大约是普通节点的 2 倍，所以只在极端情况下才树化。</li>
<li><b>为什么退化是 6 不是 8</b>：中间留出缓冲，避免节点数在 8 附近来回增删时反复树化、退化。</li>
<li><b>为什么先扩容而不是树化</b>：数组小时冲突多，往往是容量不够，扩容能直接把链表拆散，比建树更划算。</li>
<li><b>扩容时的 rehash 技巧</b>：容量翻倍后，每个元素要么留在原下标 j，要么搬到 <b>j + oldCap</b>。只要看 <code>hash &amp; oldCap</code> 是 0 还是 1 就知道，不用重新算下标。一条链表被拆成"低位链"和"高位链"两条，相对顺序不变。</li>
<li><b>懒初始化</b>：<code>new HashMap()</code> 时并不分配数组，第一次 put 时才在 <code>resize()</code> 里创建。</li></ul>`,
    trap: `<p>预估要放 1000 个元素，写 <code>new HashMap&lt;&gt;(1000)</code> 还是会扩容一次：容量取到 1024，阈值是 1024 × 0.75 = 768，不够。应该按 <code>预期数量 / 0.75 + 1</code> 来给初始容量。Guava 的 <code>Maps.newHashMapWithExpectedSize</code> 和 JDK 19 的 <code>HashMap.newHashMap(n)</code> 就是帮你算这个的。</p>`,
    links: [['分离链接法', '../../01-数据结构/tree/09-分离链接法.html'], ['再散列与装填因子', '../../01-数据结构/tree/11-再散列与装填因子.html'], ['红黑树', '../../01-数据结构/tree/05-红黑树.html']] },

  { sec: 'Map', q: 'HashMap 的长度为什么是 2 的幂次方？', star: true,
    a: `<p>核心原因：<b>让取模能用位运算代替</b>。</p>
<p>算桶下标本质上是 <code>hash % n</code>。当 n 是 2 的幂时，<code>hash % n == (n - 1) &amp; hash</code>，而位与比取模快得多。</p>
<pre><code>n = 16      → n - 1 = 0000 1111
hash        =  1010 0110
(n-1)&amp;hash  =  0000 0110  → 下标 6，就是 hash 的低 4 位</code></pre>
<p>另外两个好处：</p>
<ul><li><b>分布均匀</b>：n - 1 的二进制低位全是 1，hash 的每一个低位都能影响结果。如果 n - 1 某位是 0，那一位就永远用不上，有些桶永远空着。</li>
<li><b>扩容简单</b>：容量翻倍只是多看 hash 的一位，元素要么留在原位，要么移到 <code>原位 + oldCap</code>，不用重新算。</li></ul>`,
    trap: `<p>这个等式<b>只在 n 是 2 的幂时成立</b>。所以 HashMap 会把你传入的初始容量向上取到 2 的幂，保证等式一直有效。</p>`,
    links: [['运算符', '../../00-Java基础/basics/06-运算符.html']] },

  { sec: 'Map', q: 'HashMap 多线程操作为什么可能导致死循环？', star: true,
    a: `<p>这是 <b>JDK 7 及以前</b>的问题，根源是<b>扩容时用头插法迁移链表</b>。</p>
<ol><li>头插法迁移时，链表顺序会<b>倒过来</b>：原来 A→B，迁移后变成 B→A。</li>
<li>两个线程同时扩容，线程 1 读到 A→B 后被挂起，线程 2 完成迁移变成 B→A。</li>
<li>线程 1 恢复后按自己记住的旧指针继续搬，结果把 A、B 互相指向，形成<b>环形链表</b>（A→B→A）。</li>
<li>之后有线程 <code>get</code> 到这个桶，沿链表找 key 就永远走不完，<b>CPU 飙到 100%</b>。</li></ol>
<p><b>JDK 8 的改进</b>：插入和扩容都改成<b>尾插</b>，扩容时用高低位两条链保持原有顺序，不会再倒置成环。但 HashMap 在多线程下<b>依然不安全</b>，数据丢失的问题还在。</p>`,
    more: `<p>面试讲到"头插导致倒序，并发扩容成环，get 死循环"这一层就够了。线上遇到这类问题，通常是 CPU 突然打满，用 <code>jstack</code> 看到线程卡在 <code>HashMap.get</code> 上。</p>`,
    links: [['CPU飙高排查思路', '../../08-JVM/profiling/05-CPU飙高排查思路.html']] },

  { sec: 'Map', q: 'HashMap 为什么线程不安全？', star: true,
    a: `<p>多个线程同时写 HashMap，会出这几类问题：</p>
<ol><li><b>数据覆盖（JDK 7、8 都有）</b>：线程 1 和线程 2 的 key 落在同一个空桶。线程 1 判断"桶是空的"之后被挂起；线程 2 把自己的节点放进去；线程 1 恢复后不再检查，直接把自己的节点写进桶，<b>线程 2 的数据就丢了</b>。</li>
<li><b>size 不准</b>：<code>++size</code> 是"读-改-写"三步，不是原子操作。两个线程都读到 10，都写回 11，实际插了两个，size 只加了 1。</li>
<li><b>死循环（仅 JDK 7）</b>：并发扩容时头插法形成环形链表。</li></ol>
<p>解决：多线程下用 <code>ConcurrentHashMap</code>。</p>`,
    links: [['线程安全的定义', '../../02-并发/basics/07-线程安全的定义.html'], ['ConcurrentHashMap', '../../02-并发/blocks/02-ConcurrentHashMap.html']] },

  { sec: 'Map', q: 'HashMap 常见的遍历方式有哪些？',
    a: `<pre><code>// 1. entrySet + 增强 for：最常用，一次拿到 key 和 value
for (Map.Entry&lt;String, Integer&gt; e : map.entrySet()) { e.getKey(); e.getValue(); }

// 2. keySet + get：每个 key 还要再查一次表，性能较差
for (String k : map.keySet()) { map.get(k); }

// 3. 迭代器：遍历时需要删除元素就用它
Iterator&lt;Map.Entry&lt;String, Integer&gt;&gt; it = map.entrySet().iterator();
while (it.hasNext()) { if (it.next().getValue() == 0) it.remove(); }

// 4. JDK 8 的 forEach + Lambda：写法最简洁
map.forEach((k, v) -&gt; System.out.println(k + "=" + v));

// 5. Stream：需要过滤、转换时用
map.entrySet().stream().filter(e -&gt; e.getValue() &gt; 0).forEach(...);</code></pre>
<p><b>结论</b>：日常用 <code>entrySet</code> 或 <code>forEach</code>；要边遍历边删用迭代器的 <code>remove</code> 或 <code>entrySet().removeIf(...)</code>。</p>`,
    trap: `<p>在 for-each 或 forEach 里直接调 <code>map.remove(k)</code> 会抛 <code>ConcurrentModificationException</code>，原因和 List 的 fail-fast 一样。</p>`,
    links: [['Lambda表达式', '../../00-Java基础/core/05-Lambda表达式.html'], ['Stream API', '../../00-Java基础/core/07-Stream API.html']] },

  { sec: 'Map', q: 'ConcurrentHashMap 和 Hashtable 有什么区别？', star: true,
    a: `<p>两者都线程安全，都不允许 null。区别在<b>怎么加锁</b>：</p>
<ul><li><b>Hashtable</b>：所有方法用 <code>synchronized</code> 锁住<b>整个对象</b>。一个线程在 put，其他线程连 get 都要等，并发越高越慢。</li>
<li><b>ConcurrentHashMap（JDK 7）</b>：<b>分段锁</b>。把数据分成多个 Segment，每段一把锁，不同段可以同时写。</li>
<li><b>ConcurrentHashMap（JDK 8）</b>：<b>CAS + synchronized 锁单个桶</b>。桶为空时用 CAS 无锁插入，不空时只锁这个桶的头节点。<b>读操作基本不加锁</b>。</li></ul>
<p>打个比方：Hashtable 是整个仓库只有一个门；JDK 7 的 CHM 是分成 16 个库房，各有各的门；JDK 8 的 CHM 是每个货架单独上锁。</p>`,
    more: `<p><b>底层结构也不同</b>：Hashtable 是数组 + 链表；JDK 8 的 CHM 和 HashMap 一样是数组 + 链表 / 红黑树，冲突严重时查找依然是 O(log n)。</p>`,
    links: [['ConcurrentHashMap', '../../02-并发/blocks/02-ConcurrentHashMap.html'], ['线程安全集合', '../../00-Java基础/core/04-线程安全集合.html']] },

  { sec: 'Map', q: 'ConcurrentHashMap 线程安全的具体实现方式是什么？', star: true,
    a: `<p><b>JDK 7：Segment 分段锁</b></p>
<ul><li>结构是 <code>Segment[]</code> + 每段里的 <code>HashEntry[]</code> + 链表。每个 Segment 继承了 <code>ReentrantLock</code>，本身就是一把锁。</li>
<li>put 时先根据 hash 找到 Segment，锁住它，再在段内像 HashMap 一样操作。</li>
<li>Segment 个数默认 16，<b>初始化后不能再变</b>，所以最多支持 16 个线程同时写。</li></ul>
<p><b>JDK 8：Node 数组 + CAS + synchronized</b></p>
<ol><li>数组还没初始化 → 先用 CAS 抢着初始化（通过 <code>sizeCtl</code> 字段保证只有一个线程在做）。</li>
<li>目标桶为空 → 用 <b>CAS</b> 直接放进去，不加锁。</li>
<li>桶头节点的 hash 是 <code>MOVED</code> → 说明正在扩容，当前线程<b>去帮忙扩容</b>。</li>
<li>其他情况 → <code>synchronized</code> 锁住<b>桶的头节点</b>，在链表或红黑树里插入。</li></ol>
<p>get 全程不加锁：节点的 <code>val</code> 和 <code>next</code> 都用 <code>volatile</code> 修饰，保证读到最新值。</p>`,
    more: `<ul><li><b>CAS</b>（Compare-And-Swap）：CPU 提供的原子指令，"内存里的值等于预期值才改成新值"，失败就重试，不用挂起线程。</li>
<li><b>为什么 JDK 8 改用 synchronized，不用 ReentrantLock？</b>JDK 6 之后 synchronized 有了偏向锁、轻量级锁等优化，锁单个桶时竞争很小，性能足够好；而且不用像 Segment 那样每段都带一个锁对象，更省内存。</li>
<li><b>计数</b>：<code>size()</code> 用 <code>baseCount</code> + <code>CounterCell[]</code> 分散计数，思路和 <code>LongAdder</code> 一样，避免所有线程抢着 CAS 同一个变量。</li>
<li><b>多线程协同扩容</b>：扩容时按区间把桶分给多个线程迁移，迁完的桶放一个 <code>ForwardingNode</code> 占位，读到它就去新表里找。</li></ul>`,
    links: [['ConcurrentHashMap', '../../02-并发/blocks/02-ConcurrentHashMap.html'], ['CAS与原子类', '../../02-并发/advanced/05-CAS与原子类.html'], ['synchronized', '../../02-并发/basics/01-synchronized.html'], ['volatile与可见性', '../../02-并发/basics/02-volatile与可见性.html'], ['LongAdder', '../../02-并发/modern/04-LongAdder与LongAccumulator高并发计数.html']] },

  { sec: 'Map', q: 'JDK 1.7 和 JDK 1.8 的 ConcurrentHashMap 实现有什么不同？', star: true,
    a: `<table><tr><th>维度</th><th>JDK 1.7</th><th>JDK 1.8</th></tr>
<tr><td>加锁方式</td><td>Segment 分段锁（ReentrantLock）</td><td>CAS + synchronized</td></tr>
<tr><td>锁粒度</td><td>一个 Segment（包含多个桶）</td><td>一个桶的头节点</td></tr>
<tr><td>数据结构</td><td>Segment 数组 + HashEntry 数组 + 链表</td><td>Node 数组 + 链表 / 红黑树</td></tr>
<tr><td>最大写并发</td><td>Segment 个数，默认 16，初始化后固定</td><td>约等于桶的个数，随扩容增长</td></tr>
<tr><td>size 计算</td><td>先不加锁算几次，结果不一致再锁住所有段</td><td>baseCount + CounterCell 分散累加</td></tr>
<tr><td>冲突严重时查找</td><td>O(n)</td><td>O(log n)</td></tr></table>
<p>一句话：<b>JDK 8 把锁的粒度从"一段"降到了"一个桶"，并引入红黑树，并发度和查询性能都更高</b>。</p>`,
    links: [['ConcurrentHashMap', '../../02-并发/blocks/02-ConcurrentHashMap.html'], ['锁的分类总览', '../../02-并发/advanced/01-锁的分类总览.html']] },

  { sec: 'Map', q: 'ConcurrentHashMap 的 key 和 value 为什么不能为 null？',
    a: `<p>为了<b>避免二义性</b>。<code>map.get(key)</code> 返回 null 时，可能是：</p>
<ul><li>这个 key 根本不存在；</li>
<li>这个 key 存在，但 value 就是 null。</li></ul>
<p>在 HashMap（单线程）里，可以再调一次 <code>containsKey(key)</code> 分清楚。但在并发场景下，<b>get 和 containsKey 之间别的线程可能已经改了 map</b>，两次调用的结果对不上，二义性就没法消除。所以 CHM 干脆禁止 null，<code>get</code> 返回 null 就一定表示"不存在"。</p>
<p>作者 Doug Lea 本人的解释也是这个意思：非并发 Map 里勉强能容忍的歧义，在并发 Map 里无法容忍。</p>`,
    more: `<p>确实需要表达"空值"时，可以定义一个静态的占位对象，比如 <code>static final Object NULL = new Object();</code>，存它来代替 null。</p>`,
    trap: `<p>对比记忆：<code>HashMap</code> 允许 null key 和 null value（null key 的 hash 固定为 0，放在 0 号桶）；<code>Hashtable</code>、<code>ConcurrentHashMap</code>、<code>ConcurrentSkipListMap</code> 都不允许；<code>TreeMap</code> 用自然排序时不允许 null key。</p>` },

  { sec: 'Map', q: 'ConcurrentHashMap 能保证复合操作的原子性吗？', star: true,
    a: `<p><b>不能</b>。CHM 只保证<b>单个方法</b>是线程安全的，多个方法组合起来就不是原子的了。</p>
<pre><code>// ✗ 检查再写入：两个线程可能都判断"不存在"，然后先后 put，后面的覆盖前面的
if (!map.containsKey(key)) map.put(key, value);

// ✓ 用 CHM 自带的原子复合方法
map.putIfAbsent(key, value);
map.computeIfAbsent(key, k -&gt; new ArrayList&lt;&gt;());
map.merge(word, 1, Integer::sum);   // 词频统计：不存在放 1，存在就加 1</code></pre>
<p>常用的原子方法：<code>putIfAbsent</code>、<code>compute</code>、<code>computeIfAbsent</code>、<code>computeIfPresent</code>、<code>merge</code>。不要在外面再套一层 <code>synchronized</code>，那样就浪费了 CHM 细粒度锁的优势。</p>`,
    more: `<p><code>compute</code> 系列方法执行传入的函数时，会<b>持有那个桶的锁</b>，所以函数要<b>短小</b>，而且不能在函数里再修改同一个 map。JDK 8 里在 <code>computeIfAbsent</code> 的函数里递归修改同一个 map 可能导致死循环，JDK 9 起改为抛 <code>IllegalStateException</code>。</p>`,
    trap: `<p>"用了线程安全的集合，代码就线程安全了"是面试和工作中都很常见的误区。线程安全的容器只保证容器内部状态不被破坏，<b>业务上的"先查后改"仍然要自己保证原子性</b>。</p>`,
    links: [['ConcurrentHashMap', '../../02-并发/blocks/02-ConcurrentHashMap.html'], ['线程安全的定义', '../../02-并发/basics/07-线程安全的定义.html']] },

  // ───────────── Collections 工具类 ─────────────
  { sec: 'Collections 工具类', q: 'Collections 工具类有哪些常用的排序操作？',
    a: `<ul><li><code>sort(list)</code> / <code>sort(list, comparator)</code>：按自然顺序或自定义规则升序排序。</li>
<li><code>reverse(list)</code>：反转顺序。</li>
<li><code>shuffle(list)</code>：随机打乱，比如洗牌、抽奖。</li>
<li><code>swap(list, i, j)</code>：交换两个位置的元素。</li>
<li><code>rotate(list, distance)</code>：整体循环移动，distance 为正时把末尾 distance 个元素移到前面。</li></ul>`,
    more: `<p>JDK 8 起 <code>Collections.sort(list)</code> 内部直接调用 <code>list.sort(null)</code>，ArrayList 最终用 <code>Arrays.sort</code> 排序对象数组，算法是 <b>TimSort</b>（归并 + 插入排序的混合），它是<b>稳定</b>的：相等的元素排序后保持原来的相对顺序。</p>`,
    links: [['Collections工具类', '../../00-Java基础/core/03-Collections工具类.html']] },

  { sec: 'Collections 工具类', q: 'Collections 工具类有哪些常用的查找、替换操作？',
    a: `<ul><li><code>binarySearch(list, key)</code>：二分查找，<b>前提是 list 已经有序</b>。</li>
<li><code>max(coll)</code> / <code>min(coll)</code>：按自然顺序或传入的比较器取最大 / 最小元素。</li>
<li><code>frequency(coll, o)</code>：统计某个元素出现的次数。</li>
<li><code>fill(list, obj)</code>：把所有元素都替换成 obj。</li>
<li><code>replaceAll(list, oldVal, newVal)</code>：把所有 oldVal 替换成 newVal。</li>
<li><code>indexOfSubList(list, target)</code>：找子列表第一次出现的位置，找不到返回 -1。</li></ul>`,
    trap: `<p>对无序的 list 调 <code>binarySearch</code> 不会报错，但返回的结果没有意义。找不到时返回的是<b>负数</b>（<code>-(插入点) - 1</code>），不一定是 -1。</p>`,
    links: [['Collections工具类', '../../00-Java基础/core/03-Collections工具类.html']] },

  { sec: 'Collections 工具类', q: 'Collections 的同步控制方法怎么用？为什么不推荐？',
    a: `<p><code>Collections.synchronizedList/Set/Map/Collection(...)</code> 可以把普通集合<b>包装</b>成线程安全的：返回一个包装对象，它的每个方法都先 <code>synchronized</code> 锁住同一个互斥对象，再转调原集合。</p>
<p><b>不推荐的原因</b>：和 Hashtable 一样，所有操作抢同一把锁，并发性能差。需要线程安全时优先用 JUC 的并发容器：<code>ConcurrentHashMap</code>、<code>CopyOnWriteArrayList</code>、<code>ConcurrentLinkedQueue</code> 等。</p>`,
    trap: `<ul><li><b>遍历要自己加锁</b>：包装器只保证单个方法同步，用迭代器、Stream 遍历时要手动 <code>synchronized (list) { for (...) ... }</code>，否则仍可能抛 CME。</li>
<li>拿到包装对象后，<b>别再直接操作原集合</b>，那样绕过了锁。</li></ul>`,
    links: [['同步容器', '../../02-并发/blocks/01-同步容器.html'], ['线程安全集合', '../../00-Java基础/core/04-线程安全集合.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
