const PAGE_KEY = 'interview:java:01';
const QA = [
  // ───────────── 基础概念与常识 ─────────────
  { sec: '基础概念与常识', q: 'Java 语言有哪些特点？',
    a: `<p>挑最有区分度的 5 点说，别背成清单：</p>
<ol><li><b>面向对象</b>：封装、继承、多态。</li>
<li><b>平台无关</b>：源码编译成字节码，交给各平台的 JVM 运行，所以"一次编译，到处运行"。</li>
<li><b>自动内存管理</b>：GC 负责回收对象，没有手动 <code>free</code>，也就少了野指针和重复释放这类问题。</li>
<li><b>语言层面支持多线程</b>：有 <code>Thread</code>、<code>synchronized</code>，还有 JMM 规定多线程之间内存怎么可见。</li>
<li><b>编译与解释并存</b>：先解释执行，热点代码再交给 JIT 编译成机器码，所以性能不差。</li></ol>`,
    trap: `<p>有些老资料说"C++ 没有内置多线程"，这是错的。C++11 起标准库就有 <code>std::thread</code>。面试时别这么对比。</p>` },

  { sec: '基础概念与常识', q: 'Java SE 和 Java EE 有什么区别？',
    a: `<ul><li><b>Java SE</b>（标准版）：语言本身、核心类库（集合、IO、并发、网络）和 JVM。它是所有 Java 程序的基础。</li>
<li><b>Java EE</b>（企业版，现在叫 <b>Jakarta EE</b>）：在 SE 之上加了一套企业级规范，比如 Servlet、JPA、JMS、CDI。</li></ul>
<p>可以这样理解：SE 是发动机，EE 是一套整车标准。今天后端开发大多用 Spring 生态，Spring 用到了其中一部分 EE 规范（比如 Servlet、JPA），但它自己不是 EE 的实现。</p>`,
    trap: `<p>Spring Boot 3 起包名从 <code>javax.*</code> 换成了 <code>jakarta.*</code>，原因就是 Java EE 交给 Eclipse 基金会后改名成了 Jakarta EE。升级 Boot 3 时这是最常见的编译错误来源。</p>` },

  { sec: '基础概念与常识', q: 'JVM、JDK、JRE 三者是什么关系？', star: true,
    a: `<p>一句话：<b>JDK ⊃ JRE ⊃ JVM</b>。</p>
<ul><li><b>JVM</b>：运行字节码的虚拟机，负责类加载、内存管理、GC 和 JIT。每个平台有自己的实现，但都执行同一份字节码。</li>
<li><b>JRE</b>：JVM 加上核心类库，只能<b>运行</b> Java 程序。</li>
<li><b>JDK</b>：JRE 加上开发工具（<code>javac</code>、<code>jdb</code>、<code>jstack</code>、<code>jmap</code>……），能<b>开发</b>和<b>运行</b>。</li></ul>`,
    more: `<p><b>加分点</b>：JDK 9 引入模块系统以后，JDK 11 起官方不再单独发 JRE。现在要一个精简的运行时，是用 <code>jlink</code> 按需要的模块裁剪出来，镜像能小很多，容器部署时很常用。</p>
<p>另外，JVM 是一份<b>规范</b>，HotSpot 只是最常见的实现，还有 OpenJ9、GraalVM 等。</p>`,
    links: [['运行时数据区', '../../00-Java基础/jvm/01-运行时数据区.html']] },

  { sec: '基础概念与常识', q: '什么是字节码？采用字节码的好处是什么？', star: true,
    a: `<p><b>字节码</b>是 <code>javac</code> 编译出来的 <code>.class</code> 文件内容。它是给 JVM 看的中间指令，不对应任何一种真实 CPU。</p>
<p><b>好处</b>：</p>
<ol><li><b>跨平台</b>：同一份字节码，在 Windows、Linux、Mac 的 JVM 上都能跑。平台差异由 JVM 处理，不用每个平台重新编译。</li>
<li><b>兼顾效率</b>：比直接解释源码快，因为词法分析、语法分析已经在编译期做完了。还能再交给 JIT 编译成机器码，接近原生性能。</li>
<li><b>多语言共用 JVM</b>：Kotlin、Scala、Groovy 也编译成字节码，所以能用上整个 Java 生态。</li></ol>`,
    more: `<p>执行流程：<code>.java</code> → javac → <code>.class</code> → 类加载器 → <b>解释器逐条执行</b>；某个方法被调用得足够多，成了热点，就交给 <b>JIT</b> 编译成机器码缓存起来，下次直接执行机器码。</p>`,
    links: [['JIT 即时编译', '../../00-Java基础/jvm/14-JIT即时编译.html']] },

  { sec: '基础概念与常识', q: '为什么说 Java 语言"编译与解释并存"？', star: true,
    a: `<p>因为一段 Java 代码从源码到执行，<b>两种方式都用到了</b>：</p>
<ol><li><b>编译</b>：<code>javac</code> 先把源码编译成字节码（这一步叫前端编译）。</li>
<li><b>解释</b>：JVM 刚开始用解释器逐条执行字节码，启动快。</li>
<li><b>再编译</b>：热点代码被 JIT 编译成本地机器码（这一步叫后端编译），之后直接执行机器码。</li></ol>
<p>对比：C/C++ 是纯编译型，一次性编译成机器码；早期的 Python、JS 是纯解释型，边读边执行。Java 两种都用。</p>`,
    more: `<p><b>追问：为什么不一上来就全部 JIT 编译？</b>编译本身要花时间和内存。大部分代码只执行一两次，编译它们反而亏。先解释执行、只编译热点代码，是在启动速度和峰值性能之间取的平衡。HotSpot 的名字就来自"热点"。</p>` },

  { sec: '基础概念与常识', q: 'AOT 有什么优点？为什么不全部使用 AOT？',
    a: `<p><b>AOT</b>（Ahead-Of-Time）：在<b>运行之前</b>就把程序编译成机器码。代表是 GraalVM Native Image。</p>
<p><b>优点</b>：启动极快（毫秒级），内存占用小，不需要 JIT 预热，打出来是单个可执行文件。很适合云原生、Serverless 这类需要快速扩缩容的场景。</p>
<p><b>为什么不全用</b>：</p>
<ol><li><b>和动态特性冲突</b>：反射、动态代理、运行时加载类，在 AOT 下都要提前配置。而 Spring、MyBatis 这些框架大量依赖这些特性。</li>
<li><b>峰值性能可能不如 JIT</b>：JIT 能根据运行时收集到的数据做激进优化（比如内联、去虚拟化），AOT 编译时拿不到这些信息。</li></ol>`,
    more: `<p>一句话总结：<b>JIT 适合长期运行、追求峰值吞吐；AOT 适合追求启动速度和低内存。</b>Spring Boot 3 已经官方支持 GraalVM Native Image，但构建慢，对反射的限制也多。</p>` },

  { sec: '基础概念与常识', q: 'Oracle JDK 和 OpenJDK 有什么区别？',
    a: `<ul><li><b>OpenJDK</b>：开源（GPL v2 + Classpath Exception）的参考实现，是整个 Java 的源头。</li>
<li><b>Oracle JDK</b>：Oracle 基于 OpenJDK 构建的商业发行版，JDK 11 以后两者代码几乎一样。主要区别在<b>许可证和支持服务</b>，生产环境用它可能要付费。</li></ul>
<p>实际工作中大多用基于 OpenJDK 的免费发行版：<b>Eclipse Temurin、Amazon Corretto、阿里 Dragonwell</b> 等。</p>` },

  { sec: '基础概念与常识', q: 'Java 和 C++ 的区别？',
    a: `<ul><li><b>内存管理</b>：Java 由 GC 自动回收；C++ 要手动 <code>delete</code>，或者用 RAII、智能指针管理。</li>
<li><b>指针</b>：Java 不能直接操作内存地址，只有引用，更安全；C++ 有指针和指针运算。</li>
<li><b>继承</b>：Java 类只能单继承，接口可以多实现；C++ 支持多继承，会碰到菱形继承问题。</li>
<li><b>运行方式</b>：Java 编译成字节码跑在 JVM 上，跨平台；C++ 直接编译成对应平台的机器码。</li>
<li><b>运算符重载</b>：C++ 支持；Java 不支持（只有 String 的 <code>+</code> 是特例）。</li></ul>` },

  // ───────────── 基本语法 ─────────────
  { sec: '基本语法', q: 'Java 注释有哪几种形式？',
    a: `<p>三种：单行 <code>//</code>、多行 <code>/* */</code>、文档注释 <code>/** */</code>。文档注释可以被 <code>javadoc</code> 生成 API 文档，支持 <code>@param</code>、<code>@return</code> 这类标签。</p>
<p><b>加分</b>：注释应该写代码"<b>为什么</b>这么做"，而不是复述它"做了什么"。代码能讲清楚的，就不需要注释。</p>` },

  { sec: '基本语法', q: '标识符和关键字的区别是什么？',
    a: `<p><b>标识符</b>是我们给类、方法、变量起的名字；<b>关键字</b>是语言保留下来、有特殊含义的标识符（如 <code>class</code>、<code>if</code>），不能拿来当名字用。</p>
<p>细节：<code>true</code>、<code>false</code>、<code>null</code> 严格说是<b>字面量</b>，不是关键字，但同样不能当标识符用。<code>goto</code>、<code>const</code> 是保留字，Java 里没有任何功能，但也不能用。</p>` },

  { sec: '基本语法', q: 'Java 语言关键字有哪些？',
    a: `<p>不用背全，按类别说出代表就行：</p>
<ul><li>访问控制：<code>private</code> <code>protected</code> <code>public</code></li>
<li>类/方法/变量修饰：<code>abstract</code> <code>class</code> <code>extends</code> <code>final</code> <code>implements</code> <code>interface</code> <code>native</code> <code>static</code> <code>synchronized</code> <code>transient</code> <code>volatile</code> <code>enum</code></li>
<li>流程控制：<code>if</code> <code>else</code> <code>switch</code> <code>case</code> <code>default</code> <code>for</code> <code>while</code> <code>do</code> <code>break</code> <code>continue</code> <code>return</code> <code>instanceof</code></li>
<li>异常：<code>try</code> <code>catch</code> <code>finally</code> <code>throw</code> <code>throws</code></li>
<li>包：<code>import</code> <code>package</code>；基本类型：<code>int</code> 等 8 个；引用：<code>this</code> <code>super</code></li></ul>`,
    trap: `<p><code>default</code> 身兼三职：switch 的默认分支、接口的默认方法（Java 8）、注解属性的默认值。另外 <code>var</code>（Java 10）、<code>record</code>、<code>sealed</code>、<code>permits</code> 是<b>上下文关键字</b>，在其他位置仍然可以当变量名用。</p>` },

  { sec: '基本语法', q: '自增自减运算符 i++ 和 ++i 有什么区别？', star: true,
    a: `<p>两者都会让 i 加 1，区别在<b>整个表达式的值</b>：</p>
<ul><li><code>++i</code>：先加 1，再用加完后的值。</li>
<li><code>i++</code>：先用原来的值，再加 1。</li></ul>
<pre><code>int i = 1;
int a = i++;  // a = 1, i = 2
int b = ++i;  // b = 3, i = 3</code></pre>`,
    trap: `<p>经典坑：<code>i = i++;</code> 执行完 i <b>不变</b>。</p>
<pre><code>int i = 1;
i = i++;   // i 仍是 1
// 字节码层面：先把 i 的旧值(1)压入操作数栈，再把局部变量 i 自增为 2，
// 最后把栈顶的旧值 1 赋回 i —— 自增结果被覆盖了</code></pre>
<p>另外 <code>i++</code> <b>不是原子操作</b>，它包含读、改、写三步。多线程计数要用 <code>AtomicInteger</code>，这是并发面试的高频追问。</p>` },

  { sec: '基本语法', q: '移位运算符有哪些？有什么用？', star: true,
    a: `<ul><li><code>&lt;&lt;</code> 左移：低位补 0，相当于 ×2<sup>n</sup>（不溢出时）。</li>
<li><code>&gt;&gt;</code> 带符号右移：高位补符号位，相当于 ÷2<sup>n</sup>（向下取整）。</li>
<li><code>&gt;&gt;&gt;</code> 无符号右移：高位一律补 0。</li></ul>
<p><b>用途</b>：比乘除运算快，JDK 源码里很常见。比如 HashMap 的 <code>hash()</code> 用 <code>h ^ (h &gt;&gt;&gt; 16)</code> 把高位混进低位；ArrayList 扩容用 <code>oldCapacity + (oldCapacity &gt;&gt; 1)</code>，也就是扩到 1.5 倍。</p>`,
    trap: `<p>移位只对 <code>int</code>/<code>long</code> 生效，<code>byte</code>/<code>short</code>/<code>char</code> 会先提升为 int 再移。<b>移位位数会先取模</b>：int 对 32 取模，long 对 64 取模，所以 <code>1 &lt;&lt; 32</code> 结果是 <code>1</code> 而不是 0。</p>`,
    links: [['运算符', '../../00-Java基础/basics/06-运算符.html']] },

  { sec: '基本语法', q: 'continue、break 和 return 的区别是什么？',
    a: `<ul><li><code>continue</code>：跳过<b>本次</b>循环剩下的部分，进入下一次循环。</li>
<li><code>break</code>：跳出<b>整个</b>循环（或 switch）。</li>
<li><code>return</code>：结束<b>整个方法</b>，可以带返回值。</li></ul>
<p>补充：<code>break label</code> / <code>continue label</code> 可以直接跳出或继续外层循环，常用在嵌套循环里。</p>`,
    links: [['break-continue-label', '../../00-Java基础/basics/13-break-continue-label.html']] },

  // ───────────── 基本数据类型 ─────────────

    a: `<p>8 种，分 4 类：</p>
<table><tr><th>类别</th><th>类型</th><th>字节</th><th>默认值</th></tr>
<tr><td rowspan="4">整数</td><td>byte</td><td>1</td><td>0</td></tr>
<tr><td>short</td><td>2</td><td>0</td></tr>
<tr><td>int</td><td>4</td><td>0</td></tr>
<tr><td>long</td><td>8</td><td>0L</td></tr>
<tr><td rowspan="2">浮点</td><td>float</td><td>4</td><td>0f</td></tr>
<tr><td>double</td><td>8</td><td>0d</td></tr>

<p>各类型大小由规范固定，不随平台变化，这也是 Java 可移植的一部分原因。</p>`,

  { sec: '基本数据类型', q: '基本类型和包装类型有什么区别？', star: true,
    a: `<ul><li><b>默认值</b>：包装类型成员变量的默认值是 <code>null</code>，基本类型有 0/false 这样的默认值。</li>
<li><b>泛型</b>：泛型只能用包装类型，<code>List&lt;int&gt;</code> 不合法。</li>
<li><b>存储</b>：基本类型的<b>局部变量</b>直接放在栈帧的局部变量表里；包装类型是对象，引用在栈上，对象本身在堆上。</li>
<li><b>比较</b>：基本类型用 <code>==</code> 比值；包装类型用 <code>==</code> 比的是地址，比值要用 <code>equals</code>。</li>
<li><b>开销</b>：包装对象带对象头，一个 <code>Integer</code> 约 16 字节，而 int 只有 4 字节。</li></ul>`,
    trap: `<p><b>误区</b>："基本类型都存在栈上"是错的。基本类型的<b>成员变量</b>跟着对象存在堆上；逃逸分析之后，某些对象反而可能在栈上分配或被标量替换。</p>
<p>实践：<b>POJO/DTO 的属性用包装类型</b>，因为 null 能表达"没有值"，比如数据库字段为 NULL。<b>局部计算用基本类型</b>，避免拆箱时 NPE 和额外开销。</p>`,
    links: [['包装类与自动装箱', '../../00-Java基础/basics/05-包装类与自动装箱.html']] },

  { sec: '基本数据类型', q: '包装类型的缓存机制了解么？', star: true,
    a: `<p><code>Byte</code>/<code>Short</code>/<code>Integer</code>/<code>Long</code> 默认缓存 <b>[-128, 127]</b>，<code>Character</code> 缓存 [0, 127]，<code>Boolean</code> 直接缓存 TRUE/FALSE。<code>Float</code>/<code>Double</code> <b>没有缓存</b>。</p>
<p>原理：<code>Integer.valueOf(i)</code> 发现值在范围内，就从 <code>IntegerCache</code> 数组里返回同一个对象，不再新建。</p>
<pre><code>Integer a = 127, b = 127;
a == b;   // true：同一个缓存对象
Integer c = 128, d = 128;
c == d;   // false：两个新对象
new Integer(127) == a;  // false：new 一定是新对象(且已废弃)</code></pre>`,
    more: `<p><b>为什么缓存</b>：小整数用得特别多（循环计数、状态码），复用对象能减少创建和 GC 的压力，这是享元模式的一个例子。Integer 缓存的上限可以用 <code>-XX:AutoBoxCacheMax</code> 调大。</p>`,
    trap: `<p>结论：<b>包装类型之间比较值，一律用 <code>equals</code></b>。阿里规约把这条列为强制。线上 bug 常常出在测试数据都小于 128，一上生产就出错。</p>` },

  { sec: '基本数据类型', q: '自动装箱与拆箱是什么？原理是什么？', star: true,
    a: `<ul><li><b>装箱</b>：基本类型 → 包装类型，编译器自动插入 <code>Integer.valueOf(x)</code>。</li>
<li><b>拆箱</b>：包装类型 → 基本类型，编译器自动插入 <code>x.intValue()</code>。</li></ul>
<p>这是<b>语法糖</b>，编译期完成，看字节码就能看到这些方法调用。</p>`,
    trap: `<ol><li><b>拆箱 NPE</b>：<code>Integer x = null; int y = x;</code> 抛 NPE，因为实际执行的是 <code>x.intValue()</code>。三元运算符也会触发：<code>flag ? integerObj : 0</code> 在 integerObj 为 null 时会 NPE。</li>
<li><b>循环里频繁装箱</b>：<code>Long sum = 0L; for(...) sum += i;</code> 每次都会新建 Long 对象，性能很差，应该改用 <code>long</code>。</li></ol>`,
    links: [['包装类与自动装箱', '../../00-Java基础/basics/05-包装类与自动装箱.html'], ['三元运算符', '../../00-Java基础/basics/07-三元运算符.html']] },

  { sec: '基本数据类型', q: '为什么浮点数运算会有精度丢失？', star: true,
    a: `<p>因为计算机用<b>二进制</b>存小数（IEEE 754 标准），而很多十进制小数换成二进制是<b>无限循环</b>的。比如 0.1 = 0.0001100110011…(二进制)，只能截断存储，于是出现误差。</p>
<pre><code>0.1 + 0.2 == 0.3;         // false
System.out.println(0.1 + 0.2);  // 0.30000000000000004</code></pre>
<p>这和我们用十进制写不尽 1/3 = 0.333… 是同一个道理，只是换成了二进制。</p>` },

  { sec: '基本数据类型', q: '如何解决浮点数运算的精度丢失问题？',

  { sec: '基本数据类型', q: '超过 long 范围的整数怎么表示？',

    more: `<p><b>追问：为什么局部变量没有默认值？</b>成员变量在对象创建时 JVM 会把内存清零，天然就有默认值。局部变量在栈帧里，要是也自动清零就多一份开销；而且不赋值就用几乎总是 bug，所以编译器干脆强制你初始化。</p>`,

  { sec: '方法', q: '静态方法和实例方法有何不同？', star: true,

<tr><td>发生位置</td><td>同一个类（或父子类）</td><td>子类重写父类</td></tr>
<tr><td>参数列表</td><td><b>必须不同</b></td><td><b>必须相同</b></td></tr>

<p>重写的规则可以记成"<b>两同两小一大</b>"：方法名、参数相同；返回值、异常更小或相等；访问权限更大或相等。</p>`,

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
</html>
