const PAGE_KEY = 'interview:java:02';
const QA = [
  // ───────────── 面向对象基础 ─────────────
  { sec: '面向对象基础', q: '面向对象和面向过程有什么区别？', star: true,
    a: `<p>区别在于<b>拆解问题的方式</b>：</p>
<ul><li><b>面向过程（POP）</b>：把问题拆成一个个<b>步骤</b>，每步写成一个函数，按顺序调用。关注"先做什么、再做什么"。C 语言是代表。</li>
<li><b>面向对象（OOP）</b>：先找出问题里的<b>对象</b>（有数据也有行为的"东西"），让对象之间互相协作。关注"谁来做"。Java 是代表。</li></ul>
<p>举例：算圆的面积。面向过程就是写一个 <code>area(r)</code> 函数；面向对象是定义一个 <code>Circle</code> 类，半径是它的属性，<code>area()</code> 是它自己的方法。</p>
<p>OOP 靠封装、继承、多态，让代码<b>更容易维护、复用和扩展</b>，适合大型、需求多变的系统。</p>`,
    trap: `<p>别说"面向过程性能一定比面向对象高"。性能主要取决于语言的执行方式和代码写法，和编程范式没有必然关系。而且两者不是对立的：面向对象的方法内部，写的依然是一步步的过程代码。</p>`,
    links: [['类的定义与实例化', '../../00-Java基础/oop/01-类的定义与实例化.html']] },

  { sec: '面向对象基础', q: '创建一个对象用什么运算符？对象实例与对象引用有什么不同？',
    a: `<p>用 <b><code>new</code></b> 运算符。<code>new</code> 在<b>堆</b>上创建对象实例，并返回一个指向它的<b>引用</b>。</p>
<pre><code>Person p = new Person();
// new Person() 是堆里的对象实例；p 是引用，局部变量时存在栈帧里</code></pre>
<p>打个比方：对象实例是气球，引用是牵气球的绳子。</p>
<ul><li>一个引用同一时刻最多指向 <b>0 或 1</b> 个对象（可以是 <code>null</code>）。</li>
<li>一个对象可以被 <b>多个</b> 引用同时指向，也就是多根绳子拴同一个气球。</li></ul>`,
    more: `<p>对象没有任何引用能访问到时（从 GC Roots 出发不可达），就会成为垃圾回收的候选。所以"断开引用"就是让对象可以被回收的方式。</p>`,
    links: [['对象的创建过程', '../../08-JVM/memory/06-对象的创建过程.html'], ['可达性分析', '../../00-Java基础/jvm/07-可达性分析.html']] },

  { sec: '面向对象基础', q: '对象的相等和引用相等有什么区别？', star: true,
    a: `<ul><li><b>引用相等</b>：两个引用指向的是<b>同一个对象</b>（内存地址相同），用 <code>==</code> 判断。</li>
<li><b>对象相等</b>：两个对象的<b>内容</b>在业务意义上相同，用 <code>equals()</code> 判断（前提是类正确重写了 <code>equals</code>）。</li></ul>
<pre><code>String a = "hi";
String b = new String("hi");
a == b;        // false：不是同一个对象
a.equals(b);   // true：内容相同</code></pre>
<p>引用相等一定对象相等，反过来不一定。</p>`,
    links: [['equals 与 hashCode', '../../00-Java基础/oop/20-equals与hashCode.html']] },

  { sec: '面向对象基础', q: '如果一个类没有声明构造方法，该程序能正确执行吗？',
    a: `<p><b>能</b>。类里一个构造方法都没写时，编译器会自动生成一个<b>无参的默认构造方法</b>（方法体里只调用 <code>super()</code>）。</p>
<p>但<b>只要你自己写了任意一个构造方法</b>（哪怕是带参的），编译器就不再生成无参的那个了。</p>`,
    trap: `<p>常见坑：给实体类加了一个带参构造方法，结果 Jackson 反序列化、JPA/Hibernate、MyBatis 这些框架报错。原因是它们默认要通过<b>无参构造方法</b>反射创建对象，而它已经不存在了。所以写了带参构造时，最好把无参构造也显式写上（Lombok 用 <code>@NoArgsConstructor</code>）。</p>`,
    links: [['构造方法', '../../00-Java基础/oop/02-构造方法.html']] },

  { sec: '面向对象基础', q: '构造方法有哪些特点？构造方法能不能被 override（重写）？',
    a: `<p><b>特点</b>：</p>
<ol><li>方法名和类名<b>完全相同</b>。</li>
<li><b>没有返回类型</b>，连 <code>void</code> 也不写。</li>
<li>在 <code>new</code> 创建对象时<b>自动调用</b>，不能像普通方法那样手动调。</li></ol>
<p><b>不能被重写，但能被重载</b>。重写的前提是子类继承了父类的方法，而构造方法不会被继承（子类构造方法名要和子类同名，本来就和父类的不一样）。一个类里可以写多个参数不同的构造方法，这就是重载。</p>`,
    more: `<p>子类构造方法第一行会隐式调用 <code>super()</code>，先初始化父类部分。如果父类没有无参构造方法，子类就必须显式写 <code>super(参数)</code>，否则编译报错。</p>`,
    trap: `<p>如果写了 <code>public void Person() {}</code>，它是一个<b>和类同名的普通方法</b>，不是构造方法。编译能通过，但 <code>new</code> 的时候不会调用它。</p>`,
    links: [['构造方法', '../../00-Java基础/oop/02-构造方法.html'], ['继承与 super', '../../00-Java基础/oop/07-继承与super.html']] },

  { sec: '面向对象基础', q: '面向对象的三大特征是什么？分别怎么理解？', star: true,
    a: `<ul><li><b>封装</b>：把数据藏在对象内部（<code>private</code>），只通过方法对外暴露受控的访问。好处是外部不能随便改内部状态，比如 setter 里可以做校验。</li>
<li><b>继承</b>：子类用 <code>extends</code> 复用父类的属性和方法，还能添加新功能或重写已有功能。Java 类只能<b>单继承</b>。子类会拥有父类的 private 成员，只是不能直接访问。</li>
<li><b>多态</b>：同一个父类引用，指向不同子类对象时，调用同一个方法表现出不同的行为。</li></ul>
<pre><code>Animal a = new Dog();
a.speak();   // 编译时看 Animal 有没有 speak，运行时执行 Dog 的实现</code></pre>
<p>多态的三个条件：<b>继承（或实现接口）+ 重写 + 父类引用指向子类对象</b>。</p>`,
    more: `<p><b>多态怎么实现的</b>：调用实例方法时，JVM 用 <code>invokevirtual</code> 指令，在运行时根据对象的<b>实际类型</b>查虚方法表，找到真正要执行的方法（动态分派）。</p>
<p>多态的价值：写代码时面向抽象（接口）编程。Spring 注入 <code>UserService</code> 接口，具体用哪个实现由容器决定，调用方完全不用改。</p>`,
    trap: `<ul><li>多态<b>只针对实例方法</b>。成员变量和静态方法没有多态，按引用的声明类型访问。</li>
<li>父类引用<b>不能直接调用子类特有的方法</b>，要先向下转型，转之前最好用 <code>instanceof</code> 判断，否则可能 <code>ClassCastException</code>。</li></ul>`,
    links: [['访问修饰符', '../../00-Java基础/oop/06-访问修饰符.html'], ['继承与 super', '../../00-Java基础/oop/07-继承与super.html'], ['多态与转型', '../../00-Java基础/oop/09-多态与转型.html'], ['虚方法表', '../../08-JVM/bytecode/05-虚方法表.html']] },

  { sec: '面向对象基础', q: '接口和抽象类有什么共同点和区别？', star: true,
    a: `<p><b>共同点</b>：都<b>不能直接实例化</b>；都可以有抽象方法，要由子类/实现类去实现；Java 8 起接口也能用 <code>default</code> 写有方法体的方法。</p>
<table><tr><th>维度</th><th>接口 interface</th><th>抽象类 abstract class</th></tr>
<tr><td>设计目的</td><td>定义<b>能力/规范</b>（can-do），如 <code>Comparable</code></td><td>抽取<b>共性、复用代码</b>（is-a）</td></tr>
<tr><td>继承数量</td><td>一个类可以实现<b>多个</b>接口</td><td>只能继承<b>一个</b>类</td></tr>
<tr><td>成员变量</td><td>只能是 <code>public static final</code> 常量</td><td>任意，可以有实例变量</td></tr>
<tr><td>构造方法</td><td>没有</td><td>可以有（给子类调用）</td></tr>
<tr><td>方法</td><td>抽象方法、default、static（8+）、private（9+）</td><td>任意方法</td></tr></table>`,
    more: `<p><b>怎么选</b>：优先用接口，因为它更灵活、不占用唯一的继承名额。需要在几个子类之间共享状态或模板代码时，再用抽象类。JDK 里常见的组合是<b>"接口 + 抽象骨架类"</b>：<code>List</code> 接口配 <code>AbstractList</code>，Spring 的 <code>BeanFactory</code> 配 <code>AbstractBeanFactory</code>。</p>
<p><b>追问：default 方法为什么出现？</b>为了让老接口能加新方法而不破坏已有实现类。比如 Java 8 给 <code>Collection</code> 加 <code>stream()</code>、给 <code>Iterable</code> 加 <code>forEach()</code>，如果没有 default，所有实现类都会编译失败。</p>`,
    trap: `<p>实现的两个接口有<b>同签名的 default 方法</b>时，实现类必须自己重写它，否则编译报错。可以在重写里用 <code>A.super.method()</code> 指定调用哪个接口的版本。</p>`,
    links: [['抽象类 abstract', '../../00-Java基础/oop/11-抽象类abstract.html'], ['接口 interface', '../../00-Java基础/oop/12-接口interface.html'], ['接口 vs 抽象类', '../../00-Java基础/oop/13-接口vs抽象类.html']] },

  { sec: '面向对象基础', q: '深拷贝和浅拷贝有什么区别？什么是引用拷贝？',
    a: `<ul><li><b>引用拷贝</b>：只复制引用，两个引用指向<b>同一个对象</b>。<code>Person b = a;</code> 就是。</li>
<li><b>浅拷贝</b>：新建一个对象，基本类型字段复制值；<b>引用类型字段只复制引用</b>，新旧对象共享内部的子对象。</li>
<li><b>深拷贝</b>：新建对象，并且把内部引用的子对象<b>也递归复制一份</b>，新旧对象完全独立。</li></ul>
<pre><code>class Person implements Cloneable {
    Address addr;
    @Override
    public Person clone() throws CloneNotSupportedException {
        Person p = (Person) super.clone();   // 浅拷贝：p.addr 和 this.addr 是同一个对象
        p.addr = addr.clone();               // 把子对象也复制一份，才变成深拷贝
        return p;
    }
}</code></pre>`,
    more: `<p><code>Object.clone()</code> 默认就是浅拷贝，而且类必须实现 <code>Cloneable</code> 标记接口，否则抛 <code>CloneNotSupportedException</code>。实际开发中更常用<b>拷贝构造方法</b>、序列化（如用 JSON 转一遍）或 MapStruct 这类工具来做拷贝。</p>`,
    trap: `<p><code>String</code>、<code>Integer</code> 这类不可变对象，浅拷贝共享也没问题，因为谁也改不了它。真正要深拷贝的是可变的子对象，比如 <code>List</code>、自定义的 <code>Address</code>。</p>`,
    links: [['clone 与深浅拷贝', '../../00-Java基础/oop/23-clone与深浅拷贝.html']] },

  // ───────────── Object ─────────────
  { sec: 'Object', q: 'Object 类有哪些常见方法？', star: true,
    a: `<p><code>Object</code> 是所有类的父类，常用的方法按用途分几组：</p>
<ul><li><b>比较与哈希</b>：<code>equals()</code>、<code>hashCode()</code></li>
<li><b>描述</b>：<code>toString()</code>，默认返回 <code>类名@哈希码的十六进制</code></li>
<li><b>类型信息</b>：<code>getClass()</code>，返回运行时的 Class 对象（final，不能重写）</li>
<li><b>拷贝</b>：<code>clone()</code>（protected，浅拷贝）</li>
<li><b>线程协作</b>：<code>wait()</code>、<code>notify()</code>、<code>notifyAll()</code>（final）</li>
<li><b>回收前回调</b>：<code>finalize()</code>，JDK 9 起已废弃</li></ul>`,
    more: `<p><b>追问：wait/notify 为什么定义在 Object 里而不是 Thread 里？</b>因为 Java 里<b>任何对象都能当锁</b>（<code>synchronized(obj)</code>），而 wait/notify 是在"某个锁"上等待和唤醒，所以要放在所有对象都有的 Object 上。调用它们前必须先持有该对象的锁，否则抛 <code>IllegalMonitorStateException</code>。</p>`,
    trap: `<p>别再用 <code>finalize()</code> 做资源清理：什么时候执行、会不会执行都不确定，还会拖慢 GC。关资源用 <code>try-with-resources</code>。</p>`,
    links: [['toString', '../../00-Java基础/oop/21-toString.html'], ['finalize 方法的角色与陷阱', '../../08-JVM/gc/03-finalize方法的角色与陷阱.html'], ['synchronized', '../../02-并发/basics/01-synchronized.html']] },

  { sec: 'Object', q: '== 和 equals() 有什么区别？', star: true,
    a: `<ul><li><b><code>==</code></b>：基本类型比较<b>值</b>；引用类型比较<b>地址</b>（是不是同一个对象）。</li>
<li><b><code>equals()</code></b>：只能用在引用类型上。<code>Object</code> 里的默认实现就是 <code>this == obj</code>，和 <code>==</code> 一样。但很多类重写了它来比较<b>内容</b>，比如 <code>String</code>、<code>Integer</code>、<code>BigDecimal</code>。</li></ul>
<p>所以一句话：<code>==</code> 行为固定，<code>equals</code> 的含义看类有没有重写。</p>`,
    more: `<p>重写 <code>equals</code> 要满足五条约定：<b>自反性、对称性、传递性、一致性</b>，以及 <code>x.equals(null)</code> 返回 false。用 IDE 生成或 <code>Objects.equals(a, b)</code> 可以避免手写出错，后者还能处理 null。</p>`,
    trap: `<ul><li>调用 <code>equals</code> 时把<b>确定不为 null 的对象放前面</b>：<code>"abc".equals(s)</code>，而不是 <code>s.equals("abc")</code>，否则 s 为 null 时 NPE。</li>
<li>包装类型之间比较数值要用 <code>equals</code>，但注意 <code>Integer.valueOf(1).equals(1L)</code> 是 false，因为类型不同。</li></ul>`,
    links: [['equals 与 hashCode', '../../00-Java基础/oop/20-equals与hashCode.html'], ['包装类与自动装箱', '../../00-Java基础/basics/05-包装类与自动装箱.html']] },

  { sec: 'Object', q: 'hashCode() 有什么用？', star: true,
    a: `<p><code>hashCode()</code> 返回一个 <code>int</code> 类型的<b>哈希码</b>（也叫散列码）。它的作用是<b>快速确定对象在哈希表里放在哪个位置</b>。</p>
<p>它主要服务于 <code>HashMap</code>、<code>HashSet</code>、<code>ConcurrentHashMap</code> 这类哈希结构。比如 HashMap 用 key 的 hashCode 算出数组下标，直接定位到桶，查找平均是 O(1)。</p>`,
    more: `<p><code>Object.hashCode()</code> 是 <code>native</code> 方法，由 JVM 生成。常听到"它就是对象的内存地址"，这<b>不准确</b>：HotSpot 默认用的是一种随机数算法，生成后存在对象头的 Mark Word 里，之后保持不变。</p>`,
    links: [['对象头与 Mark Word', '../../08-JVM/memory/08-对象头与MarkWord.html']] },

  { sec: 'Object', q: '为什么要有 hashCode？只用 equals 不行吗？', star: true,
    a: `<p>为了<b>性能</b>。以 <code>HashSet</code> 里加元素为例：</p>
<ol><li>先算新元素的 hashCode，找到对应的桶。</li>
<li>桶是空的，直接放进去，<b>完全不用调用 equals</b>。</li>
<li>桶里已经有元素（哈希冲突），才对这几个元素逐个调用 <code>equals</code> 比较。</li></ol>
<p>如果只有 equals，每加一个元素都要和集合里<b>所有元素</b>比一遍，复杂度 O(n)。hashCode 先把比较范围缩小到一个桶，equals 只在很小的范围里做精确判断。</p>
<p>它们的关系：</p>
<ul><li>hashCode 不同 → 对象<b>一定不相等</b>。</li>
<li>hashCode 相同 → 对象<b>不一定相等</b>（哈希冲突），还要 equals 确认。</li></ul>`,
    links: [['集合框架', '../../00-Java基础/core/01-集合框架.html']] },

  { sec: 'Object', q: '为什么重写 equals() 时必须重写 hashCode() 方法？', star: true,
    a: `<p>因为约定要求：<b>equals 相等的两个对象，hashCode 必须相等</b>。只重写 equals 不重写 hashCode，两个"内容相等"的对象会得到不同的 hashCode（用的是 Object 的默认实现），放进哈希集合时就出问题：</p>
<pre><code>Set&lt;User&gt; set = new HashSet&lt;&gt;();
set.add(new User("tom"));
set.contains(new User("tom"));   // false！hashCode 不同，去了别的桶，根本没机会调 equals
set.add(new User("tom"));        // 加进去了，Set 里出现两个"相等"的元素</code></pre>
<p>反过来不要求：hashCode 相同的两个对象，equals 可以不相等（就是哈希冲突）。</p>`,
    trap: `<ul><li>hashCode 用到的字段要和 equals 用到的<b>保持一致</b>。常用 <code>Objects.hash(name, age)</code> 生成，或者直接用 Lombok 的 <code>@EqualsAndHashCode</code>、Java 16 的 <code>record</code>。</li>
<li><b>对象放进 HashSet / 作为 HashMap 的 key 后，不要再修改参与 hashCode 计算的字段</b>，否则它的哈希值变了，再也找不到，也删不掉，造成内存泄漏。</li></ul>`,
    links: [['equals 与 hashCode', '../../00-Java基础/oop/20-equals与hashCode.html'], ['Record 类', '../../00-Java基础/oop/19-Record类.html']] },

  // ───────────── String ─────────────
  { sec: 'String', q: 'String、StringBuffer、StringBuilder 有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>String</th><th>StringBuffer</th><th>StringBuilder</th></tr>
<tr><td>可变性</td><td><b>不可变</b></td><td>可变</td><td>可变</td></tr>
<tr><td>线程安全</td><td>安全（因为不可变）</td><td>安全（方法加了 <code>synchronized</code>）</td><td><b>不安全</b></td></tr>
<tr><td>性能</td><td>每次修改都新建对象，最慢</td><td>有加锁开销</td><td>最快</td></tr></table>
<p><b>怎么选</b>：数据很少改动用 <code>String</code>；单线程下大量拼接用 <code>StringBuilder</code>（绝大多数场景）；多线程共享同一个缓冲区才用 <code>StringBuffer</code>，实际很少见。</p>`,
    more: `<p>StringBuffer 和 StringBuilder 都继承自 <code>AbstractStringBuilder</code>，内部是一个<b>可扩容的数组</b>，<code>append</code> 直接往数组里写，空间不够时扩容（大约变成原来的 2 倍 + 2）。如果能预估长度，构造时传入初始容量可以减少扩容。</p>`,
    trap: `<p>StringBuilder 通常是方法里的局部变量，只有一个线程用，所以"线程不安全"在这种场景下根本不是问题。别为了"安全"盲目用 StringBuffer。</p>`,
    links: [['StringBuilder', '../../00-Java基础/basics/24-StringBuilder.html']] },

  { sec: 'String', q: 'String 为什么是不可变的？这样设计有什么好处？', star: true,
    a: `<p><b>怎么做到不可变的</b>（JDK 9 起内部是 <code>byte[]</code>，之前是 <code>char[]</code>）：</p>
<ol><li>存数据的数组是 <code>private final</code> 的，外部拿不到，引用也不能换。</li>
<li>String 类<b>没有提供任何修改数组内容的方法</b>，<code>substring</code>、<code>replace</code> 等都返回新对象。</li>
<li>String 类本身是 <code>final</code> 的，不能被继承，避免子类破坏不可变性。</li></ol>
<p><b>好处</b>：</p>
<ul><li><b>字符串常量池</b>才能成立：多个引用共享同一个 "abc"，谁也改不了它。</li>
<li><b>hash 可以缓存</b>：hashCode 算一次就存起来，做 HashMap 的 key 很高效。</li>
<li><b>安全</b>：类名、文件路径、URL、数据库连接串都用 String 传，不会在校验之后被悄悄改掉。</li>
<li><b>天然线程安全</b>，不用加锁就能在多线程之间共享。</li></ul>`,
    more: `<p><b>追问：JDK 9 为什么把 char[] 改成 byte[]？</b>这叫<b>紧凑字符串</b>（Compact Strings）。char 占 2 字节，但大多数字符串只有 Latin-1 字符，1 字节就够。改成 byte[] 后加一个 <code>coder</code> 字段标记编码：纯 Latin-1 时每个字符 1 字节，否则用 UTF-16 占 2 字节，常见场景下能省一半内存。</p>`,
    trap: `<p><b>误区</b>："因为数组被 final 修饰，所以 String 不可变"。final 只保证数组<b>引用</b>不能指向别的数组，数组里的元素依然可以改。真正的原因是 private + 没有修改方法 + 类是 final 三者一起。</p>`,
    links: [['String 不可变性', '../../00-Java基础/basics/22-String不可变性.html'], ['不变性与 final', '../../02-并发/basics/09-不变性与final.html'], ['final', '../../00-Java基础/oop/10-final.html']] },

  { sec: 'String', q: '字符串拼接用 "+" 还是 StringBuilder？', star: true,
    a: `<p><b>普通的一行拼接用 "+" 就行；在循环里拼接要用 StringBuilder。</b></p>
<p>原因："+" 是语法糖。JDK 8 中编译器会把 <code>a + b + c</code> 翻译成 <code>new StringBuilder().append(a).append(b).append(c).toString()</code>，一行拼接只建一个 StringBuilder，没问题。</p>
<p>但放在循环里，<b>每次循环都会新建一个 StringBuilder</b>，还会产生一个新的中间字符串：</p>
<pre><code>String s = "";
for (int i = 0; i &lt; 10000; i++) s += i;   // 每轮都新建对象，性能很差

StringBuilder sb = new StringBuilder();
for (int i = 0; i &lt; 10000; i++) sb.append(i);   // 全程只用一个 StringBuilder</code></pre>`,
    more: `<p>JDK 9 起（JEP 280），"+" 不再固定编译成 StringBuilder，而是用 <code>invokedynamic</code> 调用 <code>StringConcatFactory</code>，由运行时选择拼接策略，一行拼接的性能更好。但<b>循环里的问题依然存在</b>，每轮仍会产生新字符串，所以结论不变。</p>`,
    links: [['StringBuilder', '../../00-Java基础/basics/24-StringBuilder.html'], ['javac 做了什么：语法糖解糖', '../../08-JVM/compile/01-javac做了什么语法糖解糖.html']] },

  { sec: 'String', q: 'String 的 equals() 和 Object 的 equals() 有什么区别？',
    a: `<ul><li><code>Object.equals()</code>：默认比较<b>地址</b>，等同于 <code>==</code>。</li>
<li><code>String.equals()</code>：重写过，比较<b>内容</b>。流程是：先判断是不是同一个对象；再判断对方是不是 String；然后比较长度（和编码）；最后逐个比较字符。</li></ul>
<p>所以判断两个字符串内容是否一样，永远用 <code>equals</code>，不要用 <code>==</code>。忽略大小写可以用 <code>equalsIgnoreCase</code>。</p>`,
    links: [['String 常用方法', '../../00-Java基础/basics/23-String常用方法.html']] },

  { sec: 'String', q: '字符串常量池有什么作用？', star: true,
    a: `<p>字符串常量池是 JVM 专门给字符串开的一块缓存区，目的是<b>让内容相同的字符串字面量只存一份</b>，减少重复创建，节省内存。</p>
<pre><code>String a = "abc";   // 池里没有 "abc"，创建并放入池中
String b = "abc";   // 池里已经有了，直接返回同一个对象
a == b;             // true</code></pre>
<p>能这样共享，前提就是 String 不可变。</p>`,
    more: `<p><b>它在哪</b>：JDK 6 及以前在永久代；<b>JDK 7 起移到了堆里</b>。原因是永久代空间小、只在 Full GC 时回收，大量字符串容易导致 <code>OutOfMemoryError: PermGen space</code>；放到堆里后可以随普通 GC 及时回收。实现上它是 JVM 里的一张哈希表（StringTable），池中保存的是字符串对象的引用。</p>`,
    links: [['方法区与元空间的演变', '../../08-JVM/memory/05-方法区与元空间的演变.html']] },

  { sec: 'String', q: 'String s1 = new String("abc"); 这句话创建了几个字符串对象？', star: true,
    a: `<p><b>1 个或 2 个</b>，取决于常量池里之前有没有 "abc"：</p>
<ul><li><b>池里没有 "abc"</b>：创建 2 个。一个是字面量 "abc" 对应的对象，放进常量池；另一个是 <code>new</code> 在堆上新建的 String 对象。</li>
<li><b>池里已经有 "abc"</b>：只创建 1 个，就是 <code>new</code> 出来的那个。</li></ul>
<pre><code>String s1 = new String("abc");
String s2 = "abc";
s1 == s2;   // false：s1 指向堆里 new 的对象，s2 指向池里的对象</code></pre>`,
    more: `<p>从字节码看：<code>ldc "abc"</code> 负责从常量池取出（没有就创建）字面量对象；<code>new</code> + <code>invokespecial &lt;init&gt;</code> 在堆上新建一个 String，用前者初始化，两者共享同一个底层数组。</p>`,
    trap: `<p>所以<b>不要写 <code>new String("abc")</code></b>，它至少多创建一个没用的对象。直接写字面量 <code>"abc"</code>。</p>` },

  { sec: 'String', q: 'String#intern 方法有什么作用？',
    a: `<p><code>intern()</code> 是一个 native 方法，作用是<b>返回这个字符串在常量池里的那个对象</b>：</p>
<ul><li>池里已经有内容相同的字符串：直接返回池里那个的引用。</li>
<li>池里没有：把它放进池里，再返回（JDK 7 起放进去的是<b>当前这个堆对象的引用</b>，不再复制一份）。</li></ul>
<pre><code>String s1 = "Java";
String s2 = new String("Java");
s2 == s1;            // false
s2.intern() == s1;   // true：intern 返回池里的那个</code></pre>`,
    more: `<p>用途：大量重复的字符串（比如从数据库或文件读出来的城市名、状态值）可以 intern 一下，让相同内容共享一个对象，省内存。但池本身是有容量的哈希表，滥用会让它变慢，一般不需要手动调用。</p>` },

  { sec: 'String', q: 'String 类型的变量和常量做 "+" 运算时发生了什么？',
    a: `<p>关键看 "+" 两边是不是<b>编译期常量</b>：</p>
<ul><li><b>都是编译期常量</b>（字面量，或者 <code>final</code> 修饰且值在编译期就能确定的变量）：编译器直接算出结果，这叫<b>常量折叠</b>。结果放进常量池。</li>
<li><b>有一边是普通变量</b>：编译期不知道它的值，只能在运行时拼接，在堆上生成新对象。</li></ul>
<pre><code>String s1 = "str" + "ing";     // 编译后就是 "string"
String a = "str";
String s2 = a + "ing";         // 运行时拼接，堆上新对象
final String b = "str";
String s3 = b + "ing";         // b 是编译期常量，同样被折叠
s1 == "string";   // true
s2 == "string";   // false
s3 == "string";   // true</code></pre>`,
    trap: `<p><code>final</code> 不等于编译期常量。<code>final String c = getStr();</code> 的值要运行时调用方法才知道，所以 <code>c + "ing"</code> <b>不会</b>被折叠，结果是新对象。</p>`,
    links: [['final', '../../00-Java基础/oop/10-final.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
