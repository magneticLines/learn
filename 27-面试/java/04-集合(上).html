 */
const PAGE_KEY = 'interview:java:04';
const QA = [
  // ───────────── 集合概述 ─────────────
  { sec: '集合概述', q: 'Java 集合框架整体是怎么组织的？',
    a: `<p><b>集合</b>就是"装一组对象的容器"。Java 集合框架由<b>两棵接口树</b>组成：</p>
<ul><li><b><code>Collection</code></b>：存<b>单个元素</b>。下面有三个子接口：<code>List</code>（有序可重复）、<code>Set</code>（不可重复）、<code>Queue</code>（按规则排队进出）。</li>
<li><b><code>Map</code></b>：存<b>键值对</b>（key → value），key 不能重复。</li></ul>
<p>注意 <code>Map</code> <b>没有</b>继承 <code>Collection</code>，它是另一棵树的根。两者之上各有一批实现类，比如 <code>ArrayList</code>、<code>HashSet</code>、<code>ArrayDeque</code>、<code>HashMap</code>。</p>`,
    more: `<p><b>为什么 Map 不继承 Collection？</b><code>Collection</code> 的核心方法是 <code>add(E e)</code>，一次放一个元素；而 Map 一次要放一对 <code>put(K, V)</code>，语义对不上。所以 Map 只提供 <code>keySet()</code>、<code>values()</code>、<code>entrySet()</code> 三个"视图"，把自己转成 Collection 来遍历。</p>`,
    links: [['集合框架', '../../00-Java基础/core/01-集合框架.html']] },

  { sec: '集合概述', q: 'List、Set、Queue、Map 四者有什么区别？', star: true,
    a: `<p>按"存什么、能不能重复、有没有顺序"来答：</p>
<table><tr><th>接口</th><th>存储</th><th>重复</th><th>顺序</th><th>典型实现</th></tr>
<tr><td>List</td><td>单个元素</td><td>可重复</td><td>按插入顺序，可按下标访问</td><td>ArrayList、LinkedList</td></tr>
<tr><td>Set</td><td>单个元素</td><td><b>不可重复</b></td><td>看实现，HashSet 无序</td><td>HashSet、TreeSet</td></tr>
<tr><td>Queue</td><td>单个元素</td><td>可重复</td><td>按排队规则（FIFO 或优先级）</td><td>ArrayDeque、PriorityQueue</td></tr>
<tr><td>Map</td><td>键值对</td><td>key 不可重复，value 可以</td><td>看实现，HashMap 无序</td><td>HashMap、TreeMap</td></tr></table>
<p>一句话：<b>List 像排好号的名单，Set 像去重的集合，Queue 像排队窗口，Map 像字典</b>。</p>` },

  { sec: '集合概述', q: '常见集合的底层数据结构分别是什么？',
    a: `<ul><li><b>List</b>：<code>ArrayList</code>、<code>Vector</code> 是 <code>Object[]</code> 数组；<code>LinkedList</code> 是双向链表。</li>
<li><b>Set</b>：<code>HashSet</code> 内部就是一个 <code>HashMap</code>；<code>LinkedHashSet</code> 内部是 <code>LinkedHashMap</code>；<code>TreeSet</code> 内部是 <code>TreeMap</code>，也就是红黑树。</li>
<li><b>Queue</b>：<code>PriorityQueue</code> 是用数组实现的二叉堆；<code>ArrayDeque</code> 是可扩容的循环数组；<code>DelayQueue</code> 内部用的是 <code>PriorityQueue</code>。</li>
<li><b>Map</b>：<code>HashMap</code> 在 JDK 8 起是"数组 + 链表 / 红黑树"；<code>LinkedHashMap</code> 在 HashMap 基础上多挂了一条双向链表，用来记录插入或访问顺序；<code>Hashtable</code> 是数组 + 链表；<code>TreeMap</code> 是红黑树。</li></ul>`,
    more: `<p><b>记忆技巧</b>：Set 全是"借"Map 实现的。HashSet 把元素当 key 存进 HashMap，value 统一放一个占位对象 <code>PRESENT</code>。所以只要搞懂了三种 Map，三种 Set 就顺带懂了。</p>`,
    links: [['红黑树', '../../01-数据结构/tree/05-红黑树.html'], ['二叉堆与堆性质', '../../01-数据结构/tree/12-二叉堆与堆性质.html'], ['分离链接法', '../../01-数据结构/tree/09-分离链接法.html']] },

  { sec: '集合概述', q: '实际开发中如何选用集合？',
    a: `<p>先问自己两个问题：<b>存单个元素还是键值对？需不需要排序 / 保持顺序 / 线程安全？</b></p>
<ul><li><b>键值对 → Map</b>：一般用 <code>HashMap</code>；要按 key 排序用 <code>TreeMap</code>；要保持插入顺序用 <code>LinkedHashMap</code>；要线程安全用 <code>ConcurrentHashMap</code>。</li>
<li><b>要去重 → Set</b>：一般用 <code>HashSet</code>；要排序用 <code>TreeSet</code>；要保持插入顺序用 <code>LinkedHashSet</code>。</li>
<li><b>普通列表 → List</b>：几乎总是 <code>ArrayList</code>。</li>
<li><b>栈 / 队列 → <code>ArrayDeque</code></b>；要按优先级出队用 <code>PriorityQueue</code>；生产者-消费者用 <code>BlockingQueue</code>。</li></ul>` },

  { sec: '集合概述', q: '为什么要使用集合，而不直接用数组？',
    a: `<p>数组有三个硬伤：<b>长度一旦创建就固定</b>；<b>API 很少</b>（增删要自己挪元素）；<b>只有"按下标存取"这一种结构</b>。</p>
<p>集合正好补上这些：</p>
<ul><li>大小可以动态增长，不用提前算好容量。</li>
<li>提供丰富的现成操作：增删、查找、排序、去重。</li>
<li>有多种数据结构可选：列表、集合、队列、映射，各自针对不同场景优化。</li>
<li>配合泛型，编译期就能检查元素类型。</li></ul>`,
    links: [['数组vs ArrayList', '../../00-Java基础/basics/21-数组vs ArrayList.html']] },

  // ───────────── List ─────────────
  { sec: 'List', q: 'ArrayList 和 Array（数组）有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>Array</th><th>ArrayList</th></tr>
<tr><td>长度</td><td>创建时固定</td><td>动态扩容</td></tr>
<tr><td>元素类型</td><td>基本类型和对象都行</td><td>只能存对象，基本类型要装箱</td></tr>
<tr><td>泛型</td><td>不支持</td><td>支持，编译期类型检查</td></tr>
<tr><td>API</td><td>只有 <code>length</code> 和下标</td><td><code>add</code>、<code>remove</code>、<code>contains</code> 等</td></tr>
<tr><td>创建</td><td>必须指定大小</td><td>可以不指定</td></tr></table>
<p>本质上 <code>ArrayList</code> 就是<b>对 <code>Object[]</code> 数组的封装</b>，帮你做了扩容和元素搬移。</p>`,
    trap: `<ul><li><code>Arrays.asList(arr)</code> 返回的不是 <code>java.util.ArrayList</code>，而是 <code>Arrays</code> 的一个内部类。它长度固定，调 <code>add</code>/<code>remove</code> 会抛 <code>UnsupportedOperationException</code>。</li>
<li><code>Arrays.asList(new int[]{1,2,3})</code> 得到的是只有 1 个元素（整个 int 数组）的 List，因为泛型不接受基本类型。</li></ul>`,
    links: [['数组', '../../00-Java基础/basics/19-数组.html'], ['数组vs ArrayList', '../../00-Java基础/basics/21-数组vs ArrayList.html']] },

  { sec: 'List', q: 'ArrayList 和 Vector 有什么区别？（了解即可）',
    a: `<ul><li>底层都是 <code>Object[]</code> 数组。</li>
<li><b>线程安全</b>：<code>Vector</code> 几乎所有方法都加了 <code>synchronized</code>，线程安全但慢；<code>ArrayList</code> 不加锁，线程不安全。</li>
<li><b>扩容</b>：Vector 默认扩到 <b>2 倍</b>（可以通过 <code>capacityIncrement</code> 指定增量）；ArrayList 扩到 <b>1.5 倍</b>。</li></ul>
<p>Vector 是 JDK 1.0 的老类，现在基本不用。需要线程安全的 List，用 <code>CopyOnWriteArrayList</code> 或 <code>Collections.synchronizedList</code>。</p>`,
    trap: `<p>"Vector 线程安全"只保证<b>单个方法</b>是原子的。"先 <code>contains</code> 再 <code>add</code>"这类<b>复合操作</b>在多线程下照样有竞态，要自己在外面加锁。</p>`,
    links: [['同步容器', '../../02-并发/blocks/01-同步容器.html'], ['CopyOnWriteArrayList', '../../02-并发/blocks/03-CopyOnWriteArrayList.html']] },

  { sec: 'List', q: 'Vector 和 Stack 有什么区别？（了解即可）',
    a: `<p><code>Stack</code> <b>继承自</b> <code>Vector</code>，在它的基础上加了 <code>push</code>、<code>pop</code>、<code>peek</code> 这些栈操作（后进先出）。两者都用 <code>synchronized</code> 保证线程安全，都是老古董。</p>
<p>现在要用栈，官方推荐 <code>Deque&lt;Integer&gt; stack = new ArrayDeque&lt;&gt;();</code>；要线程安全，用 JUC 里的并发容器，比如 <code>ConcurrentLinkedDeque</code>。</p>`,
    more: `<p><b>为什么说 Stack 设计得不好？</b>它继承了 Vector，所以栈对象上居然能调 <code>get(index)</code>、<code>add(index, e)</code>，从中间插元素，破坏了"只能从栈顶操作"的约束。这是"<b>该用组合却用了继承</b>"的经典反例。</p>`,
    links: [['栈Stack与应用', '../../01-数据结构/linear/07-栈Stack与应用.html']] },

  { sec: 'List', q: 'ArrayList 可以添加 null 值吗？',
    a: `<p><b>可以</b>，而且可以加多个 null，因为 ArrayList 对元素没有任何限制。</p>
<p>但<b>不建议</b>这么做：null 没有实际意义，而且后面遍历时一调用方法就会 <code>NullPointerException</code>，很难排查。</p>`,
    trap: `<p>对比记忆：<code>ArrayDeque</code>、<code>PriorityQueue</code>、<code>ConcurrentHashMap</code> 都<b>不允许</b> null，传进去直接抛 NPE。这些类用 null 当"没有元素"的返回值（比如 <code>poll()</code> 返回 null 表示空），所以不能让 null 当元素。</p>` },

  { sec: 'List', q: 'ArrayList 插入和删除元素的时间复杂度是多少？', star: true,
    a: `<ul><li><b>尾部插入</b>：均摊 <b>O(1)</b>。空间够就直接放；不够要扩容，扩容那一次是 O(n)，但分摊到每次插入后仍是 O(1)。</li>
<li><b>头部 / 指定位置插入</b>：<b>O(n)</b>。要把插入点之后的元素整体往后挪一位。</li>
<li><b>尾部删除</b>：<b>O(1)</b>。</li>
<li><b>头部 / 指定位置删除</b>：<b>O(n)</b>。要把后面的元素整体往前挪。</li></ul>
<p>按下标读取 <code>get(i)</code> 是 O(1)，这是数组最大的优势。</p>`,
    more: `<p>"挪元素"在源码里是 <code>System.arraycopy</code>，它是 native 方法，底层做内存块拷贝，常数很小。所以数据量不大时，ArrayList 中间插入的实际速度往往并不慢。</p>
<p><b>什么叫均摊</b>：扩容按 1.5 倍增长，插入 n 个元素总共只触发 O(log n) 次扩容，总拷贝量是 O(n) 级别，平均到每次插入就是 O(1)。</p>`,
    links: [['数组实现ArrayList', '../../01-数据结构/linear/03-数组实现ArrayList.html'], ['大O记号', '../../01-数据结构/analysis/04-大O记号.html']] },

  { sec: 'List', q: 'LinkedList 插入和删除元素的时间复杂度是多少？', star: true,
    a: `<ul><li><b>头部 / 尾部插入删除</b>：<b>O(1)</b>，LinkedList 同时持有 <code>first</code> 和 <code>last</code> 两个指针，只改几个引用就行。</li>
<li><b>指定位置插入删除</b>：<b>O(n)</b>。改指针本身是 O(1)，但要<b>先走到那个位置</b>，这一步是 O(n)。</li></ul>
<p>源码里的 <code>node(index)</code> 会判断 index 在前半段还是后半段，从近的一端开始走，所以最多走 n/2 步，但仍然是 O(n)。</p>`,
    trap: `<p>很多人背"链表插入是 O(1)"，这只在<b>已经拿到节点</b>时成立。用 <code>list.add(index, e)</code> 按下标插入，要先遍历找位置，并不是 O(1)。</p>`,
    links: [['链表实现LinkedList', '../../01-数据结构/linear/04-链表实现LinkedList.html']] },

  { sec: 'List', q: 'LinkedList 为什么不能实现 RandomAccess 接口？',
    a: `<p><code>RandomAccess</code> 是一个<b>标记接口</b>（里面一个方法都没有，只起"贴标签"的作用），意思是"这个类支持<b>快速随机访问</b>"，也就是按下标 O(1) 取元素。</p>
<p>LinkedList 底层是链表，内存不连续，取第 i 个元素必须从头（或尾）一个个走过去，是 O(n)，<b>本身就不支持快速随机访问</b>，所以不能贴这个标签。</p>` },

  { sec: 'List', q: 'ArrayList 和 LinkedList 有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>ArrayList</th><th>LinkedList</th></tr>
<tr><td>底层结构</td><td><code>Object[]</code> 数组</td><td>双向链表（JDK 7 起不再是循环链表）</td></tr>
<tr><td>随机访问</td><td>O(1)，实现了 <code>RandomAccess</code></td><td>O(n)</td></tr>
<tr><td>头部插删</td><td>O(n)</td><td>O(1)</td></tr>
<tr><td>尾部插删</td><td>均摊 O(1)</td><td>O(1)</td></tr>
<tr><td>内存占用</td><td>尾部可能有预留的空位</td><td>每个节点多存 prev、next 两个引用</td></tr>
<tr><td>线程安全</td><td colspan="2">都不安全</td></tr></table>
<p><b>结论</b>：实际项目里<b>几乎都用 ArrayList</b>。需要频繁在头尾操作时，也优先用 <code>ArrayDeque</code>，而不是 LinkedList。</p>`,
    more: `<p><b>为什么 LinkedList 连"插入快"的场景都常常输？</b></p>
<ul><li><b>CPU 缓存</b>：数组内存连续，一次加载一整块进缓存；链表节点散落在堆里，遍历时频繁缓存未命中。</li>
<li><b>对象开销</b>：每个元素都要额外 new 一个 Node 对象，占内存也给 GC 添压力。</li></ul>
<p>LinkedList 的作者 Josh Bloch 本人都说过自己几乎不用 LinkedList。</p>
<p><b>RandomAccess 的用处</b>：<code>Collections.binarySearch</code> 会判断 <code>list instanceof RandomAccess</code>，是就按下标二分，不是就改用迭代器方式，避免在链表上反复 O(n) 取下标。</p>`,
    trap: `<p>遍历 LinkedList 千万别写 <code>for (int i = 0; i &lt; list.size(); i++) list.get(i);</code>，每次 <code>get(i)</code> 都要从头走，总复杂度变成 O(n²)。用增强 for 或迭代器。</p>`,
    links: [['ArrayList与LinkedList取舍', '../../01-数据结构/linear/05-ArrayList与LinkedList取舍.html']] },

  { sec: 'List', q: '说一说 ArrayList 的扩容机制。', star: true,
    a: `<ol><li><b>懒初始化</b>：<code>new ArrayList&lt;&gt;()</code> 时内部只是一个空数组，<b>第一次 add 时才分配容量 10</b>。</li>
<li><b>触发扩容</b>：add 前检查"当前元素数 + 1"是否超过数组长度，超过就调用 <code>grow()</code>。</li>
<li><b>扩多少</b>：新容量 = <code>oldCapacity + (oldCapacity &gt;&gt; 1)</code>，也就是 <b>1.5 倍</b>。如果 1.5 倍还不够（比如 <code>addAll</code> 一次加很多），就直接用需要的最小容量。</li>
<li><b>怎么扩</b>：用 <code>Arrays.copyOf</code> 新建一个更大的数组，把旧元素拷过去，旧数组等着被 GC。</li></ol>`,
    more: `<ul><li><b>为什么是 1.5 倍</b>：扩太小会频繁扩容、频繁拷贝；扩太大浪费内存。1.5 倍是折中，而且用位移算，比乘法便宜。</li>
<li><b>上限</b>：JDK 8 源码里有 <code>MAX_ARRAY_SIZE = Integer.MAX_VALUE - 8</code>，因为有些 JVM 会在数组里存一些头信息，留点余量更安全。</li>
<li><b>优化</b>：能预估数量时，用 <code>new ArrayList&lt;&gt;(n)</code> 指定初始容量，或者批量插入前调用 <code>ensureCapacity(n)</code>，避免多次扩容。</li></ul>`,
    trap: `<ul><li><code>new ArrayList&lt;&gt;(100)</code> 之后 <code>size()</code> 仍是 <b>0</b>，这时 <code>set(5, x)</code> 会越界。容量（capacity）和元素个数（size）是两回事。</li>
<li>ArrayList <b>不会自动缩容</b>。删掉大量元素后想释放内存，要手动调 <code>trimToSize()</code>。</li></ul>`,
    links: [['数组实现ArrayList', '../../01-数据结构/linear/03-数组实现ArrayList.html']] },

  { sec: 'List', q: '集合中的 fail-fast 和 fail-safe 是什么？', star: true,
    a: `<p>这是遍历集合时，<b>集合被修改了</b>怎么办的两种策略：</p>
<ul><li><b>fail-fast（快速失败）</b>：一发现被改就<b>立刻抛异常</b>，不带着错误数据继续跑。<code>java.util</code> 下的 <code>ArrayList</code>、<code>HashMap</code> 都是这种。</li>
<li><b>fail-safe（安全失败）</b>：遍历的是<b>快照或弱一致的视图</b>，别人改不影响你，不抛异常，但可能读不到最新数据。<code>CopyOnWriteArrayList</code>、<code>ConcurrentHashMap</code> 属于这种。</li></ul>
<p><b>fail-fast 的原理</b>：集合里有个 <code>modCount</code> 字段，每次结构性修改（增删）就加 1。迭代器创建时把它记到 <code>expectedModCount</code>，每次 <code>next()</code> 都比一下，不相等就抛 <code>ConcurrentModificationException</code>。</p>`,
    more: `<ul><li><b>CopyOnWriteArrayList 怎么做到的</b>：写操作加锁，复制一份新数组，在新数组上改完，再把内部引用指向新数组。迭代器拿的是旧数组，所以永远不会冲突。代价是写很贵，只适合读多写少。</li>
<li><b>ConcurrentHashMap</b> 的迭代器官方叫"<b>弱一致</b>"（weakly consistent）：不抛 CME，可能反映也可能不反映遍历期间的修改。"fail-safe"是社区说法，JDK 文档并不用这个词。</li>
<li>fail-fast 只是<b>尽力而为</b>，JDK 文档明确说不能依赖它来保证并发正确性，它只是帮你尽早发现 bug。</li></ul>`,
    trap: `<p><b>单线程也会触发 CME</b>，这是最常见的坑：</p>
<pre><code>for (String s : list) {
    if ("a".equals(s)) list.remove(s);   // ✗ 抛 ConcurrentModificationException
}
// 正确做法：用迭代器自己的 remove，它会同步更新 expectedModCount
Iterator&lt;String&gt; it = list.iterator();
while (it.hasNext()) if ("a".equals(it.next())) it.remove();
// 或者 JDK 8 起：
list.removeIf("a"::equals);</code></pre>
<p>更坑的是：如果删的正好是<b>倒数第二个</b>元素，删完后 <code>hasNext()</code> 直接返回 false，循环结束，<b>不会报错</b>。所以"测试没报错"不代表写法正确。</p>`,
    links: [['迭代器与for-each', '../../00-Java基础/core/02-迭代器与for-each.html'], ['CopyOnWriteArrayList', '../../02-并发/blocks/03-CopyOnWriteArrayList.html']] },

  // ───────────── Set ─────────────
  { sec: 'Set', q: 'Comparable 和 Comparator 有什么区别？',
    a: `<p>两者都是用来<b>定义排序规则</b>的接口：</p>
<table><tr><th>维度</th><th>Comparable</th><th>Comparator</th></tr>
<tr><td>包</td><td><code>java.lang</code></td><td><code>java.util</code></td></tr>
<tr><td>方法</td><td><code>compareTo(T o)</code></td><td><code>compare(T o1, T o2)</code></td></tr>
<tr><td>写在哪</td><td>类<b>自己</b>实现，定义"自然顺序"</td><td>单独写一个比较器，从<b>外部</b>传入</td></tr>
<tr><td>规则数量</td><td>一个类只能有一种</td><td>想要几种就写几个</td></tr></table>
<p>返回值约定：负数表示"我排前面"，0 表示相等，正数表示"我排后面"。</p>
<pre><code>// 类没法改、或者需要多种排序时，用 Comparator
list.sort(Comparator.comparing(Person::getAge).thenComparing(Person::getName));</code></pre>`,
    trap: `<ul><li>比较器里别写 <code>return a - b;</code>，两个大数相减会溢出导致结果反号。用 <code>Integer.compare(a, b)</code>。</li>
<li><code>TreeSet</code>/<code>TreeMap</code> 靠 <code>compareTo</code> 返回 0 判断"重复"，<b>不看 equals</b>。如果按年龄比较，两个同龄的不同人只会留下一个。</li></ul>`,
    links: [['Comparable vs Comparator', '../../00-Java基础/oop/22-Comparable vs Comparator.html']] },

  { sec: 'Set', q: 'Set 的"无序性"和"不可重复性"分别是什么意思？',
    a: `<ul><li><b>无序性</b>：不是"随机"，而是元素在底层的存放位置<b>不按插入顺序</b>，而是由元素的哈希值决定。所以遍历顺序和你 add 的顺序不一定一样。</li>
<li><b>不可重复性</b>：新加的元素和已有元素用 <code>equals()</code> 判断为 true 时，就不会再加进去。所以往 Set 里放自定义对象，<b>必须同时重写 <code>equals()</code> 和 <code>hashCode()</code></b>。</li></ul>`,
    trap: `<p>只重写 <code>equals</code> 不重写 <code>hashCode</code>：两个"相等"的对象算出不同的哈希值，落进不同的桶，HashSet 根本不会拿它们比 equals，结果两个都存进去了，去重失效。</p>`,
    links: [['equals与hashCode', '../../00-Java基础/oop/20-equals与hashCode.html']] },

  { sec: 'Set', q: '比较 HashSet、LinkedHashSet 和 TreeSet 的异同。',
    a: `<p><b>相同点</b>：都实现了 <code>Set</code>，元素不可重复，<b>都不是线程安全的</b>。</p>
<p><b>不同点</b>在底层结构，进而决定了顺序：</p>
<table><tr><th>类</th><th>底层</th><th>遍历顺序</th><th>增删查</th></tr>
<tr><td>HashSet</td><td>HashMap</td><td>无序</td><td>平均 O(1)</td></tr>
<tr><td>LinkedHashSet</td><td>LinkedHashMap（哈希表 + 双向链表）</td><td>插入顺序</td><td>平均 O(1)</td></tr>
<tr><td>TreeSet</td><td>TreeMap（红黑树）</td><td>按排序规则</td><td>O(log n)</td></tr></table>
<p>选法：不关心顺序用 HashSet；要保持插入顺序用 LinkedHashSet；要排序、要取"大于某值的第一个"这类范围查询用 TreeSet。</p>`,
    trap: `<p>HashSet 允许放一个 null；TreeSet 用自然排序时放 null 会抛 NPE，因为要调 <code>null.compareTo(...)</code>。</p>`,
    links: [['红黑树', '../../01-数据结构/tree/05-红黑树.html']] },

  // ───────────── Queue ─────────────
  { sec: 'Queue', q: 'Queue 与 Deque 有什么区别？',
    a: `<ul><li><b><code>Queue</code></b>：单端队列，一般是<b>先进先出</b>（FIFO），尾部进、头部出。</li>
<li><b><code>Deque</code></b>：双端队列（double-ended queue），<b>两头都能进出</b>。它继承了 Queue，所以既能当队列用，也能当<b>栈</b>用（提供 <code>push</code>/<code>pop</code>）。</li></ul>
<p>每种操作都有两套方法，区别在失败时的表现：</p>
<table><tr><th>操作</th><th>失败时抛异常</th><th>失败时返回特殊值</th></tr>
<tr><td>尾部插入</td><td><code>add</code></td><td><code>offer</code>（返回 false）</td></tr>
<tr><td>头部删除</td><td><code>remove</code></td><td><code>poll</code>（返回 null）</td></tr>
<tr><td>查看头部</td><td><code>element</code></td><td><code>peek</code>（返回 null）</td></tr></table>
<p>Deque 在这些名字后面加 First/Last，比如 <code>offerFirst</code>、<code>pollLast</code>。</p>`,
    links: [['队列Queue与循环队列', '../../01-数据结构/linear/08-队列Queue与循环队列.html'], ['双端队列Deque', '../../01-数据结构/linear/09-双端队列Deque.html']] },

  { sec: 'Queue', q: 'ArrayDeque 与 LinkedList 有什么区别？',
    a: `<p>两者都实现了 <code>Deque</code>，都能当队列和栈用。区别：</p>
<ul><li><b>底层</b>：ArrayDeque 是<b>可扩容的循环数组</b>，用 head、tail 两个下标标记两端；LinkedList 是双向链表。</li>
<li><b>null</b>：ArrayDeque <b>不允许</b> null；LinkedList 允许。</li>
<li><b>性能</b>：ArrayDeque 插入是均摊 O(1)，偶尔扩容；LinkedList 每次插入都要 new 一个节点。整体上 <b>ArrayDeque 更快</b>。</li>
<li><b>历史</b>：ArrayDeque 是 JDK 6 加的；LinkedList 从 JDK 1.2 就有。</li></ul>
<p><b>结论</b>：要栈或队列，首选 <code>ArrayDeque</code>。</p>`,
    more: `<p><b>循环数组</b>：head 往前走到下标 0 再往前，就绕回数组末尾，这样两端插删都不用挪元素。数组满了就扩容，并把元素按顺序重新摆好。</p>`,
    links: [['队列Queue与循环队列', '../../01-数据结构/linear/08-队列Queue与循环队列.html']] },

  { sec: 'Queue', q: '说一说 PriorityQueue。',
    a: `<p><code>PriorityQueue</code>（JDK 5）是<b>优先级队列</b>：出队的不是最先进来的，而是<b>优先级最高</b>的那个。</p>
<ul><li><b>底层</b>：用数组实现的<b>二叉堆</b>。堆是一种完全二叉树，父节点总是比子节点小（小顶堆）。</li>
<li><b>复杂度</b>：<code>offer</code>/<code>poll</code> 是 O(log n)（元素要上浮或下沉调整位置），<code>peek</code> 是 O(1)。</li>
<li><b>默认小顶堆</b>，传一个 <code>Comparator</code> 可以改成大顶堆：<code>new PriorityQueue&lt;&gt;(Comparator.reverseOrder())</code>。</li>
<li>不允许 null，元素必须可比较；<b>非线程安全</b>，并发场景用 <code>PriorityBlockingQueue</code>。</li></ul>
<p>典型用途：Top K 问题、合并 K 个有序链表、任务调度。</p>`,
    trap: `<p><b>直接打印或用迭代器遍历 PriorityQueue，顺序不是排好序的！</b>堆只保证堆顶最小，其余元素只满足"父比子小"。要按顺序拿，只能一个个 <code>poll()</code>。</p>`,
    links: [['二叉堆与堆性质', '../../01-数据结构/tree/12-二叉堆与堆性质.html'], ['上滤下滤与建堆', '../../01-数据结构/tree/13-上滤下滤与建堆.html']] },

  { sec: 'Queue', q: '什么是 BlockingQueue？',
    a: `<p><code>BlockingQueue</code>（阻塞队列）是继承自 <code>Queue</code> 的接口，在普通队列上加了"<b>等待</b>"能力：</p>
<ul><li>队列<b>空</b>时，<code>take()</code> 会阻塞，直到有元素可取。</li>
<li>队列<b>满</b>时（有容量上限的队列），<code>put()</code> 会阻塞，直到有空位。</li></ul>
<p>它最典型的用途是<b>生产者-消费者模型</b>：生产者只管 put，消费者只管 take，谁快了谁就自动等，不用自己写 <code>wait/notify</code>。线程池里存放待执行任务的，也是一个 BlockingQueue。</p>
<table><tr><th>操作</th><th>抛异常</th><th>返回特殊值</th><th>一直阻塞</th><th>超时等待</th></tr>
<tr><td>插入</td><td>add</td><td>offer</td><td><b>put</b></td><td>offer(e, time, unit)</td></tr>
<tr><td>取出</td><td>remove</td><td>poll</td><td><b>take</b></td><td>poll(time, unit)</td></tr></table>`,
    links: [['BlockingQueue', '../../02-并发/blocks/04-BlockingQueue.html'], ['阻塞队列与生产者消费者', '../../22-书籍推荐/books/Java并发编程实战/10-阻塞队列与生产者消费者.html']] },

  { sec: 'Queue', q: 'BlockingQueue 有哪些常用实现类？',
    a: `<ul><li><b><code>ArrayBlockingQueue</code></b>：数组实现，<b>有界</b>，创建时必须指定容量，可选公平锁。</li>
<li><b><code>LinkedBlockingQueue</code></b>：单向链表实现，容量可选，<b>不指定默认 <code>Integer.MAX_VALUE</code></b>，约等于无界。</li>
<li><b><code>PriorityBlockingQueue</code></b>：带优先级排序的无界阻塞队列，线程安全版的 PriorityQueue。</li>
<li><b><code>SynchronousQueue</code></b>：<b>不存元素</b>。每个 put 必须等一个 take 来接，像"手递手"交接。</li>
<li><b><code>DelayQueue</code></b>：元素到了指定的延迟时间才能被取出，可用来做简单的定时任务。</li></ul>`,
    more: `<p>和线程池对应起来记：<code>Executors.newFixedThreadPool</code> 用的是无界的 <code>LinkedBlockingQueue</code>；<code>newCachedThreadPool</code> 用的是 <code>SynchronousQueue</code>，任务来了没人接就马上新建线程。</p>`,
    links: [['BlockingQueue', '../../02-并发/blocks/04-BlockingQueue.html'], ['为什么不用Executors', '../../02-并发/exec/06-为什么不用Executors.html']] },

  { sec: 'Queue', q: 'ArrayBlockingQueue 和 LinkedBlockingQueue 有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>ArrayBlockingQueue</th><th>LinkedBlockingQueue</th></tr>
<tr><td>底层</td><td>数组</td><td>单向链表</td></tr>
<tr><td>是否有界</td><td>有界，必须指定容量</td><td>可选；不指定默认 <code>Integer.MAX_VALUE</code></td></tr>
<tr><td>锁</td><td><b>一把锁</b>，生产和消费共用</td><td><b>两把锁</b>：<code>putLock</code> 和 <code>takeLock</code></td></tr>
<tr><td>公平性</td><td>可选公平 / 非公平</td><td>只有非公平</td></tr>
<tr><td>内存</td><td>创建时一次性分配整个数组</td><td>按需创建节点，每个元素多一个 Node 对象</td></tr></table>
<p><b>锁分离的好处</b>：LinkedBlockingQueue 生产者从尾部放、消费者从头部取，两边用不同的锁，互不阻塞，高并发下吞吐通常更高。</p>`,
    more: `<p><b>追问：为什么 ArrayBlockingQueue 不也搞两把锁？</b>它的 put 和 take 都要改共享的 <code>count</code>，数组又是循环复用的，用一把锁实现简单、不容易出错。LinkedBlockingQueue 用两把锁，就得把 <code>count</code> 换成 <code>AtomicInteger</code> 来保证计数正确。</p>
<p>两者的阻塞都基于 <code>ReentrantLock</code> + <code>Condition</code>（<code>notEmpty</code> / <code>notFull</code>）：队空时 take 线程在 notEmpty 上 await，put 成功后 signal 它。</p>`,
    trap: `<p><code>new LinkedBlockingQueue&lt;&gt;()</code> 不传容量就是"无界"，生产快于消费时任务会一直堆积，最后 <b>OOM</b>。阿里规约禁止用 <code>Executors</code> 创建线程池，原因之一就是这个。生产环境一定要给容量。</p>`,
    links: [['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html'], ['Condition', '../../02-并发/advanced/04-Condition.html'], ['为什么不用Executors', '../../02-并发/exec/06-为什么不用Executors.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
</html>
