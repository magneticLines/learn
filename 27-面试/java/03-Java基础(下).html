const PAGE_KEY = 'interview:java:03';
const QA = [
  // ───────────── 异常 ─────────────
  { sec: '异常', q: 'Exception 和 Error 有什么区别？',
    a: `<p>两者都继承自 <code>Throwable</code>（所有能被 <code>throw</code> 的东西的父类），区别在<b>程序能不能处理</b>：</p>
<ul><li><b>Exception</b>：程序<b>可以、也应该</b>处理的问题，比如文件不存在、参数不合法。可以 <code>catch</code> 住然后恢复。</li>
<li><b>Error</b>：JVM 层面的严重问题，比如 <code>OutOfMemoryError</code>、<code>StackOverflowError</code>。程序一般<b>处理不了</b>，出现时 JVM 通常会终止线程，不建议 catch。</li></ul>
<p>Exception 又分为受检异常（Checked）和非受检异常（Unchecked，即 <code>RuntimeException</code> 及其子类）。</p>`,
    trap: `<p>不要 <code>catch (Throwable t)</code> 或 <code>catch (Error e)</code> 后假装没事继续跑：比如 OOM 之后堆的状态已经不可靠，吞掉它只会让问题更难排查。</p>`,
    links: [['异常体系', '../../00-Java基础/core/09-异常体系.html'], ['StackOverflowError 与 OutOfMemoryError 辨析', '../../08-JVM/memory/10-StackOverflowError与OutOfMemoryError辨析.html']] },

  { sec: '异常', q: 'ClassNotFoundException 和 NoClassDefFoundError 有什么区别？',
    a: `<table><tr><th>维度</th><th>ClassNotFoundException</th><th>NoClassDefFoundError</th></tr>
<tr><td>类型</td><td>Exception（受检异常）</td><td>Error</td></tr>
<tr><td>触发时机</td><td>用 <code>Class.forName()</code>、<code>ClassLoader.loadClass()</code> 按名字<b>动态加载</b>，找不到这个类</td><td>编译时类<b>存在</b>，运行时 JVM 需要它却加载不到</td></tr>
<tr><td>典型原因</td><td>类名写错、驱动 jar 没引入</td><td>运行时 classpath 少了 jar、依赖版本冲突；或者这个类的静态初始化曾经失败过</td></tr></table>
<p>简单记：一个是"你让我按名字找，我没找到"，一个是"编译时明明有，运行时没了"。</p>`,
    more: `<p>第二种原因很隐蔽：类的 <code>static</code> 代码块第一次执行时抛了异常（会报 <code>ExceptionInInitializerError</code>），这个类就被标记为初始化失败，之后再用到它都会报 <code>NoClassDefFoundError</code>。排查时要往日志前面找<b>第一次</b>的报错。</p>`,
    links: [['类加载五阶段', '../../08-JVM/classloading/03-类加载五阶段.html']] },

  { sec: '异常', q: 'Checked Exception 和 Unchecked Exception 有什么区别？', star: true,
    a: `<ul><li><b>Checked Exception（受检异常）</b>：<b>编译器强制处理</b>，要么 <code>try-catch</code>，要么在方法上 <code>throws</code> 声明，否则编译不通过。除了 RuntimeException 分支以外的 Exception 都是，比如 <code>IOException</code>、<code>SQLException</code>、<code>ClassNotFoundException</code>。</li>
<li><b>Unchecked Exception（非受检异常）</b>：<code>RuntimeException</code> 及其子类，编译器不强制处理。一般是代码 bug 导致的。</li></ul>
<p>常见的 RuntimeException：<code>NullPointerException</code>、<code>IllegalArgumentException</code>、<code>ArrayIndexOutOfBoundsException</code>、<code>ClassCastException</code>、<code>ArithmeticException</code>（比如除以 0）、<code>NumberFormatException</code>。</p>`,
    trap: `<p><code>Error</code> 也不受编译器检查，但它不属于 Exception。说"非受检异常"时一般指 RuntimeException，别把 Error 混进来。</p>`,
    links: [['checked 异常', '../../00-Java基础/core/10-checked异常.html'], ['异常体系', '../../00-Java基础/core/09-异常体系.html']] },

  { sec: '异常', q: '你更倾向于使用 Checked Exception 还是 Unchecked Exception？',
    a: `<p>业务代码里我<b>更倾向于 Unchecked Exception</b>，理由：</p>
<ul><li>受检异常会<b>一层层污染方法签名</b>：底层加一个 <code>throws</code>，上面所有调用方都得改。</li>
<li>它很容易被写成 <code>catch (Exception e) {}</code> 直接吞掉，反而更糟。</li>
<li>也和 Lambda 配合不好，Stream 里的函数式接口不允许抛受检异常。</li></ul>
<p>实践上一般是：定义一个继承 <code>RuntimeException</code> 的业务异常（如 <code>BizException</code>，带错误码），业务层直接抛，再用 Spring 的 <code>@RestControllerAdvice</code> + <code>@ExceptionHandler</code> 统一转成错误响应。</p>
<p>受检异常也有用武之地：<b>调用方确实能、也应该恢复</b>的情况，比如文件读不到时换一个路径重试，用它能强制调用方考虑这个分支。</p>`,
    more: `<p>顺带一提：Spring 的 <code>@Transactional</code> 默认只在遇到 <b>RuntimeException 和 Error</b> 时回滚，受检异常默认<b>不回滚</b>，要写 <code>rollbackFor = Exception.class</code>。这也是业务异常常继承 RuntimeException 的原因之一。</p>`,
    links: [['自定义异常', '../../00-Java基础/core/12-自定义异常.html'], ['事务管理 @Transactional', '../../07-Spring/data/04-事务管理Transactional.html']] },

  { sec: '异常', q: 'Throwable 类有哪些常用方法？',
    a: `<ul><li><code>getMessage()</code>：异常的简要描述。</li>
<li><code>toString()</code>：异常类名 + message。</li>
<li><code>getLocalizedMessage()</code>：本地化的描述，子类不重写时和 getMessage 一样。</li>
<li><code>printStackTrace()</code>：把异常和调用栈打印到标准错误流。</li>
<li><code>getCause()</code>：拿到<b>引起它的原始异常</b>（异常链）。</li>
<li><code>getSuppressed()</code>：拿到被抑制的异常，主要配合 try-with-resources 使用。</li></ul>`,
    trap: `<p>生产代码里别用 <code>e.printStackTrace()</code>，它不走日志框架，拿不到时间、线程等信息。应该写 <code>log.error("xxx 失败", e)</code>，<b>把异常对象作为最后一个参数传进去</b>，堆栈才会被完整记录。</p>` },

  { sec: '异常', q: 'try-catch-finally 怎么用？', star: true,
    a: `<ul><li><code>try</code>：放可能抛异常的代码。</li>
<li><code>catch</code>：捕获并处理指定类型的异常，可以有多个，<b>子类异常要写在父类前面</b>。</li>
<li><code>finally</code>：不管有没有异常都会执行，通常用来释放资源。</li></ul>
<pre><code>try {
    int x = 1 / 0;
} catch (ArithmeticException e) {
    log.warn("除零", e);
} finally {
    System.out.println("finally 一定会执行");
}</code></pre>`,
    trap: `<p><b>不要在 finally 里写 return</b>。try 里的 return 值会先暂存起来，再去执行 finally；如果 finally 里也 return，就会<b>覆盖</b>掉 try 的返回值，连 try 里抛出的异常也会被吞掉。</p>
<pre><code>static int f() {
    try { return 1; }
    finally { return 2; }   // 最终返回 2
}</code></pre>
<p>反过来，finally 里<b>修改</b>（不是 return）try 要返回的基本类型变量，不影响返回值，因为返回值已经暂存好了。</p>`,
    links: [['try-catch-finally', '../../00-Java基础/core/11-try-catch-finally.html']] },

  { sec: '异常', q: 'finally 中的代码一定会执行吗？',
    a: `<p><b>不一定</b>。正常情况下都会执行，但这几种情况不会：</p>
<ol><li>finally 之前调用了 <code>System.exit()</code>（或 <code>Runtime.halt()</code>），JVM 直接退出。</li>
<li>程序所在的线程死亡，或者进程被 <code>kill -9</code> 强杀。</li>
<li>机器断电、宕机。</li></ol>
<p>另外，<b>守护线程</b>里的 finally 也可能来不及执行：所有非守护线程结束时，JVM 直接退出，不会等守护线程跑完。</p>` },

  { sec: '异常', q: '如何使用 try-with-resources 代替 try-catch-finally？', star: true,
    a: `<p>Java 7 引入。凡是实现了 <code>AutoCloseable</code>（或 <code>Closeable</code>）的资源，都可以写在 <code>try (...)</code> 里，<b>执行完自动调用 <code>close()</code></b>，不用自己写 finally。</p>
<pre><code>// 多个资源用分号隔开，关闭顺序和声明顺序相反
try (BufferedInputStream in = new BufferedInputStream(new FileInputStream("a.txt"));
     BufferedOutputStream out = new BufferedOutputStream(new FileOutputStream("b.txt"))) {
    // 读写...
} catch (IOException e) {
    log.error("拷贝失败", e);
}</code></pre>
<p>《Effective Java》的建议：<b>面对必须关闭的资源，总是优先用 try-with-resources</b>。代码更短，也更不容易出错。</p>`,
    more: `<p><b>它比手写 finally 好在哪</b>：手写时如果 try 里抛了异常，finally 里的 <code>close()</code> 又抛异常，后一个会<b>覆盖</b>前一个，真正的原因就丢了。try-with-resources 会保留主异常，把 close 的异常通过 <code>addSuppressed</code> 挂在主异常上，用 <code>getSuppressed()</code> 能拿到。</p>
<p>它本身也是语法糖，编译后就是带 finally 和 addSuppressed 的代码。资源会在 catch / finally 块执行<b>之前</b>就关闭。</p>`,
    links: [['try-catch-finally', '../../00-Java基础/core/11-try-catch-finally.html']] },

  { sec: '异常', q: '使用异常时有哪些需要注意的地方？', star: true,
    a: `<ol><li><b>不要把异常定义成静态变量</b>复用。异常对象里记录了创建时的堆栈，共享一个实例会让堆栈信息错乱。每次都 <code>new</code> 一个。</li>
<li><b>异常信息要有意义</b>：带上关键参数，比如 <code>"用户不存在, userId=" + id</code>。</li>
<li><b>抛出更具体的异常</b>：参数错了抛 <code>IllegalArgumentException</code>，而不是笼统的 <code>RuntimeException</code>。</li>
<li><b>包装异常时要保留原始异常</b>：<code>throw new BizException("xxx", e)</code>，不要丢掉 cause。</li>
<li><b>不要既打日志又往外抛</b>：同一个异常会在日志里出现好几次。要么在这里处理并记录，要么抛给上层统一处理。</li>
<li><b>不要用异常控制正常流程</b>：创建异常要填充堆栈，开销不小，能用 if 判断的就别靠 try-catch。</li></ol>`,
    links: [['自定义异常', '../../00-Java基础/core/12-自定义异常.html']] },

  // ───────────── 泛型 ─────────────
  { sec: '泛型', q: '什么是泛型？有什么作用？',
    a: `<p><b>泛型</b>就是把类型当作参数：写类或方法时先用一个占位符（如 <code>T</code>），使用时再指定具体类型。</p>
<pre><code>List&lt;String&gt; list = new ArrayList&lt;&gt;();
list.add("a");
list.add(1);            // 编译报错：类型不对
String s = list.get(0); // 不用强转</code></pre>
<p><b>作用</b>：</p>
<ul><li><b>类型安全</b>：错误在编译期就能发现，而不是运行时报 <code>ClassCastException</code>。</li>
<li><b>省去强制类型转换</b>，代码更清晰。</li>
<li><b>代码复用</b>：一份 <code>ArrayList</code> 代码可以装任何类型。</li></ul>`,
    more: `<p><b>类型擦除</b>（高频追问）：Java 的泛型只存在于编译期，编译后类型参数被擦除成它的上界（没写就是 <code>Object</code>），在需要的地方由编译器插入强转。所以运行时 <code>List&lt;String&gt;</code> 和 <code>List&lt;Integer&gt;</code> 是<b>同一个 Class</b>。这是为了兼容 Java 5 之前没有泛型的老代码。</p>`,
    trap: `<p>因为擦除：不能 <code>new T()</code>、不能 <code>new T[]</code>、不能 <code>instanceof List&lt;String&gt;</code>；泛型参数也不能是基本类型（<code>List&lt;int&gt;</code> 不行）。另外，用反射可以绕过编译期检查，往 <code>List&lt;String&gt;</code> 里塞一个 Integer。</p>`,
    links: [['泛型', '../../00-Java基础/oop/17-泛型.html'], ['泛型擦除', '../../08-JVM/compile/02-泛型擦除.html']] },

  { sec: '泛型', q: '泛型的使用方式有哪几种？',
    a: `<p>三种：<b>泛型类、泛型接口、泛型方法</b>。</p>
<pre><code>// 1. 泛型类
class Box&lt;T&gt; { private T value; }

// 2. 泛型接口，实现时可以指定具体类型，也可以继续保留泛型
interface Generator&lt;T&gt; { T next(); }
class StrGen implements Generator&lt;String&gt; { public String next() { return "a"; } }

// 3. 泛型方法：返回值前面的 &lt;E&gt; 才是声明，不能省
public static &lt;E&gt; void print(E[] arr) { for (E e : arr) System.out.println(e); }</code></pre>`,
    more: `<p><b>通配符与上下界</b>：<code>&lt;? extends T&gt;</code> 表示 T 或其子类，适合<b>只读</b>（生产者）；<code>&lt;? super T&gt;</code> 表示 T 或其父类，适合<b>只写</b>（消费者）。口诀 <b>PECS</b>：Producer Extends, Consumer Super。<code>Collections.copy(List&lt;? super T&gt; dest, List&lt;? extends T&gt; src)</code> 就是典型例子。</p>`,
    trap: `<p>泛型类的类型参数<b>不能用在静态方法和静态变量上</b>，因为静态成员属于类，而 T 要到创建对象时才确定。静态方法要用泛型，必须自己声明成泛型方法。</p>`,
    links: [['泛型', '../../00-Java基础/oop/17-泛型.html']] },

  { sec: '泛型', q: '项目中哪里用到了泛型？',
    a: `<ul><li><b>统一返回结果</b>：<code>Result&lt;T&gt;</code> 包含 code、message 和 <code>T data</code>，不同接口返回不同的 data 类型。</li>
<li><b>分页对象</b>：<code>PageResult&lt;T&gt;</code>，里面是 <code>List&lt;T&gt; records</code> 加总数。</li>
<li><b>通用 DAO / Service</b>：比如 MyBatis-Plus 的 <code>BaseMapper&lt;T&gt;</code>、Spring Data 的 <code>JpaRepository&lt;T, ID&gt;</code>，增删改查写一次，所有实体共用。</li>
<li><b>工具类</b>：比如 JSON 转换 <code>&lt;T&gt; T parse(String json, Class&lt;T&gt; clazz)</code>，以及 JDK 自带的 <code>Collections.sort</code>、<code>Optional&lt;T&gt;</code>。</li></ul>`,
    more: `<p><code>BaseMapper&lt;User&gt;</code> 在擦除后怎么知道实体是 User？因为<b>类继承时写下的泛型信息会保存在 Class 文件的签名里</b>，框架可以通过反射 <code>getGenericSuperclass()</code> / <code>getGenericInterfaces()</code> 读出来。被擦除的是<b>变量、对象层面</b>的类型参数。</p>` },

  // ───────────── 反射 ─────────────
  { sec: '反射', q: '什么是反射？', star: true,
    a: `<p><b>反射</b>是指程序在<b>运行时</b>获取任意一个类的信息（有哪些字段、方法、构造器、注解），并且能动态创建对象、调用方法、读写字段，哪怕这些在编译时还不知道。</p>
<p>它的基础是 <code>Class</code> 对象：每个类被加载后，JVM 都会为它创建一个唯一的 Class 对象，描述这个类的结构。获取方式有四种：</p>
<pre><code>Class&lt;?&gt; c1 = User.class;                      // 类字面量
Class&lt;?&gt; c2 = user.getClass();                 // 通过对象
Class&lt;?&gt; c3 = Class.forName("com.x.User");     // 通过全限定类名，会触发类初始化
Class&lt;?&gt; c4 = loader.loadClass("com.x.User");  // 通过类加载器，不会初始化

Object obj = c3.getDeclaredConstructor().newInstance();
Method m = c3.getMethod("setName", String.class);
m.invoke(obj, "tom");</code></pre>`,
    links: [['Class 对象', '../../00-Java基础/core/20-Class对象.html'], ['反射调用', '../../00-Java基础/core/21-反射调用.html']] },

  { sec: '反射', q: '反射有什么优缺点？', star: true,
    a: `<p><b>优点</b>：<b>灵活</b>。代码不用在编译期写死具体类，可以根据配置、注解在运行时决定。几乎所有框架都靠它实现"通用"。</p>
<p><b>缺点</b>：</p>
<ul><li><b>性能开销</b>：要做方法查找、权限检查、参数装箱等，比直接调用慢，JIT 也更难优化。</li>
<li><b>破坏封装、有安全隐患</b>：<code>setAccessible(true)</code> 可以访问 private 成员；还能绕过泛型检查。</li>
<li><b>编译期检查失效</b>：方法名写错、参数不对，要到运行时才报错，也不利于重构。</li></ul>`,
    more: `<p>对框架来说，反射的性能影响其实不大。框架通常会<b>缓存</b> <code>Method</code>、<code>Field</code> 对象，避免重复查找；JDK 18 起反射底层也改成用 <code>MethodHandle</code> 实现。另外，JDK 9 模块系统之后（JDK 16/17 起更严格），默认不允许用反射访问 JDK 内部类的私有成员，这是很多老项目升级 JDK 时报 <code>InaccessibleObjectException</code> 的原因。</p>` },

  { sec: '反射', q: '反射有哪些应用场景？', star: true,
    a: `<p>业务代码很少直接写反射，但<b>框架里到处都是</b>：</p>
<ul><li><b>Spring IoC</b>：扫描到类后，通过反射调用构造器创建 Bean，再通过反射给 <code>@Autowired</code> 字段注入依赖。</li>
<li><b>动态代理</b>：Spring AOP、MyBatis Mapper，<code>InvocationHandler</code> 里用 <code>method.invoke()</code> 调用目标方法。</li>
<li><b>注解解析</b>：<code>@RequestMapping</code>、<code>@Value</code> 这些注解，运行时都是靠反射读出来的。</li>
<li><b>序列化</b>：Jackson 把 JSON 转成对象时，靠反射创建对象、设置字段值。</li>
<li><b>JDBC</b>：<code>Class.forName("com.mysql.cj.jdbc.Driver")</code> 加载驱动。</li></ul>`,
    links: [['反射调用', '../../00-Java基础/core/21-反射调用.html'], ['BeanDefinition 与容器启动流程', '../../07-Spring/internals/01-BeanDefinition与容器启动流程.html']] },

  // ───────────── 代理 ─────────────
  { sec: '代理', q: '如何实现动态代理？',
    a: `<p><b>代理模式</b>：不直接访问目标对象，而是通过一个代理对象，在调用目标方法的前后加上额外逻辑（日志、事务、权限），且不修改目标类。<b>动态代理</b>是指代理类在<b>运行时</b>生成，不用手写。</p>
<p>Java 里主要两种实现：</p>
<ul><li><b>JDK 动态代理</b>：<code>Proxy.newProxyInstance(类加载器, 接口数组, InvocationHandler)</code>，要求目标类<b>实现了接口</b>。</li>
<li><b>CGLIB</b>：通过生成目标类的<b>子类</b>来代理，用 <code>Enhancer</code> + <code>MethodInterceptor</code>，不需要接口。</li></ul>
<pre><code>UserService proxy = (UserService) Proxy.newProxyInstance(
    target.getClass().getClassLoader(),
    target.getClass().getInterfaces(),
    (p, method, args) -&gt; {
        System.out.println("before " + method.getName());
        Object r = method.invoke(target, args);   // 调用真正的目标对象
        System.out.println("after");
        return r;
    });</code></pre>`,
    links: [['代理模式', '../../03-设计模式/dp/23-代理模式.html'], ['JDK 动态代理', '../../00-Java基础/core/22-JDK动态代理.html'], ['CGLIB 动态代理', '../../00-Java基础/core/23-CGLIB动态代理.html']] },

  { sec: '代理', q: '静态代理和动态代理有什么区别？',
    a: `<table><tr><th>维度</th><th>静态代理</th><th>动态代理</th></tr>
<tr><td>代理类何时产生</td><td><b>编译前</b>手写，编译成 class 文件</td><td><b>运行时</b>动态生成字节码</td></tr>
<tr><td>灵活性</td><td>一个目标类配一个代理类；接口加方法，代理类也要跟着改</td><td>一个 InvocationHandler 就能代理任意接口的所有方法</td></tr>
<tr><td>接口要求</td><td>一般要实现同一接口</td><td>JDK 方式要接口，CGLIB 不需要</td></tr></table>
<p>静态代理写起来直观，但类多了维护成本很高，所以框架几乎都用动态代理。</p>`,
    links: [['代理模式', '../../03-设计模式/dp/23-代理模式.html']] },

  { sec: '代理', q: 'JDK 动态代理和 CGLIB 动态代理有什么区别？', star: true,
    a: `<table><tr><th>维度</th><th>JDK 动态代理</th><th>CGLIB</th></tr>
<tr><td>原理</td><td>生成一个<b>实现了目标接口</b>的代理类</td><td>用 ASM 生成目标类的<b>子类</b>，重写它的方法</td></tr>
<tr><td>前提</td><td>目标必须实现接口，只能代理接口里的方法</td><td>不需要接口，但 <b><code>final</code> 类和 <code>final</code> / <code>private</code> 方法代理不了</b></td></tr>
<tr><td>依赖</td><td>JDK 自带</td><td>第三方库（Spring 已经内置了一份）</td></tr></table>
<p>性能上，新版本 JDK 的动态代理已经不比 CGLIB 慢，一般不用把性能作为选择依据。</p>`,
    more: `<p><b>Spring 怎么选</b>：Spring AOP 本身的规则是目标实现了接口就用 JDK 代理，否则用 CGLIB；但 <b>Spring Boot 2.x 起默认 <code>proxyTargetClass=true</code></b>，统一用 CGLIB。这样即使注入时写的是实现类类型，也不会因为代理对象不是该类型而注入失败。</p>`,
    trap: `<p>因为 CGLIB 靠子类重写方法，所以<b><code>final</code> 或 <code>private</code> 方法上加 <code>@Transactional</code> 不会生效</b>，调用时直接执行原方法，没有经过代理。</p>`,
    links: [['JDK 动态代理与 CGLIB 字节码代理的实现差异', '../../07-Spring/internals/05-JDK动态代理与CGLIB字节码代理的实现差异.html'], ['JDK 动态代理', '../../00-Java基础/core/22-JDK动态代理.html'], ['CGLIB 动态代理', '../../00-Java基础/core/23-CGLIB动态代理.html']] },

  { sec: '代理', q: '介绍一下动态代理在框架中的实际应用场景。', star: true,
    a: `<ul><li><b>Spring AOP</b>：<code>@Transactional</code>、<code>@Async</code>、<code>@Cacheable</code> 以及自定义切面，都是给 Bean 生成代理对象，在方法前后织入逻辑。容器里注入给你的其实是<b>代理对象</b>。</li>
<li><b>MyBatis</b>：Mapper 只写了接口，没有实现类。调用时拿到的是 JDK 动态代理对象（<code>MapperProxy</code>），它根据方法名找到对应的 SQL 去执行。</li>
<li><b>RPC 框架</b>：Dubbo、OpenFeign 的客户端也是接口 + 代理，调用方法时由代理把参数序列化、发网络请求，看起来就像调本地方法。</li></ul>`,
    trap: `<p><b>高频坑：同一个类里的方法自调用，AOP 失效</b>。比如方法 A 内部直接调用本类加了 <code>@Transactional</code> 的方法 B，走的是 <code>this.B()</code>，<code>this</code> 是原始对象而不是代理，事务不会生效。解决办法：把 B 挪到另一个 Bean；或者注入自己（的代理）再调用。</p>`,
    links: [['事务管理 @Transactional', '../../07-Spring/data/04-事务管理Transactional.html'], ['代理模式', '../../03-设计模式/dp/23-代理模式.html']] },

  // ───────────── 注解 ─────────────
  { sec: '注解', q: '什么是注解？',
    a: `<p><b>注解</b>（Annotation）是 Java 5 引入的一种<b>元数据</b>，可以贴在类、方法、字段、参数上，给编译器或框架提供额外信息。注解本身不做任何事，<b>要有人去读它、解析它</b>才会起作用。</p>
<p>本质上，注解是一个继承了 <code>java.lang.annotation.Annotation</code> 的特殊接口：</p>
<pre><code>@Target(ElementType.METHOD)          // 能贴在哪
@Retention(RetentionPolicy.RUNTIME)  // 保留到什么时候
public @interface Log {
    String value() default "";
}</code></pre>
<p><code>@Retention</code> 有三个级别：<code>SOURCE</code>（只在源码里，编译后丢弃，如 <code>@Override</code>）、<code>CLASS</code>（保留到 class 文件，但运行时读不到，是默认值）、<code>RUNTIME</code>（运行时能用反射读到，Spring 的注解基本都是这种）。</p>`,
    trap: `<p>自定义注解忘写 <code>@Retention(RetentionPolicy.RUNTIME)</code>，运行时用反射就读不到，是初学者常见错误。</p>`,
    links: [['注解 Annotation', '../../00-Java基础/oop/18-注解Annotation.html']] },

  { sec: '注解', q: '注解的解析方法有哪几种？',
    a: `<p>两种，对应不同的保留级别：</p>
<ul><li><b>编译期解析</b>：编译器或<b>注解处理器</b>（Annotation Processor，实现 <code>AbstractProcessor</code>）在编译时处理。比如 <code>@Override</code> 由编译器检查；<b>Lombok</b>、<b>MapStruct</b> 在编译期根据注解生成代码。</li>
<li><b>运行期解析</b>：通过<b>反射</b>读取 <code>RUNTIME</code> 级别的注解，如 <code>method.getAnnotation(Log.class)</code>。Spring 的 <code>@Autowired</code>、<code>@RequestMapping</code>、<code>@Value</code> 都是这样。</li></ul>`,
    more: `<p>取舍：编译期解析没有运行时开销，问题在编译时就能暴露，但写处理器比较麻烦；运行期解析灵活，但要付出反射的开销，所以框架一般在启动时解析一次再缓存结果。</p>`,
    links: [['注解 Annotation', '../../00-Java基础/oop/18-注解Annotation.html'], ['组件扫描注解', '../../07-Spring/core/06-组件扫描注解.html']] },

  // ───────────── SPI ─────────────
  { sec: 'SPI', q: '什么是 SPI？', star: true,
    a: `<p><b>SPI</b>（Service Provider Interface，服务提供者接口）是一种<b>让框架使用方来提供实现</b>的机制：框架定义接口，第三方写实现，框架在运行时自动发现并加载这些实现。</p>
<p>JDK 自带的 <code>ServiceLoader</code> 就是 SPI 的实现，约定是：</p>
<ol><li>在 jar 包的 <code>META-INF/services/</code> 目录下，建一个以<b>接口全限定名</b>命名的文件；</li>
<li>文件里一行写一个实现类的全限定名；</li>
<li>调用 <code>ServiceLoader.load(接口.class)</code>，就能遍历拿到所有实现。</li></ol>
<p>典型例子：<b>JDBC</b>。<code>java.sql.Driver</code> 是 JDK 定义的接口，MySQL 驱动 jar 里声明了自己的实现，所以现在不写 <code>Class.forName</code> 也能自动加载驱动。</p>`,
    more: `<p>SPI 的思路在各大框架里都有"加强版"：Spring Boot 的自动配置用 <code>SpringFactoriesLoader</code> 读取 <code>spring.factories</code>（2.7 起改为 <code>AutoConfiguration.imports</code> 文件）；Dubbo 实现了自己的 SPI，支持按名字加载某个实现。</p>
<p>和类加载也有关：JDBC 接口在核心类库里，由启动类加载器加载，但驱动实现在应用 classpath 上，启动类加载器看不到。所以 ServiceLoader 借助<b>线程上下文类加载器</b>加载实现，这是"破坏双亲委派"的经典例子。</p>`,
    links: [['EnableAutoConfiguration 与条件化装配', '../../07-Spring/core/10-EnableAutoConfiguration与条件化装配.html'], ['打破双亲委派的场景', '../../08-JVM/classloading/07-打破双亲委派的场景.html']] },

  { sec: 'SPI', q: 'SPI 和 API 有什么区别？', star: true,
    a: `<p>区别在于<b>接口由谁定义、由谁实现</b>：</p>
<ul><li><b>API</b>：<b>实现方</b>定义接口并提供实现，调用方直接用。比如你调用 <code>HashMap</code> 的方法。</li>
<li><b>SPI</b>：<b>调用方</b>（框架）定义接口规范，<b>由第三方</b>去实现。比如 JDK 定义 <code>java.sql.Driver</code>，MySQL、PostgreSQL 各自实现。</li></ul>
<p>类比：API 像去餐厅点菜，菜单是餐厅定的；SPI 像商场规定好插座标准，各家电器厂商按标准做插头。</p>` },

  { sec: 'SPI', q: 'SPI 有什么优缺点？', star: true,
    a: `<p><b>优点</b>：<b>解耦、可插拔</b>。框架不依赖具体实现，换实现只需要换 jar 包，不用改代码。比如日志门面 SLF4J 2.x 就是通过 ServiceLoader 找到具体的日志实现。</p>
<p><b>缺点</b>（JDK <code>ServiceLoader</code> 的）：</p>
<ul><li><b>只能遍历全部实现</b>，不能按名字直接取某一个，想用哪个得自己挑，还会把遍历到的都实例化。</li>
<li><b>不是线程安全的</b>，多线程同时用同一个 ServiceLoader 实例会有问题。</li>
<li>多个 jar 提供了实现时，加载顺序依赖 classpath 顺序，结果可能不确定。</li></ul>
<p>这也是 Dubbo 等框架要自己实现一套 SPI 的原因。</p>` },

  // ───────────── 序列化和反序列化 ─────────────
  { sec: '序列化和反序列化', q: '什么是序列化？什么是反序列化？', star: true,
    a: `<ul><li><b>序列化</b>：把内存里的<b>对象</b>转换成<b>字节序列</b>（或 JSON 这样的文本），方便存到文件、数据库，或者通过网络传输。</li>
<li><b>反序列化</b>：反过来，把字节序列还原成对象。</li></ul>
<p>为什么需要：对象只存在于 JVM 内存里，要跨进程、跨机器传递，或者持久化，就必须先变成一串字节。常见场景：RPC 调用传参、对象存入 Redis、HTTP 接口返回 JSON。</p>
<p>JDK 自带的序列化：类实现 <code>Serializable</code> 接口（一个没有方法的<b>标记接口</b>），再用 <code>ObjectOutputStream.writeObject()</code> / <code>ObjectInputStream.readObject()</code>。</p>`,
    more: `<p><b>serialVersionUID 的作用</b>：它是类的"版本号"。反序列化时会比较字节流里的版本号和当前类的是否一致，不一致就抛 <code>InvalidClassException</code>。不手动声明的话，编译器会根据类结构自动算一个，类一改（哪怕加个字段）就变了，旧数据就读不出来。所以<b>建议显式声明</b>。</p>
<p>在网络分层模型里，序列化属于 OSI 的表示层；在 TCP/IP 四层模型里属于应用层。</p>`,
    links: [['序列化', '../../00-Java基础/core/19-序列化.html']] },

  { sec: '序列化和反序列化', q: '如果有些字段不想进行序列化怎么办？', star: true,
    a: `<p>用 <b><code>transient</code></b> 关键字修饰这个字段。被修饰的字段序列化时会被跳过，反序列化后是该类型的<b>默认值</b>（int 是 0，对象是 null）。</p>
<pre><code>class User implements Serializable {
    private String name;
    private transient String password;   // 敏感信息不写进字节流
}</code></pre>`,
    trap: `<ul><li><code>transient</code> 只能修饰<b>变量</b>，不能修饰类和方法。</li>
<li><code>static</code> 变量本来就<b>不会被序列化</b>，因为它属于类，不属于某个对象，加不加 transient 都一样。</li>
<li><code>transient</code> 只对 JDK 原生序列化有效。Jackson 等 JSON 库有自己的规则，要忽略字段一般用 <code>@JsonIgnore</code>。</li></ul>`,
    links: [['Jackson 序列化定制', '../../07-Spring/web/11-Jackson序列化定制.html']] },

  { sec: '序列化和反序列化', q: '常见的序列化协议有哪些？',
    a: `<table><tr><th>类别</th><th>代表</th><th>特点</th></tr>
<tr><td>文本</td><td>JSON（Jackson、Fastjson）、XML</td><td>人能直接看懂，跨语言，但体积大、速度一般。HTTP 接口最常用</td></tr>
<tr><td>二进制</td><td>Protobuf、Thrift</td><td>体积小、速度快、跨语言，需要先写 IDL 描述文件。gRPC 用的就是 Protobuf</td></tr>
<tr><td>二进制</td><td>Hessian、Kryo、ProtoStuff</td><td>Hessian 是 Dubbo 早期默认；Kryo 性能好，但主要面向 Java</td></tr></table>
<p>选择时主要看：<b>要不要跨语言、要不要人可读、对性能和体积的要求</b>。</p>` },

  { sec: '序列化和反序列化', q: '为什么不推荐使用 JDK 自带的序列化？', star: true,
    a: `<ol><li><b>不支持跨语言</b>：字节格式是 Java 专有的，其他语言读不了。</li>
<li><b>性能差、体积大</b>：序列化结果里带了大量类的描述信息，比 Protobuf、Kryo 大好几倍，速度也慢。</li>
<li><b>有安全问题</b>：反序列化时会根据字节流创建任意类的对象，并执行其中的一些方法。攻击者构造恶意数据，就可能借助 classpath 上的类串成"利用链"，执行任意代码。历史上 Apache Commons Collections 等反序列化漏洞影响很大。</li></ol>`,
    more: `<p>JDK 9 起提供了反序列化过滤器（<code>ObjectInputFilter</code>），可以用白名单限制能反序列化哪些类，算是补救措施。但新项目直接用 JSON 或 Protobuf 更省心。</p>` },

  // ───────────── I/O ─────────────
  { sec: 'I/O', q: 'Java IO 流了解吗？',
    a: `<p>IO 就是输入/输出：把数据从外部（文件、网络、键盘）读进内存是<b>输入</b>，从内存写出去是<b>输出</b>。Java 用"流"来抽象这个过程，数据像水流一样一段一段地传。</p>
<p>整个 IO 体系有 <b>4 个抽象基类</b>，其他类都从它们派生：</p>
<table><tr><th></th><th>输入</th><th>输出</th></tr>
<tr><td><b>字节流</b>（以 byte 为单位）</td><td><code>InputStream</code></td><td><code>OutputStream</code></td></tr>
<tr><td><b>字符流</b>（以 char 为单位）</td><td><code>Reader</code></td><td><code>Writer</code></td></tr></table>
<p>常用实现：<code>FileInputStream</code>、<code>BufferedInputStream</code>（带缓冲）、<code>FileReader</code>、<code>BufferedReader</code>（能按行读）、<code>InputStreamReader</code>（字节流转字符流）。</p>`,
    links: [['字节流与字符流', '../../00-Java基础/core/16-字节流与字符流.html'], ['BufferedReader', '../../00-Java基础/core/17-BufferedReader.html'], ['Files 与 Path', '../../00-Java基础/core/18-Files与Path.html']] },

  { sec: 'I/O', q: 'I/O 流为什么要分为字节流和字符流？',
    a: `<p>计算机里所有数据最终都是字节，理论上字节流就够了。单独设计字符流是为了<b>正确处理文本</b>：</p>
<ul><li>同一个字符，在不同编码下占的字节数不同。比如一个汉字，UTF-8 下占 3 字节，GBK 下占 2 字节。</li>
<li>用字节流读文本，一旦把一个汉字的几个字节拆开处理，或者编码对不上，就会<b>乱码</b>。</li>
<li>字符流内部按指定编码把字节<b>转成字符</b>，帮你处理好这些细节。</li></ul>
<p>所以：<b>处理图片、音频、视频等二进制文件用字节流；处理文本用字符流</b>。</p>`,
    trap: `<p><code>FileReader</code> 在 JDK 11 之前没有能指定编码的构造方法，只能用平台默认编码，Windows 上很容易乱码。推荐写 <code>new InputStreamReader(in, StandardCharsets.UTF_8)</code>，或者用 <code>Files.newBufferedReader(path, UTF_8)</code>，<b>显式指定编码</b>。</p>`,
    links: [['字节流与字符流', '../../00-Java基础/core/16-字节流与字符流.html']] },

  { sec: 'I/O', q: 'Java IO 中用到了哪些设计模式？',
    a: `<ul><li><b>装饰器模式</b>（最典型）：不改变原有类，通过<b>一层层包装</b>增加功能。<code>new BufferedInputStream(new FileInputStream(f))</code> 就是给文件流加上缓冲；还可以再套 <code>DataInputStream</code> 增加读基本类型的能力。<code>FilterInputStream</code> 是这些装饰器的父类。</li>
<li><b>适配器模式</b>：<code>InputStreamReader</code> 把字节流 <code>InputStream</code> 适配成字符流 <code>Reader</code>，让两套本来不兼容的接口能一起用。</li>
<li><b>工厂模式</b>：<code>Files.newInputStream(path)</code>、<code>Files.newBufferedReader(path)</code> 这类静态方法负责创建对象。</li>
<li><b>观察者模式</b>：NIO 的 <code>WatchService</code> 监听目录变化，文件被创建、修改时通知注册者。</li></ul>`,
    more: `<p><b>追问：装饰器和适配器的区别？</b>装饰器是<b>增强功能</b>，包装前后是同一个接口（都是 InputStream），所以可以无限套娃；适配器是<b>转换接口</b>，包装前是 InputStream，包装后变成了 Reader。</p>`,
    links: [['装饰者模式', '../../03-设计模式/dp/12-装饰者模式.html'], ['适配器模式', '../../03-设计模式/dp/18-适配器模式.html'], ['观察者模式', '../../03-设计模式/dp/11-观察者模式.html']] },

  { sec: 'I/O', q: 'BIO、NIO 和 AIO 有什么区别？', star: true,
    a: `<table><tr><th>模型</th><th>特点</th><th>适用场景</th></tr>
<tr><td><b>BIO</b>（同步阻塞）</td><td>一个连接占一个线程。调用 <code>read()</code> 时，没数据线程就一直<b>阻塞</b>等着</td><td>连接数少且固定</td></tr>
<tr><td><b>NIO</b>（同步非阻塞 / IO 多路复用）</td><td>Java 1.4 引入（<code>java.nio</code>），核心是 <code>Channel</code>、<code>Buffer</code>、<code>Selector</code>。<b>一个线程通过 Selector 同时监听多个连接</b>，哪个就绪就处理哪个</td><td>高并发、连接多（Netty、Tomcat NIO 模式）</td></tr>
<tr><td><b>AIO</b>（异步非阻塞）</td><td>Java 7 引入（NIO.2）。发起读写后立刻返回，操作系统完成后<b>回调通知</b></td><td>理论上最好，但实际用得少</td></tr></table>
<p>核心区别：BIO 是线程等数据；NIO 是一个线程轮询多个连接，只处理准备好的；AIO 是数据准备和拷贝都由系统完成后再通知你。</p>`,
    more: `<p><b>为什么 NIO 能支撑高并发</b>：BIO 一万个连接就要一万个线程，大部分线程都在空等，线程切换和内存开销巨大。NIO 的 Selector 在 Linux 上底层用的是 <b>epoll</b>，少量线程就能管理大量连接。</p>
<p><b>为什么 AIO 用得少</b>：Linux 上 Java 的 AIO 实际是基于 epoll 模拟的，性能没有明显优势，所以 Netty 主要基于 NIO。</p>`,
    trap: `<p>Java 的 "NIO" 本意是 <b>New IO</b>，而它采用的模型是操作系统层面的 <b>IO 多路复用</b>。别把它和操作系统五种 IO 模型里单纯的"非阻塞 IO"（线程自己不停地轮询）混为一谈。另外，NIO 仍然是<b>同步</b> IO：数据就绪后，把数据从内核拷贝到用户空间这一步，还是要线程自己去做。</p>`,
    links: [['阻塞 IO 与非阻塞 IO', '../../11-操作系统/io/02-阻塞IO与非阻塞IO.html'], ['IO 多路复用 select/poll/epoll', '../../11-操作系统/io/03-IO多路复用selectPollEpoll.html'], ['为什么需要 Netty：从 BIO 到 NIO 再到 Netty', '../../21-Netty/basics/01-为什么需要Netty从BIO到NIO再到Netty.html']] },

  // ───────────── 语法糖 ─────────────
  { sec: '语法糖', q: '什么是语法糖？',
    a: `<p><b>语法糖</b>是语言提供的一种"写法上的便利"：不增加新功能，只是让代码更简洁、更好读。</p>
<p>关键点：<b>JVM 并不认识语法糖</b>。<code>javac</code> 编译时会把它们还原成普通写法，这一步叫<b>解语法糖</b>（desugar）。所以真正支持语法糖的是<b>编译器</b>，不是 JVM。</p>
<pre><code>for (String s : list) { }
// 编译后相当于：
for (Iterator&lt;String&gt; it = list.iterator(); it.hasNext(); ) { String s = it.next(); }</code></pre>`,
    links: [['javac 做了什么：语法糖解糖', '../../08-JVM/compile/01-javac做了什么语法糖解糖.html']] },

  { sec: '语法糖', q: 'Java 中有哪些常见的语法糖？',
    a: `<table><tr><th>语法糖</th><th>编译后的样子</th></tr>
<tr><td>泛型</td><td>类型擦除 + 编译器插入强转</td></tr>
<tr><td>自动装箱/拆箱</td><td><code>Integer.valueOf()</code> / <code>intValue()</code></td></tr>
<tr><td>增强 for</td><td>数组变成下标循环；集合变成 <code>Iterator</code> 遍历</td></tr>
<tr><td>可变参数</td><td>数组参数</td></tr>
<tr><td>枚举</td><td>继承 <code>java.lang.Enum</code> 的 final 类，每个常量是一个 static final 实例</td></tr>
<tr><td>内部类</td><td>编译成独立的 <code>Outer$Inner.class</code></td></tr>
<tr><td>try-with-resources</td><td>try-finally + <code>close()</code> + <code>addSuppressed</code></td></tr>
<tr><td>switch 支持 String</td><td>先比 <code>hashCode()</code>，再用 <code>equals()</code> 确认</td></tr>
<tr><td>字符串 "+"</td><td>StringBuilder（JDK 8）/ invokedynamic（JDK 9+）</td></tr></table>`,
    more: `<p><b>Lambda 不是匿名内部类的语法糖</b>：它编译后不会生成 <code>Xxx$1.class</code> 文件，而是用 <code>invokedynamic</code> 指令，在运行时通过 <code>LambdaMetafactory</code> 生成实现类。</p>`,
    trap: `<p>增强 for 遍历集合时<b>不能用 <code>list.remove()</code> 删除元素</b>，因为底层是迭代器，通常会抛 <code>ConcurrentModificationException</code>。要用 <code>iterator.remove()</code> 或 <code>removeIf()</code>。</p>`,
    links: [['自动装拆箱陷阱', '../../08-JVM/compile/03-自动装拆箱陷阱.html'], ['迭代器与 for-each', '../../00-Java基础/core/02-迭代器与for-each.html'], ['enum', '../../00-Java基础/oop/15-enum.html'], ['内部类', '../../00-Java基础/oop/16-内部类.html'], ['Lambda 表达式', '../../00-Java基础/core/05-Lambda表达式.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
