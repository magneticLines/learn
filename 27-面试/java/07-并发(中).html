const PAGE_KEY = 'interview:java:07';
const QA = [
  // ───────────── JMM ─────────────
  { sec: 'JMM（Java 内存模型）', q: '什么是 JMM？为什么需要它？', star: true,
    a: `<p><b>JMM（Java Memory Model）</b>是 Java 语言规范里的一套规则，规定了<b>多线程下一个线程的写，什么时候、在什么条件下对另一个线程可见</b>。</p>
<p><b>为什么需要</b>：硬件和编译器为了性能会做很多"小动作"——CPU 有各级缓存和写缓冲，编译器和 CPU 会重排指令。单线程下这些优化看不出来，多线程下就会出现"我改了你看不到""顺序乱了"。而且不同 CPU 的内存模型还不一样。JMM 给程序员一个统一的承诺：<b>按规则写代码，就能在任何平台上得到一致的结果</b>。</p>
<p>它主要围绕三个问题：<b>原子性、可见性、有序性</b>。核心工具是 <b>happens-before</b> 规则：如果 A happens-before B，那么 A 的结果对 B 一定可见。常用规则有程序顺序规则、锁规则（解锁先于后续加锁）、volatile 规则（写先于后续读）、线程 start/join 规则、传递性。</p>`,
    more: `<p>JMM 常被画成"主内存 + 每个线程的工作内存"。这是一个<b>抽象模型</b>，工作内存对应的是寄存器、缓存、写缓冲、编译器优化等的综合效果，并不是 JVM 里真有一块叫"工作内存"的区域。</p>`,
    trap: `<p>别把 <b>JMM（内存模型）</b>和 <b>JVM 内存区域</b>（堆、栈、方法区）搞混，这是两个完全不同的概念：前者讲多线程可见性规则，后者讲运行时内存怎么划分。面试官很爱用这个来试探。</p>`,
    links: [['JMM 与 happens-before', '../../02-并发/advanced/08-JMM与happens-before.html'], ['Java 内存模型回顾', '../../08-JVM/concurrency/01-Java内存模型回顾.html'], ['happens-before 初识', '../../02-并发/basics/03-happens-before初识.html']] },

  // ───────────── volatile ─────────────
  { sec: 'volatile 关键字', q: 'volatile 如何保证变量的可见性？', star: true,
    a: `<p>把变量声明为 <code>volatile</code> 后，JMM 规定：<b>对它的写 happens-before 后续对它的读</b>。所以一个线程写入后，其他线程再读，一定能读到这个新值。</p>
<pre><code>volatile boolean running = true;
// 线程 A
while (running) { /* 干活 */ }
// 线程 B
running = false;   // 没有 volatile 时，A 可能永远看不到，一直循环</code></pre>
<p>volatile 只能修饰变量，保证<b>可见性和有序性</b>，但<b>不保证原子性</b>；synchronized 三者都能保证。</p>`,
    more: `<p><b>底层</b>：在 x86 上，HotSpot 会在 volatile 写后面加一条带 <code>lock</code> 前缀的指令。它会让写缓冲里的数据刷出去，再借助 CPU 的缓存一致性协议（如 MESI）让其他核上这个缓存行失效，别的核下次读就只能拿新值。</p>
<p>上面没有 volatile 的例子，可能是 JIT 把 <code>running</code> 的读取提到循环外面只读一次，于是变成死循环。</p>`,
    trap: `<p>"volatile 就是禁用 CPU 缓存、每次都直接读写主存"这种说法<b>不准确</b>。Java 的 volatile 是 JMM 层面的语义保证，底层怎么实现由 JVM 按 CPU 决定，缓存照样在用，只是靠缓存一致性协议和内存屏障保证看到的是新值。</p>`,
    links: [['volatile 与可见性', '../../02-并发/basics/02-volatile与可见性.html']] },

  { sec: 'volatile 关键字', q: 'volatile 如何禁止指令重排序？双重校验锁单例为什么必须加 volatile？', star: true,
    a: `<p><b>指令重排序</b>：编译器和 CPU 在不影响单线程结果的前提下，会调整指令执行顺序来提速。volatile 通过在读写前后插入<b>内存屏障</b>（一种"这条线前后的指令不许越界"的指令）来禁止特定的重排。</p>
<p>最经典的例子是 DCL（双重校验锁）单例：</p>
<pre><code>private static volatile Singleton instance;
public static Singleton get() {
    if (instance == null) {                 // 第一次检查：已创建就不加锁
        synchronized (Singleton.class) {
            if (instance == null)           // 第二次检查：防止重复创建
                instance = new Singleton();
        }
    }
    return instance;
}</code></pre>
<p><code>new Singleton()</code> 大致分三步：① 分配内存 ② 初始化对象 ③ 把引用赋给 instance。没有 volatile 时 ② ③ 可能重排成 ① ③ ②。线程 A 执行完 ③ 还没 ②，线程 B 在第一次检查时发现 instance 不为 null，直接拿去用，用的是<b>没初始化完的半成品对象</b>。加了 volatile，对 instance 的写之前的操作不能重排到它后面，问题就消失了。</p>`,
    more: `<p><b>四种内存屏障</b>（理解用的模型）：LoadLoad、StoreStore、LoadStore、StoreLoad，名字表示"屏障前的读/写"和"屏障后的读/写"之间不能重排。其中 <b>StoreLoad</b> 最贵，相当于全屏障。</p>
<p>保守的插入策略：volatile 写前加 StoreStore、写后加 StoreLoad；volatile 读后加 LoadLoad 和 LoadStore。实际 JVM 会按 CPU 内存模型合并或省略，x86 上基本只剩写后的 StoreLoad。</p>
<p>另一种单例写法是<b>静态内部类</b>或<b>枚举</b>，靠类加载机制保证线程安全，不需要 volatile。</p>`,
    trap: `<p>DCL 里的 synchronized 并不能挡住问题：出问题的线程 B 在第一次检查时<b>根本没进同步块</b>，所以锁对它不起作用。</p>`,
    links: [['volatile 与可见性', '../../02-并发/basics/02-volatile与可见性.html'], ['安全发布', '../../02-并发/basics/10-安全发布.html']] },

  { sec: 'volatile 关键字', q: 'volatile 和 happens-before 有什么关系？', star: true,
    a: `<p>happens-before 里有一条专门的 <b>volatile 变量规则</b>：对一个 volatile 变量的写，happens-before 后续对<b>同一个</b>变量的读。</p>
<p>配合"程序顺序规则"和"传递性"，效果就是：<b>写 volatile 之前的所有操作（包括普通变量），对读到这个新值之后的操作都可见</b>。</p>
<pre><code>int a = 0; volatile boolean flag = false;
// 线程 A
a = 1;          // ① 普通写
flag = true;    // ② volatile 写
// 线程 B
if (flag) {     // ③ volatile 读，读到 true
    print(a);   // ④ 一定是 1：① hb ② hb ③ hb ④
}</code></pre>
<p>这就是 volatile 能当"<b>状态标志</b>"用来传递数据的原因：它顺带让前面写的普通变量也可见。</p>`,
    trap: `<p>这个保证有前提：B 必须<b>读到了 A 写的那个值</b>（flag 为 true）。如果 B 读 flag 时 A 还没写，那就没有这条 happens-before 关系，a 的值也没有任何保证。</p>`,
    links: [['JMM 与 happens-before', '../../02-并发/advanced/08-JMM与happens-before.html']] },

  { sec: 'volatile 关键字', q: 'volatile 可以保证原子性吗？', star: true,
    a: `<p><b>不能</b>。volatile 只保证每次读到的是最新值，但 <code>inc++</code> 这种<b>复合操作</b>分成三步：读 inc → 加 1 → 写回。两个线程可能同时读到 5，各自加 1 后都写回 6，一次自增就丢了。</p>
<p>5 个线程各自对 volatile 变量自增 500 次，结果往往小于 2500，就是这个原因。</p>
<p><b>解决办法</b>三选一：</p>
<pre><code>public synchronized void increase() { inc++; }       // 1. synchronized

AtomicInteger inc = new AtomicInteger();
inc.getAndIncrement();                                // 2. 原子类（CAS）

lock.lock(); try { inc++; } finally { lock.unlock(); } // 3. Lock</code></pre>`,
    more: `<p>volatile 能保证原子性的只有<b>单次读、单次写</b>。一个冷知识：没有 volatile 修饰的 <code>long</code>/<code>double</code>，JLS 允许把 64 位写拆成两次 32 位写（现代 64 位 JVM 实际上不会拆）；加上 volatile 后，读写一定是原子的。</p>`,
    trap: `<p>volatile 适用的场景：<b>一写多读</b>，或者写入的新值<b>不依赖</b>旧值（如 <code>flag = true</code>）。只要是"读—改—写"或"先检查再执行"，就必须用锁或原子类。</p>`,
    links: [['CAS 与原子类', '../../02-并发/advanced/05-CAS与原子类.html']] },

  // ───────────── 乐观锁和悲观锁 ─────────────
  { sec: '乐观锁和悲观锁', q: '什么是悲观锁？', star: true,
    a: `<p><b>悲观锁</b>假设最坏情况：认为每次访问共享资源都会有人来抢，所以<b>先加锁再操作</b>。同一时刻只有一个线程能用，其他线程阻塞，等锁释放后再轮到它们。</p>
<p>Java 里的 <code>synchronized</code>、<code>ReentrantLock</code> 这些独占锁就是悲观锁；数据库的 <code>SELECT ... FOR UPDATE</code> 也是。</p>
<p><b>缺点</b>：竞争激烈时大量线程阻塞和唤醒，带来上下文切换开销；还可能出现死锁。</p>`,
    links: [['锁的分类总览', '../../02-并发/advanced/01-锁的分类总览.html']] },

  { sec: '乐观锁和悲观锁', q: '什么是乐观锁？适合什么场景？', star: true,
    a: `<p><b>乐观锁</b>假设最好情况：认为冲突很少，所以<b>不加锁直接做</b>，只在<b>提交修改时检查</b>数据有没有被别人改过。没被改就提交，被改了就重试或放弃。实现方式是<b>版本号</b>或 <b>CAS</b>。</p>
<p>Java 里 <code>java.util.concurrent.atomic</code> 包下的原子类（<code>AtomicInteger</code>、<code>LongAdder</code> 等）就是基于 CAS 的乐观锁思想。</p>
<p><b>优点</b>：不阻塞线程、没有死锁。<b>缺点</b>：冲突多（写很多）时会不停失败重试，白白消耗 CPU。</p>
<p><b>选择</b>：读多写少、冲突少 → 乐观锁；写多、竞争激烈 → 悲观锁。</p>`,
    more: `<p><b>LongAdder 怎么缓解重试问题？</b>AtomicLong 所有线程都 CAS 同一个值，竞争激烈时大量失败。LongAdder 把值分散到一个 <code>Cell[]</code> 数组里，不同线程加不同的格子，读的时候再把所有格子加起来。用<b>空间换时间</b>，高并发计数时明显更快，代价是更占内存、<code>sum()</code> 不是精确的瞬时快照。</p>`,
    links: [['LongAdder 与 LongAccumulator', '../../02-并发/modern/04-LongAdder与LongAccumulator高并发计数.html']] },

  { sec: '乐观锁和悲观锁', q: '如何实现乐观锁？', star: true,
    a: `<p>两种方式：</p>
<p><b>1. 版本号机制</b>（数据库里常用）：表里加一个 <code>version</code> 字段，更新时带上读到的版本号做条件。</p>
<pre><code>UPDATE account SET balance = 50, version = version + 1
WHERE id = 1 AND version = 1;   -- 影响行数为 0 说明被别人改过，需要重试</code></pre>
<p>A、B 同时读到 version=1，A 先提交成功，version 变成 2；B 再提交时条件不成立，更新失败，从而避免 B 用旧数据覆盖 A 的结果。</p>
<p><b>2. CAS（Compare And Swap，比较并交换）</b>：有三个操作数——内存值 V、预期值 E、新值 N。<b>当且仅当 V == E 时才把 V 改成 N</b>，否则什么都不做并返回失败。整个"比较+交换"由一条 CPU 原子指令完成，不会被打断。</p>
<p>多个线程同时 CAS 同一个变量，只有一个会成功；失败的线程<b>不会被挂起</b>，可以选择重试或放弃。</p>`,
    more: `<p>MyBatis-Plus 的 <code>@Version</code> 注解、JPA 的 <code>@Version</code> 就是版本号机制的现成实现。</p>`,
    links: [['CAS 与原子类', '../../02-并发/advanced/05-CAS与原子类.html']] },

  { sec: '乐观锁和悲观锁', q: 'Java 中 CAS 是如何实现的？', star: true,
    a: `<p>关键是 <code>Unsafe</code> 类（JDK 内部使用的"后门"类，能直接按内存偏移量操作字段）。它提供 <code>compareAndSwapInt/Long/Object</code> 等 native 方法。HotSpot 把这些调用当作<b>内部函数（intrinsic）</b>处理，直接翻译成 CPU 的原子指令，比如 x86 上的 <code>lock cmpxchg</code>。</p>
<p>以 <code>AtomicInteger</code>（JDK 8）为例：</p>
<pre><code>private volatile int value;             // volatile 保证可见性
public final int getAndIncrement() {
    return unsafe.getAndAddInt(this, valueOffset, 1);
}
// Unsafe 里：读当前值，CAS 失败就重读重试，直到成功 —— 这就是"自旋"
public final int getAndAddInt(Object o, long offset, int delta) {
    int v;
    do { v = getIntVolatile(o, offset); }
    while (!compareAndSwapInt(o, offset, v, v + delta));
    return v;
}</code></pre>
<p>一句话：<b>volatile 保证可见，CAS 保证原子，失败就自旋重试</b>。</p>`,
    more: `<p>JDK 9 起，原子类改用内部的 <code>jdk.internal.misc.Unsafe</code>，对外则推荐用 <b><code>VarHandle</code></b> 来做 CAS，它是官方替代 <code>sun.misc.Unsafe</code> 的安全 API。另外在 x86 上，<code>getAndAdd</code> 这类操作 JIT 可能直接编译成 <code>lock xadd</code> 一条指令，连循环都没有。</p>`,
    trap: `<p>业务代码不要直接用 <code>sun.misc.Unsafe</code>：它能随意读写内存，用错会让 JVM 崩溃，而且新版本 JDK 在逐步收紧它的内存访问方法。</p>`,
    links: [['CAS 与原子类', '../../02-并发/advanced/05-CAS与原子类.html']] },

  { sec: '乐观锁和悲观锁', q: 'CAS 算法存在哪些问题？', star: true,
    a: `<ol><li><b>ABA 问题</b>：值从 A 被改成 B 又改回 A，CAS 检查时发现还是 A，就误以为没人动过。解决：加<b>版本号</b>，JDK 提供了 <code>AtomicStampedReference</code>（引用 + int 版本戳一起比较）和 <code>AtomicMarkableReference</code>（引用 + boolean 标记）。</li>
<li><b>自旋时间长、开销大</b>：竞争激烈时一直失败一直重试，CPU 空转。缓解：限制重试次数、改用 <code>LongAdder</code> 分散竞争，或者竞争大时直接换成锁。</li>
<li><b>只能保证一个共享变量的原子操作</b>：多个变量要一起改时，CAS 无能为力。解决：把多个变量封装成一个对象，用 <code>AtomicReference</code> 对整个对象做 CAS；或者直接加锁。</li></ol>`,
    more: `<p><b>追问：ABA 在什么时候真的有害？</b>单纯计数一般没影响。但像无锁栈这种结构：线程 1 准备把栈顶 A 弹出（期望 next 是 B），中间别的线程弹出 A、B 又把 A 压回去，线程 1 的 CAS 仍然成功，却把已经不在栈里的 B 设成了栈顶，结构就坏了。</p>
<p>自旋可以用 CPU 的 <code>pause</code> 指令降低空转开销，JDK 9 起可以通过 <code>Thread.onSpinWait()</code> 给 JVM 这个提示。</p>`,
    links: [['ABA 问题', '../../02-并发/advanced/06-ABA问题.html']] },

  { sec: '乐观锁和悲观锁', q: '乐观锁和悲观锁怎么对比、怎么选？', star: true,
    a: `<table><tr><th>维度</th><th>乐观锁</th><th>悲观锁</th></tr>
<tr><td>核心假设</td><td>冲突少，提交时再验证</td><td>冲突多，先加锁再操作</td></tr>
<tr><td>实现</td><td>CAS、版本号</td><td>synchronized、Lock、<code>FOR UPDATE</code></td></tr>
<tr><td>竞争时</td><td>失败重试或放弃，不阻塞</td><td>线程排队、可能被挂起</td></tr>
<tr><td>主要开销</td><td>高冲突时自旋耗 CPU</td><td>挂起/唤醒的上下文切换</td></tr>
<tr><td>死锁</td><td>不会</td><td>可能</td></tr>
<tr><td>适用</td><td>读多写少、冲突少</td><td>写多、竞争激烈、强一致</td></tr></table>`,
    trap: `<p>"乐观锁一定比悲观锁快"是误区。冲突一多，乐观锁大量重试，可能比直接加锁还慢；而且 synchronized 在低竞争时本身也有自旋等优化，开销并不大。</p>` },

  // ───────────── synchronized ─────────────
  { sec: 'synchronized 关键字', q: 'synchronized 是什么？有什么用？',
    a: `<p><code>synchronized</code> 是 Java 的关键字，用来保证被它修饰的方法或代码块<b>同一时刻只有一个线程能执行</b>，同时保证原子性、可见性、有序性。</p>
<p><b>历史</b>：早期它是"重量级锁"，因为底层直接用操作系统的互斥量（mutex），线程挂起和唤醒都要在用户态和内核态之间切换，很慢。<b>JDK 6</b> 起引入了偏向锁、轻量级锁、自旋、适应性自旋、锁消除、锁粗化等优化，性能大幅提升，JDK 源码和很多框架都大量使用它。</p>
<p>关于偏向锁：<b>JDK 15</b> 起默认关闭并被标记为废弃，之后的版本中相关实现已被移除。</p>`,
    links: [['synchronized', '../../02-并发/basics/01-synchronized.html']] },

  { sec: 'synchronized 关键字', q: '如何使用 synchronized？',
    a: `<p>三种用法，关键是看<b>锁的是哪个对象</b>：</p>
<table><tr><th>写法</th><th>锁对象</th></tr>
<tr><td>修饰实例方法</td><td>当前实例 <code>this</code></td></tr>
<tr><td>修饰静态方法</td><td>当前类的 <code>Class</code> 对象</td></tr>
<tr><td><code>synchronized(obj) { }</code></td><td>括号里指定的对象（可以是 <code>this</code>、<code>Xxx.class</code> 或任意对象）</td></tr></table>
<p><b>追问：静态 synchronized 方法和实例 synchronized 方法互斥吗？</b>不互斥。一个锁的是 Class 对象，一个锁的是实例对象，是两把不同的锁。</p>`,
    trap: `<ul><li><b>不要用 String 常量或 Integer 当锁</b>：字符串常量池、Integer 缓存会让不相干的代码拿到"同一把锁"，互相阻塞；而 <code>Integer</code> 做 <code>count++</code> 后变成了新对象，锁也跟着变了。</li>
<li>每次 <code>new</code> 一个对象来当锁等于没加锁。</li>
<li>锁的范围越小越好，只包住真正需要保护的代码。</li></ul>`,
    links: [['synchronized', '../../02-并发/basics/01-synchronized.html']] },

  { sec: 'synchronized 关键字', q: '构造方法可以用 synchronized 修饰吗？',
    a: `<p><b>不可以</b>，写了会编译报错。但构造方法<b>内部</b>可以使用 synchronized 代码块。</p>
<p><b>为什么不需要</b>：对象在构造完成之前，引用还没交出去，正常情况下别的线程根本拿不到它，所以没有必要对构造方法本身加锁。</p>`,
    trap: `<p>"构造方法天然线程安全"有前提：<b>不能让 this 在构造期间逸出</b>，比如在构造方法里启动线程并把 this 传过去，或者把 this 注册到全局监听器里。这时别的线程可能看到一个没构造完的对象。构造中如果要修改共享的静态数据（比如全局计数器），也仍然需要同步。</p>`,
    links: [['发布与逸出', '../../02-并发/basics/04-发布与逸出.html']] },

  { sec: 'synchronized 关键字', q: 'synchronized 的底层原理了解吗？', star: true,
    a: `<p><b>本质都是获取对象的监视器（monitor）</b>，只是字节码表现不同：</p>
<ul><li><b>同步代码块</b>：编译后是 <code>monitorenter</code> / <code>monitorexit</code> 指令。通常有<b>一个 enter、两个 exit</b>：一个用于正常退出，一个用于抛异常时退出，保证锁一定会被释放。</li>
<li><b>同步方法</b>：没有这两条指令，而是在方法的访问标志里加 <code>ACC_SYNCHRONIZED</code>。JVM 调用方法时看到这个标志，就自动去拿锁（实例方法锁 this，静态方法锁 Class 对象）。</li></ul>
<p><b>monitor 是什么</b>：在 HotSpot 里，锁膨胀成重量级锁后，对应一个 C++ 实现的 <code>ObjectMonitor</code>，主要字段有：<code>_owner</code>（当前持有锁的线程）、<code>_recursions</code>（重入次数）、<code>_EntryList</code>（抢锁失败在等的线程）、<code>_WaitSet</code>（调了 wait 的线程）。</p>
<p>获取锁时，如果没人持有就设 owner 为自己、计数 +1；自己已经持有就计数 +1（这就是<b>可重入</b>）；别人持有就进入等待。释放时计数 -1，减到 0 才真正释放。</p>`,
    more: `<p>可以用 <code>javap -c -v Xxx.class</code> 自己看字节码验证。</p>
<p><b>追问：为什么 wait/notify 必须在 synchronized 里调？</b>因为它们要操作的是 monitor 的 WaitSet，没持有这个 monitor 就无从操作，所以会抛 <code>IllegalMonitorStateException</code>。</p>`,
    trap: `<p>"每个对象里都内置了一个 ObjectMonitor"不准确。对象头里只有 <b>Mark Word</b>，只有锁膨胀成重量级锁时，才会分配（或复用）一个 ObjectMonitor 并让 Mark Word 指向它。无竞争时根本用不到它。</p>`,
    links: [['synchronized', '../../02-并发/basics/01-synchronized.html'], ['对象头与 Mark Word', '../../08-JVM/memory/08-对象头与MarkWord.html']] },

  { sec: 'synchronized 关键字', q: 'JDK 1.6 之后 synchronized 做了哪些优化？锁升级的过程是怎样的？',
    a: `<p><b>优化手段</b>：</p>
<ul><li><b>偏向锁、轻量级锁</b>：在没有竞争或竞争很轻时，不去动用 OS 的 mutex。</li>
<li><b>自旋 / 适应性自旋</b>：抢不到锁先原地循环等一小会儿，不马上挂起；自旋多久根据上次的成功率动态调整。</li>
<li><b>锁消除</b>：JIT 通过逃逸分析发现锁对象不可能被其他线程访问，就把锁去掉。</li>
<li><b>锁粗化</b>：一连串对同一对象的加锁解锁（比如循环里的 <code>StringBuffer.append</code>），合并成一次大范围的加锁。</li></ul>
<p><b>锁升级</b>（状态记在对象头的 Mark Word 里）：<b>无锁 → 偏向锁 → 轻量级锁 → 重量级锁</b>，随竞争加剧逐步升级：</p>
<ol><li><b>偏向锁</b>：第一次被某线程拿到时，把线程 ID 记在 Mark Word 里，之后这个线程再来几乎零成本。</li>
<li><b>轻量级锁</b>：出现别的线程来抢，撤销偏向；线程在自己栈帧里建一个"锁记录"，用 CAS 把 Mark Word 指向它，失败就自旋一会儿。</li>
<li><b>重量级锁</b>：自旋还拿不到，或竞争线程多，就膨胀成 ObjectMonitor，抢不到的线程被挂起，由 OS 调度。</li></ol>`,
    more: `<p>要注意版本差异：JDK 15 起偏向锁默认关闭，所以在现代 JDK 上，实际路径是<b>无锁 → 轻量级锁 → 重量级锁</b>。另外 JDK 21 起 HotSpot 还引入了新的轻量级锁实现（不再使用栈上的锁记录，由 <code>-XX:LockingMode</code> 控制），细节随版本在变，面试讲清楚思想即可。</p>`,
    trap: `<p>"锁只能升级不能降级"是常见说法，但不严谨：偏向锁可以被<b>撤销</b>回无锁；HotSpot 也会回收空闲的 ObjectMonitor（deflation），让对象回到非重量级状态。面试时可以说"升级过程是单向的，但 JVM 会在空闲时回收重量级锁"。</p>`,
    links: [['锁优化技术回顾', '../../08-JVM/concurrency/03-锁优化技术回顾.html'], ['对象头与 Mark Word', '../../08-JVM/memory/08-对象头与MarkWord.html'], ['逃逸分析与栈上分配', '../../08-JVM/compile/06-逃逸分析与栈上分配.html']] },

  { sec: 'synchronized 关键字', q: 'synchronized 的偏向锁为什么被废弃了？',
    a: `<p>依据是 <b>JEP 374</b>：<b>JDK 15</b> 起偏向锁默认关闭并标记为废弃（当时还能用 <code>-XX:+UseBiasedLocking</code> 手动打开），后续版本中该选项已失效、实现被移除。</p>
<p><b>原因两点</b>：</p>
<ol><li><b>收益变小了</b>：偏向锁主要让"总是同一个线程反复加锁"的场景受益，典型是 <code>Vector</code>、<code>Hashtable</code>、<code>StringBuffer</code> 这类老集合。现在大家都用 <code>ArrayList</code>、<code>ConcurrentHashMap</code> 等，这种场景少了。而一旦有别的线程来竞争，就要<b>撤销偏向锁</b>，撤销需要等到全局<b>安全点</b>（所有 Java 线程都暂停的时刻），代价很高。</li>
<li><b>维护成本太高</b>：偏向锁的代码复杂，侵入 HotSpot 的很多模块，给理解和重构带来困难。</li></ol>`,
    trap: `<p>很多老资料、老面经还把"偏向锁"当作锁升级的必经阶段来讲，回答时要主动补上版本说明，这反而是加分点。</p>`,
    links: [['锁优化技术回顾', '../../08-JVM/concurrency/03-锁优化技术回顾.html']] },

  { sec: 'synchronized 关键字', q: 'synchronized 和 volatile 有什么区别？', star: true,
    a: `<p>两者是<b>互补</b>的，不是二选一：</p>
<table><tr><th>维度</th><th>volatile</th><th>synchronized</th></tr>
<tr><td>修饰对象</td><td>只能修饰变量</td><td>方法、代码块</td></tr>
<tr><td>保证</td><td>可见性、有序性，<b>不保证原子性</b></td><td>原子性、可见性、有序性</td></tr>
<tr><td>是否阻塞</td><td>不会让线程阻塞</td><td>竞争时线程会阻塞</td></tr>
<tr><td>开销</td><td>读和普通变量差不多，写要加内存屏障</td><td>要获取/释放锁，竞争激烈时有上下文切换</td></tr>
<tr><td>解决的问题</td><td>变量在线程间的可见性</td><td>多线程访问资源的互斥与同步</td></tr></table>
<p><b>怎么选</b>：只需要可见性（状态标志、DCL 里的实例引用）用 volatile；有复合操作（<code>i++</code>、先检查后执行）必须用 synchronized、Lock 或原子类。</p>`,
    links: [['volatile 与可见性', '../../02-并发/basics/02-volatile与可见性.html'], ['synchronized', '../../02-并发/basics/01-synchronized.html']] },

  // ───────────── ReentrantLock ─────────────
  { sec: 'ReentrantLock', q: 'ReentrantLock 是什么？',
    a: `<p><code>ReentrantLock</code> 实现了 <code>Lock</code> 接口，是一把<b>可重入的独占锁</b>，作用和 synchronized 类似，但更灵活：支持公平/非公平、可中断等待、超时获取、多个 Condition。</p>
<p><b>底层是 AQS</b>（<code>AbstractQueuedSynchronizer</code>，JUC 里大多数锁和同步器的基础框架）：内部类 <code>Sync</code> 继承 AQS，又分成 <code>FairSync</code> 和 <code>NonfairSync</code> 两个子类。AQS 用一个 <code>volatile int state</code> 表示锁状态（0 为空闲，大于 0 表示重入次数），抢不到锁的线程进入一个双向等待队列并被 park 挂起。</p>
<pre><code>Lock lock = new ReentrantLock();   // 默认非公平；new ReentrantLock(true) 为公平锁
lock.lock();
try { /* 临界区 */ } finally { lock.unlock(); }   // unlock 必须放在 finally</code></pre>`,
    trap: `<p><code>lock()</code> 要写在 <code>try</code> <b>外面</b>：如果写在 try 里而 lock 本身抛了异常，finally 会去 unlock 一把没拿到的锁，抛出 <code>IllegalMonitorStateException</code>，把原来的异常盖掉。</p>`,
    links: [['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html'], ['AQS', '../../02-并发/advanced/07-AQS.html']] },

  { sec: 'ReentrantLock', q: '公平锁和非公平锁有什么区别？',
    a: `<ul><li><b>公平锁</b>：有竞争时按排队顺序来，等得最久的线程优先拿到锁。实现上是获取锁前先看队列里有没有人在排（<code>hasQueuedPredecessors()</code>），有就老老实实排队。</li>
<li><b>非公平锁</b>：新来的线程先直接尝试 CAS 抢锁（"插队"），抢不到才去排队。</li></ul>
<p><b>取舍</b>：非公平锁吞吐量更高——锁刚释放时，正在运行的新线程直接拿走，省去唤醒队首线程的上下文切换；代价是可能让排队的线程长时间"饥饿"。所以 <code>ReentrantLock</code> 和 synchronized 都默认非公平。</p>`,
    trap: `<ul><li>无参的 <code>tryLock()</code> <b>不遵守公平设置</b>，即使是公平锁也会直接插队抢；想要公平就用 <code>tryLock(0, TimeUnit.SECONDS)</code>。</li>
<li>公平锁也只保证"获取锁"的顺序，不保证线程被 OS 调度的顺序。</li></ul>`,
    links: [['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html']] },

  { sec: 'ReentrantLock', q: 'synchronized 和 ReentrantLock 有什么区别？', star: true,
    a: `<p><b>相同点</b>：都是<b>可重入</b>的独占锁。可重入指同一线程拿到锁后可以再次获取它，比如一个 synchronized 方法调用另一个同锁的 synchronized 方法不会把自己锁死。</p>
<table><tr><th>维度</th><th>synchronized</th><th>ReentrantLock</th></tr>
<tr><td>实现层面</td><td>JVM 关键字，编译成 monitor 指令</td><td>JDK 的 API，基于 AQS</td></tr>
<tr><td>加解锁</td><td>自动释放（异常也会释放）</td><td>手动 <code>lock/unlock</code>，必须 finally</td></tr>
<tr><td>等待可中断</td><td>不可中断</td><td><code>lockInterruptibly()</code></td></tr>
<tr><td>超时获取</td><td>不支持</td><td><code>tryLock(timeout)</code></td></tr>
<tr><td>公平性</td><td>只能非公平</td><td>可选公平/非公平</td></tr>
<tr><td>条件等待</td><td>一个等待队列（wait/notify）</td><td>可以有多个 <code>Condition</code>，精确唤醒</td></tr></table>
<p><b>怎么选</b>：一般场景优先 synchronized，写法简单、不会忘记释放；需要中断、超时、公平、多条件时用 ReentrantLock。</p>`,
    more: `<p><b>多个 Condition 的好处</b>：比如生产者—消费者，可以建 <code>notFull</code>、<code>notEmpty</code> 两个条件，生产者只唤醒消费者。synchronized 只有一个 WaitSet，<code>notifyAll()</code> 会把所有人都叫醒，其中大部分醒来发现条件不满足又去睡，白白浪费。<code>ArrayBlockingQueue</code> 就是这么实现的。</p>
<p><b>虚拟线程相关</b>：JDK 21 里虚拟线程在 synchronized 块内阻塞会"钉住"（pin）载体线程，当时建议改用 ReentrantLock；JDK 24（JEP 491）已经解决了这个问题。</p>`,
    trap: `<p>"ReentrantLock 性能比 synchronized 好"是 JDK 5 时代的结论。JDK 6 优化之后两者性能相近，不能作为选择理由。</p>`,
    links: [['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html'], ['Condition', '../../02-并发/advanced/04-Condition.html'], ['synchronized', '../../02-并发/basics/01-synchronized.html']] },

  { sec: 'ReentrantLock', q: '可中断锁和不可中断锁有什么区别？',
    a: `<p>区别在于：线程在<b>等待获取锁</b>而阻塞时，能不能因为被中断而提前放弃。</p>
<ul><li><b>不可中断锁</b>：收到中断信号也继续等，直到拿到锁；中断标志会保留下来，但不影响抢锁。<code>synchronized</code> 和 <code>ReentrantLock.lock()</code> 都是这样。</li>
<li><b>可中断锁</b>：等待中被中断，立即放弃并抛 <code>InterruptedException</code>，调用方可以做取消或清理。<code>lockInterruptibly()</code> 和 <code>tryLock(time, unit)</code> 都是可中断的。</li></ul>
<p><b>用途</b>：可以用来打破死锁，或者实现"用户取消了就别等了"这种可取消的任务。</p>`,
    trap: `<p>Java 的中断只是给线程设置一个<b>标志</b>，是一种协作机制，不会强行杀死线程。线程在 CPU 上正常计算时不会因为中断自动停下，要靠代码自己检查 <code>isInterrupted()</code>。</p>`,
    links: [['interrupt 中断', '../../02-并发/exec/07-interrupt中断.html']] },

  // ───────────── ReentrantReadWriteLock ─────────────
  { sec: 'ReentrantReadWriteLock', q: 'ReentrantReadWriteLock 是什么？',
    a: `<p>它实现了 <code>ReadWriteLock</code> 接口，是一把可重入的<b>读写锁</b>，实际是两把锁：</p>
<ul><li><b>读锁</b>（共享锁）：可以被多个线程同时持有。</li>
<li><b>写锁</b>（独占锁）：同一时刻只能被一个线程持有。</li></ul>
<p>规则：<b>读读不互斥，读写互斥，写写互斥</b>。普通独占锁是三种都互斥，读写锁放开了"读读"，所以读多的时候并发度更高。</p>
<p>底层同样基于 AQS，也支持公平/非公平（默认非公平）。</p>`,
    more: `<p><b>一个 state 怎么表示两把锁？</b>AQS 的 state 是 32 位 int，ReentrantReadWriteLock 把它<b>拆成两半</b>：高 16 位记读锁的持有数，低 16 位记写锁的重入次数。所以两者最大都是 65535。</p>`,
    links: [['ReadWriteLock', '../../02-并发/advanced/03-ReadWriteLock.html'], ['AQS', '../../02-并发/advanced/07-AQS.html']] },

  { sec: 'ReentrantReadWriteLock', q: 'ReentrantReadWriteLock 适合什么场景？',
    a: `<p><b>读多写少</b>。比如本地缓存、配置信息：大量线程同时读互不影响，偶尔有写入时才独占。这时它比 ReentrantLock 并发度高很多。</p>
<p>如果写很多，读写锁的额外开销反而让它不如普通锁；读写都很少时也没必要用。</p>`,
    trap: `<p>非公平模式下，读线程源源不断时，写线程可能一直拿不到锁（写饥饿）。这也是后来 JDK 8 推出 <code>StampedLock</code> 的动机之一。</p>`,
    links: [['ReadWriteLock', '../../02-并发/advanced/03-ReadWriteLock.html']] },

  { sec: 'ReentrantReadWriteLock', q: '共享锁和独占锁有什么区别？',
    a: `<ul><li><b>共享锁</b>：一把锁可以同时被多个线程持有，比如读写锁的读锁、<code>Semaphore</code>、<code>CountDownLatch</code>。</li>
<li><b>独占锁</b>（排他锁）：一把锁同一时刻只能被一个线程持有，比如 synchronized、ReentrantLock、读写锁的写锁。</li></ul>
<p>AQS 对这两种模式分别提供了模板方法：独占用 <code>tryAcquire/tryRelease</code>，共享用 <code>tryAcquireShared/tryReleaseShared</code>。</p>`,
    links: [['AQS', '../../02-并发/advanced/07-AQS.html'], ['Semaphore', '../../02-并发/blocks/06-Semaphore.html']] },

  { sec: 'ReentrantReadWriteLock', q: '线程持有读锁时还能获取写锁吗？',
    a: `<ul><li><b>持有读锁 → 不能再获取写锁</b>：获取写锁时只要发现读锁被占用就失败，<b>哪怕读锁是自己持有的</b>。</li>
<li><b>持有写锁 → 可以再获取读锁</b>：获取读锁时，只有写锁被<b>别的</b>线程持有才会失败。</li></ul>
<p>后者就是<b>锁降级</b>：先拿写锁、再拿读锁、再释放写锁，于是从写锁"降"到读锁，期间数据不会被别人改，保证自己改完之后读到的是自己刚写的值。</p>
<pre><code>w.lock();
try { update(); r.lock(); }      // 持有写锁时获取读锁
finally { w.unlock(); }          // 释放写锁，仍持有读锁
try { use(); } finally { r.unlock(); }</code></pre>`,
    trap: `<p>持有读锁时去 <code>writeLock().lock()</code> <b>不会报错，而是永远阻塞</b>，自己把自己锁死，排查起来很隐蔽。</p>`,
    links: [['ReadWriteLock', '../../02-并发/advanced/03-ReadWriteLock.html']] },

  { sec: 'ReentrantReadWriteLock', q: '读锁为什么不能升级为写锁？',
    a: `<p>因为<b>读锁可能同时被多个线程持有</b>。假设线程 A、B 都持有读锁，都想升级成写锁：写锁要求没有任何读锁，A 在等 B 放读锁，B 也在等 A 放读锁，两个人都不放，就<b>死锁</b>了。</p>
<p>所以 ReentrantReadWriteLock 只支持降级，不支持升级。需要"升级"时的正确做法：<b>先释放读锁，再获取写锁，拿到写锁后重新检查一遍数据</b>——因为释放读锁到获得写锁之间，数据可能已经被别人改了。</p>`,
    more: `<p><code>StampedLock</code> 提供了 <code>tryConvertToWriteLock(stamp)</code>，可以<b>尝试</b>升级：只有当前线程是唯一的读者时才会成功，否则返回 0，由调用方决定怎么处理，因此不会死锁。</p>`,
    links: [['ReadWriteLock', '../../02-并发/advanced/03-ReadWriteLock.html']] },

  // ───────────── StampedLock ─────────────
  { sec: 'StampedLock', q: 'StampedLock 是什么？',
    a: `<p><code>StampedLock</code> 是 JDK 8 引入的读写锁，<b>不可重入</b>，<b>不支持 Condition</b>。它没有实现 <code>Lock</code> 或 <code>ReadWriteLock</code> 接口，而是自己独立实现的。</p>
<p>提供三种模式：</p>
<ul><li><b>写锁</b>：独占，类似读写锁的写锁。</li>
<li><b>悲观读锁</b>：共享，没有写锁时多个线程可同时持有。</li>
<li><b>乐观读</b>：<b>根本不加锁</b>，只拿一个版本戳，读完再验证期间有没有写发生。</li></ul>
<p>获取锁时返回一个 <code>long</code> 类型的<b>戳（stamp）</b>，释放和验证都要用它；返回 0 表示获取失败。三种模式还可以通过 <code>tryConvertToXxx</code> 互相转换。</p>
<pre><code>long stamp = sl.tryOptimisticRead();       // 乐观读：不加锁
int x = this.x, y = this.y;                // 先把数据读到局部变量
if (!sl.validate(stamp)) {                 // 期间有写发生，退回悲观读
    stamp = sl.readLock();
    try { x = this.x; y = this.y; } finally { sl.unlockRead(stamp); }
}</code></pre>`,
    trap: `<p>它不可重入：同一线程持有写锁后再调 <code>writeLock()</code>，会<b>一直阻塞</b>（自己等自己）；用 <code>tryWriteLock()</code> 则立即返回 0。同一线程能多次拿读锁，是因为读锁本身共享，并不代表它可重入——StampedLock 根本不记录锁属于哪个线程。</p>`,
    links: [['StampedLock 与乐观读锁', '../../02-并发/modern/03-StampedLock与乐观读锁.html']] },

  { sec: 'StampedLock', q: 'StampedLock 的性能为什么更好？',
    a: `<p>关键在<b>乐观读</b>。ReentrantReadWriteLock 里，只要有读锁在，写线程就得等；读多的时候写线程可能长期饥饿。</p>
<p>StampedLock 的乐观读<b>不加锁</b>，所以不会挡住写线程：写线程可以随时拿到写锁，读线程事后用 <code>validate(stamp)</code> 发现数据被改了，再退回悲观读重新读一次。读多写少时，绝大多数乐观读都能验证通过，省掉了加锁解锁的开销，吞吐量更高。</p>`,
    more: `<p>乐观读本质就是前面讲的<b>乐观锁 + 版本号</b>思想：stamp 就是版本号，<code>validate</code> 就是比对版本号有没有变。</p>`,
    links: [['StampedLock 与乐观读锁', '../../02-并发/modern/03-StampedLock与乐观读锁.html']] },

  { sec: 'StampedLock', q: 'StampedLock 适合什么场景？',
    a: `<p>和读写锁一样适合<b>读多写少</b>，并且性能更好，可以作为 ReentrantReadWriteLock 的替代。</p>
<p><b>但以下情况不要用</b>：需要重入；需要 <code>Condition</code>；需要可靠地响应中断。它用起来也更复杂，乐观读的写法不对就会读到不一致的数据。</p>`,
    trap: `<ul><li>乐观读时要<b>先把字段复制到局部变量</b>，再 <code>validate</code>，验证通过后只用局部变量。不能在 validate 之后再回去读字段。</li>
<li>普通的 <code>readLock()</code> / <code>writeLock()</code> 不响应中断，线程阻塞在上面时被中断，可能出现 CPU 飙升的问题；需要中断时用 <code>readLockInterruptibly()</code> / <code>writeLockInterruptibly()</code>。</li></ul>`,
    links: [['StampedLock 与乐观读锁', '../../02-并发/modern/03-StampedLock与乐观读锁.html']] },

  { sec: 'StampedLock', q: 'StampedLock 的底层原理了解吗？',
    a: `<p>它没有基于 AQS，而是自己实现了一个类似的结构：</p>
<ul><li>用一个 <code>long state</code> 同时表示锁的类型和版本：一部分位记写锁状态和版本号，低位记读锁的数量。每次获取/释放写锁，版本都会变，乐观读的 <code>validate</code> 就是比较 state 的版本部分有没有变。</li>
<li>抢不到锁的线程放进一个基于 <b>CLH 队列</b>的等待队列。CLH 是一种对自旋锁的改进：每个等待线程只盯着自己前驱节点的状态，形成一个隐式链表，AQS 的队列也是 CLH 的变体。</li></ul>
<p>面试遇到的概率很小，能讲清楚"state 位运算 + 等待队列"的思路就够了，重点精力应该放在 AQS 上。</p>`,
    links: [['AQS', '../../02-并发/advanced/07-AQS.html'], ['StampedLock 与乐观读锁', '../../02-并发/modern/03-StampedLock与乐观读锁.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
</html>
