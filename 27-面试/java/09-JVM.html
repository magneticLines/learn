 */
const PAGE_KEY = 'interview:java:09';
const QA = [
  // ───────────── JVM 内存区域与对象 ─────────────
  { sec: 'JVM 内存区域与对象', q: 'JVM 运行时数据区包括哪些部分？哪些是线程私有的？', star: true,
    a: `<p>JVM 运行 Java 程序时，把自己管理的内存划成几块，按"是否线程共享"分两组：</p>
<table><tr><th>区域</th><th>共享？</th><th>存什么</th><th>会不会 OOM</th></tr>
<tr><td>程序计数器</td><td>私有</td><td>当前线程执行到哪条字节码</td><td><b>唯一不会</b>OOM 的区域</td></tr>
<tr><td>虚拟机栈</td><td>私有</td><td>Java 方法调用的栈帧</td><td>SOE / OOM</td></tr>
<tr><td>本地方法栈</td><td>私有</td><td>native 方法调用</td><td>SOE / OOM</td></tr>
<tr><td>堆</td><td>共享</td><td>绝大部分对象实例、数组</td><td>OOM</td></tr>
<tr><td>方法区</td><td>共享</td><td>类的元数据、运行时常量池、JIT 编译后的代码等</td><td>OOM</td></tr></table>
<p>另外还有<b>直接内存</b>，它不属于运行时数据区，但也会被频繁使用、也可能 OOM。</p>`,
    more: `<p><b>为什么这样分</b>：线程私有的区域跟着线程生、跟着线程死，不需要 GC 管；GC 主要管的是线程共享的堆和方法区。</p>`,
    trap: `<p>方法区是 <b>JVM 规范</b>里的逻辑概念；永久代（JDK 7 及以前）和元空间（JDK 8 起）是 <b>HotSpot 对它的具体实现</b>。别说"方法区就是元空间"。</p>`,
    links: [['运行时数据区', '../../00-Java基础/jvm/01-运行时数据区.html'], ['程序计数器', '../../08-JVM/memory/01-程序计数器.html']] },

  { sec: 'JVM 内存区域与对象', q: '程序计数器、虚拟机栈和本地方法栈分别有什么作用？一个方法从调用到返回，栈帧怎么变化？',
    a: `<ul><li><b>程序计数器</b>：记录当前线程下一条要执行的字节码地址。CPU 在多个线程间来回切换，切回来时靠它知道从哪继续。执行 native 方法时它的值为空。</li>
<li><b>虚拟机栈</b>：每调用一个 Java 方法，就压入一个<b>栈帧</b>；方法返回（正常 return 或抛异常）时栈帧弹出。</li>
<li><b>本地方法栈</b>：作用同上，但服务于 native 方法。HotSpot 把它和虚拟机栈合二为一。</li></ul>
<p><b>栈帧</b>里有 4 样东西：</p>
<ol><li><b>局部变量表</b>：方法参数和局部变量（基本类型的值、对象的引用）。</li>
<li><b>操作数栈</b>：字节码计算时的临时工作区，比如 <code>a + b</code> 要先把 a、b 压栈再相加。</li>
<li><b>动态链接</b>：指向运行时常量池中该方法的引用，用来把符号引用转成真实调用地址。</li>
<li><b>方法返回地址</b>：返回后回到调用者的哪条指令继续。</li></ol>`,
    links: [['Java 虚拟机栈与栈帧', '../../08-JVM/memory/02-Java虚拟机栈与栈帧.html'], ['局部变量表与操作数栈', '../../08-JVM/bytecode/01-局部变量表与操作数栈.html'], ['本地方法栈', '../../08-JVM/memory/03-本地方法栈.html']] },

  { sec: 'JVM 内存区域与对象', q: 'StackOverflowError 和 OutOfMemoryError 分别可能怎样产生？', star: true,
    a: `<ul><li><b>StackOverflowError</b>：线程请求的<b>栈深度</b>超过允许的上限。最常见的原因是<b>无限递归</b>或递归太深，每层递归都压一个栈帧，最后把栈撑满。单个线程栈大小由 <code>-Xss</code> 控制。</li>
<li><b>OutOfMemoryError</b>：某块内存<b>不够分配</b>且 GC 后也腾不出来。不同区域的提示不同：
<ul><li><code>Java heap space</code>：堆满了。</li>
<li><code>GC overhead limit exceeded</code>：GC 花了绝大部分时间却几乎回收不了内存（Parallel GC 下常见）。</li>
<li><code>Metaspace</code>：加载的类太多（动态代理、反射生成类、类加载器泄漏）。</li>
<li><code>Direct buffer memory</code>：直接内存不够。</li>
<li><code>unable to create native thread</code>：创建的线程太多，本地内存或系统线程数上限耗尽。</li></ul></li></ul>`,
    trap: `<p>两者都是 <code>Error</code>，不是 <code>Exception</code>，一般不该去 catch 它们继续跑。另外栈也可能 OOM：栈允许动态扩展却申请不到内存时（HotSpot 的栈不能动态扩展，所以栈上主要表现为 SOE，创建线程时申请不到栈内存则报 OOM）。</p>`,
    links: [['SOE 与 OOM 辨析', '../../08-JVM/memory/10-StackOverflowError与OutOfMemoryError辨析.html']] },

  { sec: 'JVM 内存区域与对象', q: 'Java 堆主要存放什么？所有对象都一定分配在堆上吗？', star: true,
    a: `<p>堆是 JVM 管理的最大一块内存，所有线程共享，<b>几乎所有对象实例和数组</b>都在这里分配，也是 GC 的主战场。为了方便分代回收，堆通常被划分成<b>新生代</b>（Eden + 两个 Survivor）和<b>老年代</b>。</p>
<p><b>不一定都在堆上</b>。JIT 编译器会做<b>逃逸分析</b>：判断一个对象会不会"逃出"当前方法（被返回、被赋给成员变量、被其他线程访问）。如果不会逃逸，就可能：</p>
<ul><li><b>标量替换</b>：干脆不创建对象，把它的字段拆成几个局部变量放在栈帧里。</li>
<li><b>锁消除</b>：对象只有自己线程用，上面的同步可以去掉。</li></ul>
<pre><code>int sum(int x, int y) {
    Point p = new Point(x, y);  // p 没逃出方法
    return p.x + p.y;           // 可能被优化成直接 x + y，不分配对象
}</code></pre>`,
    trap: `<p>HotSpot 实际做的主要是<b>标量替换</b>，而不是把整个对象搬到栈上。面试说"栈上分配"时最好加一句"HotSpot 通过标量替换实现类似效果"。另外逃逸分析只在 JIT 编译后生效，解释执行阶段没有这个优化。</p>`,
    links: [['堆：对象分配的主战场', '../../08-JVM/memory/04-堆Heap对象分配的主战场.html'], ['逃逸分析与栈上分配', '../../08-JVM/compile/06-逃逸分析与栈上分配.html'], ['堆内存分代', '../../00-Java基础/jvm/02-堆内存分代.html']] },

  { sec: 'JVM 内存区域与对象', q: '方法区、永久代和元空间是什么关系？为什么要用元空间替代永久代？', star: true,
    a: `<p><b>关系</b>：方法区是规范里的"接口"，永久代和元空间是 HotSpot 在不同版本的"实现"。</p>
<ul><li>JDK 7 及以前：用<b>永久代</b>（PermGen）实现，放在 JVM 堆内存里，大小由 <code>-XX:MaxPermSize</code> 固定。</li>
<li><b>JDK 8 起：移除永久代，改用元空间</b>（Metaspace），使用<b>本地内存</b>（操作系统内存，不在 JVM 堆里）。</li></ul>
<p><b>为什么换</b>：</p>
<ol><li>永久代大小固定且不好估，动态生成类多的应用（Spring 代理、JSP、Groovy）很容易 <code>PermGen space</code> OOM；元空间默认只受本机内存限制。</li>
<li>永久代的回收和调优很麻烦，放到本地内存后可以简化 GC。</li>
<li>HotSpot 要和 JRockit 合并，JRockit 本来就没有永久代。</li></ol>`,
    more: `<p><b>搬家细节</b>：JDK 7 已经先把<b>字符串常量池</b>和<b>静态变量</b>从永久代挪到了堆里；JDK 8 再把剩下的类元数据挪到元空间。</p>`,
    trap: `<p>元空间"默认不设上限"不代表不会 OOM：类加载器泄漏时它会一直涨，吃光机器内存。生产上建议设 <code>-XX:MaxMetaspaceSize</code>。</p>`,
    links: [['方法区与元空间的演变', '../../08-JVM/memory/05-方法区与元空间的演变.html']] },

  { sec: 'JVM 内存区域与对象', q: '运行时常量池和字符串常量池有什么区别？位置有哪些变化？',
    a: `<ul><li><b>运行时常量池</b>：每个类都有一份。Class 文件里的<b>常量池表</b>（字面量 + 类、字段、方法的符号引用）在类加载后放进这里。它是方法区的一部分，JDK 8 起在元空间里。</li>
<li><b>字符串常量池</b>：整个 JVM <b>全局一份</b>，本质是一张 String 对象的哈希表（StringTable），用来让相同内容的字符串字面量复用同一个对象。<b>JDK 7 起从永久代移到了堆里</b>。</li></ul>
<pre><code>String a = "hi";               // 从字符串常量池取
String b = new String("hi");   // 堆上新建一个对象
a == b.intern();               // true：intern 返回池里那个</code></pre>`,
    more: `<p><b>为什么要把字符串常量池移到堆</b>：永久代只有 Full GC 才回收，而程序里字符串很多，放在堆里能被正常的 GC 及时回收。</p>` },

  { sec: 'JVM 内存区域与对象', q: '直接内存属于 JVM 运行时数据区吗？它为什么也可能 OOM？',
    a: `<p><b>不属于</b>。直接内存是 JVM 通过 native 方法（如 <code>Unsafe.allocateMemory</code>）从操作系统直接申请的本地内存，不在 Java 堆里。</p>
<p><b>为什么要用</b>：NIO 的 <code>ByteBuffer.allocateDirect()</code> 申请直接内存后，读写文件或网络时可以省掉"堆内存 ↔ 本地内存"之间的一次拷贝。Netty 大量使用它。</p>
<p><b>为什么会 OOM</b>：它有上限（<code>-XX:MaxDirectMemorySize</code>，不设时默认约等于最大堆大小），超了就报 <code>OutOfMemoryError: Direct buffer memory</code>。</p>`,
    trap: `<p>直接内存的释放依赖 <code>DirectByteBuffer</code> 这个 Java 对象被 GC 回收（之后由 Cleaner 释放本地内存）。如果堆很空闲、迟迟不 GC，直接内存就一直不还，可能出现"堆没满却 OOM"的现象。排查时只看堆使用率会被误导。</p>` },

  { sec: 'JVM 内存区域与对象', q: 'HotSpot 创建一个对象要经过哪些步骤？', star: true,
    a: `<p><code>new</code> 一个对象，分 5 步：</p>
<ol><li><b>类加载检查</b>：看这个类是否已加载、解析、初始化过，没有就先做类加载。</li>
<li><b>分配内存</b>：对象大小在类加载后就确定了，从堆里划一块出来。</li>
<li><b>初始化零值</b>：把分到的内存清零（不含对象头），所以字段不赋值也有默认值 0 / null / false。</li>
<li><b>设置对象头</b>：写入这个对象属于哪个类、哈希码、GC 分代年龄、锁状态等。</li>
<li><b>执行 <code>&lt;init&gt;</code></b>：按程序员写的字段初始化和构造方法赋值。到这一步，对象才算真正可用。</li></ol>`,
    more: `<p><b>分配内存的两种方式</b>，取决于堆是否规整（又取决于 GC 是否带压缩整理）：</p>
<ul><li><b>指针碰撞</b>：堆规整时，已用和空闲以一个指针分界，分配就是把指针往后挪（Serial、ParNew 等带整理的收集器）。</li>
<li><b>空闲列表</b>：堆不规整时，维护一张"哪些块空闲"的表，从中找一块够大的（CMS 这种标记-清除收集器）。</li></ul>
<p><b>并发分配怎么保证安全</b>：两个线程同时挪同一个指针会冲突。HotSpot 两手准备：</p>
<ul><li><b>CAS + 失败重试</b>：乐观地更新指针，失败就重来。</li>
<li><b>TLAB</b>（Thread Local Allocation Buffer）：预先在 Eden 里给每个线程划一小块私有区域，线程先在自己的 TLAB 里分配，完全无竞争；TLAB 用完了再用 CAS 申请新的。</li></ul>`,
    links: [['对象的创建过程', '../../08-JVM/memory/06-对象的创建过程.html']] },

  { sec: 'JVM 内存区域与对象', q: '对象在内存中的布局是怎样的？对象头、实例数据和对齐填充分别存什么？',
    a: `<ol><li><b>对象头</b>：
<ul><li><b>Mark Word</b>：哈希码、GC 分代年龄、锁状态标志、偏向线程 ID 等，64 位 JVM 上占 8 字节，内容随锁状态复用。</li>
<li><b>类型指针</b>（Klass Pointer）：指向方法区里的类元数据，JVM 靠它知道对象是哪个类的实例。开启压缩类指针时占 4 字节。</li>
<li>如果是<b>数组</b>，还有一段记录数组长度。</li></ul></li>
<li><b>实例数据</b>：真正的字段内容，包括从父类继承的字段。</li>
<li><b>对齐填充</b>：HotSpot 要求对象大小是 <b>8 字节的整数倍</b>，不够就补齐。没有实际含义。</li></ol>
<p>例：64 位 JVM 开启压缩指针时，<code>new Object()</code> 是 8 + 4 = 12 字节，补齐到 <b>16 字节</b>。</p>`,
    more: `<p>分代年龄在 Mark Word 里只占 <b>4 位</b>，最大只能表示 15，所以 <code>-XX:MaxTenuringThreshold</code> 最大就是 15。synchronized 的锁升级（无锁 → 轻量级锁 → 重量级锁）也是靠改写 Mark Word 实现的。</p>`,
    links: [['对象的内存布局', '../../08-JVM/memory/07-对象的内存布局.html'], ['对象头与 Mark Word', '../../08-JVM/memory/08-对象头与MarkWord.html']] },

  { sec: 'JVM 内存区域与对象', q: '句柄访问和直接指针访问对象有什么区别？HotSpot 用哪种？',
    a: `<p>栈里的引用变量怎么找到堆里的对象，有两种方案：</p>
<ul><li><b>句柄</b>：堆里划一块"句柄池"，引用指向句柄，句柄里再存对象实例地址和类型数据地址。<b>好处</b>：对象被 GC 移动时只改句柄，引用本身不用变。<b>坏处</b>：访问要多跳一次。</li>
<li><b>直接指针</b>：引用直接存对象地址，类型信息通过对象头里的类型指针去找。<b>好处</b>：少一次跳转，访问更快。<b>坏处</b>：对象移动时要更新所有指向它的引用。</li></ul>
<p><b>HotSpot 主要用直接指针</b>，因为对象访问极其频繁，省下的这一跳积少成多。</p>`,
    links: [['对象访问定位', '../../08-JVM/memory/09-对象访问定位.html']] },

  // ───────────── 类文件与类加载 ─────────────
  { sec: '类文件与类加载', q: 'Class 文件由哪些部分组成？方法的字节码保存在哪里？',
    a: `<p>Class 文件是一串紧凑的二进制数据，按固定顺序排列：</p>
<ol><li><b>魔数</b> <code>0xCAFEBABE</code>：前 4 个字节，标明"这是个 Class 文件"。</li>
<li><b>版本号</b>：次版本 + 主版本，比如主版本 52 = JDK 8，61 = JDK 17。低版本 JVM 遇到高版本 Class 会报 <code>UnsupportedClassVersionError</code>。</li>
<li><b>常量池</b>：字面量（字符串、final 常量）和符号引用（类名、字段名、方法名和描述符），可以理解为这个类的"资源仓库"。</li>
<li><b>访问标志</b>：public、final、interface、abstract 等。</li>
<li><b>当前类、父类、接口索引</b>。</li>
<li><b>字段表</b>、<b>方法表</b>。</li>
<li><b>属性表</b>。</li></ol>
<p><b>方法的字节码指令</b>存在方法表里每个方法的 <b>Code 属性</b>中，同时记录了操作数栈最大深度、局部变量表大小和异常表。</p>`,
    more: `<p>可以用 <code>javap -v Xxx.class</code> 查看反编译后的完整结构，面试时说出这个命令很加分。</p>`,
    links: [['Class 文件的组成', '../../08-JVM/classloading/01-Class文件的组成.html'], ['字节码指令集简介', '../../08-JVM/classloading/02-字节码指令集简介.html']] },

  { sec: '类文件与类加载', q: '一个类从加载到卸载要经历哪些阶段？每个阶段做了什么？', star: true,
    a: `<p>生命周期 7 个阶段：<b>加载 → 验证 → 准备 → 解析 → 初始化 → 使用 → 卸载</b>。其中验证、准备、解析合称<b>连接</b>。</p>
<ol><li><b>加载</b>：通过全限定名找到二进制字节流（可以来自 jar、网络、动态生成），转成方法区里的运行时结构，并在堆里生成一个 <code>Class</code> 对象作为访问入口。</li>
<li><b>验证</b>：检查字节流是否合法、安全（格式、语义、字节码、符号引用），防止恶意或损坏的 Class 危害 JVM。</li>
<li><b>准备</b>：给<b>静态变量</b>分配内存并设为<b>零值</b>。</li>
<li><b>解析</b>：把常量池里的<b>符号引用</b>（一个名字）替换成<b>直接引用</b>（真实的内存地址或偏移）。</li>
<li><b>初始化</b>：执行类构造器 <code>&lt;clinit&gt;()</code>，也就是静态变量赋值语句和 static 代码块。</li></ol>
<p><b>卸载</b>条件很苛刻：该类所有实例都被回收、加载它的类加载器被回收、它的 Class 对象没有被引用。所以 JDK 自带类加载器加载的类基本不会卸载。</p>`,
    trap: `<p>这几个阶段是按顺序<b>开始</b>的，但不一定按顺序<b>结束</b>，常常交叉进行。解析阶段也不一定在初始化之前，为了支持动态绑定，有些解析可以推迟到初始化之后。</p>`,
    links: [['类加载五阶段', '../../08-JVM/classloading/03-类加载五阶段.html'], ['类加载流程', '../../00-Java基础/jvm/10-类加载流程.html']] },

  { sec: '类文件与类加载', q: '准备阶段和初始化阶段给静态变量赋值有什么区别？<clinit> 和 <init> 有什么区别？',
    a: `<pre><code>static int a = 123;
static final int B = 456;</code></pre>
<ul><li><b>准备阶段</b>：<code>a</code> 被设为零值 <b>0</b>；而 <code>B</code> 是编译期常量（带 ConstantValue 属性），准备阶段就直接赋成 <b>456</b>。</li>
<li><b>初始化阶段</b>：执行 <code>&lt;clinit&gt;</code>，<code>a</code> 才被赋成 <b>123</b>。</li></ul>
<table><tr><th></th><th><code>&lt;clinit&gt;</code> 类构造器</th><th><code>&lt;init&gt;</code> 实例构造器</th></tr>
<tr><td>来源</td><td>编译器收集所有静态变量赋值和 static 块，按源码顺序合并</td><td>字段初始化、实例代码块 + 构造方法</td></tr>
<tr><td>执行时机</td><td>类初始化时，<b>只执行一次</b></td><td>每次 <code>new</code> 都执行</td></tr>
<tr><td>父类</td><td>JVM 保证父类的先执行</td><td>第一行显式或隐式调用 <code>super()</code></td></tr></table>`,
    more: `<p>JVM 保证 <code>&lt;clinit&gt;</code> 在多线程下<b>只被一个线程执行</b>，其他线程阻塞等待——这就是"静态内部类单例"线程安全的原理。反过来，如果 static 块里有耗时或死循环，其他用到这个类的线程会一起卡住。</p>` },

  { sec: '类文件与类加载', q: '哪些情况会触发类的初始化？访问编译期常量会触发吗？', star: true,
    a: `<p>规范规定<b>有且只有</b>以下"主动使用"会触发初始化：</p>
<ol><li>执行 <code>new</code>、读写静态字段（<code>getstatic</code>/<code>putstatic</code>）、调用静态方法（<code>invokestatic</code>）。</li>
<li>通过反射调用，比如 <code>Class.forName("X")</code>。</li>
<li>初始化子类时，父类还没初始化则先初始化父类。</li>
<li>JVM 启动时，包含 <code>main</code> 方法的主类。</li>
<li><code>MethodHandle</code> 解析结果为静态字段/方法的句柄。</li>
<li>接口定义了 default 方法时，实现类初始化前要先初始化该接口。</li></ol>
<p><b>不会触发</b>的"被动引用"：</p>
<ul><li>访问<b>编译期常量</b>（<code>static final</code> 基本类型或字符串字面量）：编译时已直接内联到调用方的常量池了。</li>
<li>通过子类访问父类的静态字段：只初始化父类。</li>
<li><code>new X[10]</code> 定义数组：不会初始化 X。</li></ul>`,
    trap: `<p><code>static final Integer X = 1;</code> 或 <code>static final int Y = compute();</code> <b>不是</b>编译期常量，访问它们<b>会</b>触发初始化。另外 <code>ClassLoader.loadClass()</code> 只加载不初始化，而 <code>Class.forName()</code> 默认会初始化。</p>`,
    links: [['类初始化的触发时机', '../../08-JVM/classloading/04-类初始化的触发时机.html']] },

  { sec: '类文件与类加载', q: 'JDK 有哪些类加载器？分别加载哪些类？', star: true,
    a: `<table><tr><th>加载器</th><th>JDK 8</th><th>JDK 9+</th></tr>
<tr><td><b>启动类加载器</b> Bootstrap</td><td>C++ 实现，加载 <code>jre/lib</code> 下的核心类（rt.jar）</td><td>加载 <code>java.base</code> 等核心模块</td></tr>
<tr><td>第二层</td><td><b>扩展类加载器</b> Extension，加载 <code>jre/lib/ext</code></td><td>改为<b>平台类加载器</b> Platform，加载 <code>java.sql</code> 等平台模块</td></tr>
<tr><td><b>应用类加载器</b> App</td><td colspan="2">加载 classpath 上的类，也就是我们自己写的代码和第三方 jar</td></tr></table>
<p>还可以继承 <code>ClassLoader</code> 写<b>自定义类加载器</b>，比如从网络加载、给字节码解密。</p>`,
    trap: `<p>启动类加载器在 Java 里<b>拿不到对象</b>：<code>String.class.getClassLoader()</code> 返回 <code>null</code>，null 就代表 Bootstrap。另外各加载器之间的"父子"关系是<b>组合</b>（持有一个 parent 字段），不是继承。</p>`,
    links: [['双亲委派模型', '../../08-JVM/classloading/05-双亲委派模型.html']] },

  { sec: '类文件与类加载', q: '什么是双亲委派模型？它是怎样执行的，有什么好处？', star: true,
    a: `<p><b>规则</b>：类加载器收到加载请求时，<b>先交给父加载器</b>去加载；父加载器搞不定（在自己的范围内找不到），自己才动手。</p>
<p><b>执行流程</b>（就是 <code>ClassLoader.loadClass()</code> 的源码）：</p>
<ol><li><code>findLoadedClass</code>：已经加载过就直接返回。</li>
<li>有父加载器就调 <code>parent.loadClass()</code>；父为 null 就交给启动类加载器。</li>
<li>父加载器抛 <code>ClassNotFoundException</code>，自己调 <code>findClass()</code> 加载。</li></ol>
<p><b>好处</b>：</p>
<ul><li><b>避免重复加载</b>：同一个类总是由同一个加载器加载。</li>
<li><b>保护核心类</b>：你自己写一个 <code>java.lang.String</code>，请求会一路交给启动类加载器，它加载的是 JDK 自带那个，你的版本永远加载不到，核心 API 不会被篡改。</li></ul>`,
    more: `<p><b>追问：两个类全限定名相同，一定是同一个类吗？</b>不一定。JVM 判断类的身份看 <b>"全限定名 + 加载它的类加载器"</b>。同一个 Class 文件被两个不同的加载器加载，就是两个不同的类，互相强转会抛 <code>ClassCastException</code>。Tomcat 正是利用这点让不同 Web 应用里的同名类互相隔离。</p>`,
    links: [['双亲委派模型', '../../08-JVM/classloading/05-双亲委派模型.html'], ['为什么要有双亲委派', '../../08-JVM/classloading/06-为什么要有双亲委派.html'], ['双亲委派（基础篇）', '../../00-Java基础/jvm/11-双亲委派模型.html']] },

  { sec: '类文件与类加载', q: '哪些场景会打破双亲委派？线程上下文类加载器解决了什么问题？', star: true,
    a: `<ul><li><b>SPI（如 JDBC）</b>：接口 <code>java.sql.Driver</code> 在核心库，由启动类加载器加载；但具体实现（MySQL 驱动）在 classpath 上，启动类加载器"看不见"。于是引入<b>线程上下文类加载器</b>（<code>Thread.getContextClassLoader()</code>，默认是应用类加载器），让核心库代码借它去加载实现类——相当于<b>父加载器请子加载器帮忙</b>。</li>
<li><b>Tomcat</b>：每个 Web 应用一个 <code>WebappClassLoader</code>，<b>优先加载自己应用里的类</b>，找不到再交给父加载器。目的是让不同应用可以用不同版本的同名库而互不干扰（核心 Java 类仍然先委派，防止被覆盖）。</li>
<li><b>热部署 / OSGi</b>：换一个新的类加载器重新加载修改后的类，旧加载器连同旧类一起丢弃。</li></ul>`,
    trap: `<p>"打破"的方式是<b>重写 <code>loadClass()</code></b> 改变委派顺序；线程上下文类加载器则是绕过了委派方向，严格说也属于"破坏"。不同场景目的不同：SPI 是为了"向下"加载，Tomcat 是为了隔离，热部署是为了替换。</p>`,
    links: [['打破双亲委派的场景', '../../08-JVM/classloading/07-打破双亲委派的场景.html'], ['破坏双亲委派', '../../00-Java基础/jvm/12-破坏双亲委派.html']] },

  { sec: '类文件与类加载', q: '自定义类加载器通常要重写 findClass() 还是 loadClass()？',
    a: `<ul><li><b>只想换个地方加载类、保留双亲委派</b>：重写 <code>findClass()</code>。父加载器找不到时才会走到它，在里面读取字节码再调用 <code>defineClass()</code> 转成 Class 对象即可。<b>这是推荐做法</b>。</li>
<li><b>要打破双亲委派</b>（比如先自己加载）：重写 <code>loadClass()</code>，因为委派逻辑就写在它里面。</li></ul>
<pre><code>protected Class&lt;?&gt; findClass(String name) throws ClassNotFoundException {
    byte[] bytes = readAndDecrypt(name);          // 例如从加密文件读取
    return defineClass(name, bytes, 0, bytes.length);
}</code></pre>`,
    trap: `<p>即使重写了 loadClass，也无法自己定义 <code>java.*</code> 开头的类：<code>defineClass</code> 会检查包名并抛 <code>SecurityException</code>。</p>` },

  // ───────────── 垃圾回收 ─────────────
  { sec: '垃圾回收', q: '对象一般怎样分配和晋升到老年代？什么是空间分配担保？', star: true,
    a: `<p>新生代分 <b>Eden + Survivor0 + Survivor1</b>，默认 8:1:1（<code>-XX:SurvivorRatio=8</code>）。</p>
<ol><li><b>优先在 Eden 分配</b>。Eden 满了触发一次 Minor GC。</li>
<li>存活对象被复制到一个空的 Survivor，年龄 +1；两个 Survivor 轮流当"去处"。</li>
<li><b>长期存活的进老年代</b>：年龄达到阈值（<code>-XX:MaxTenuringThreshold</code>，默认 15）就晋升。</li>
<li><b>动态年龄判定</b>：Survivor 中某年龄及以下的对象总大小超过 Survivor 一半，这个年龄以上的直接晋升，不必等到 15。</li>
<li><b>大对象直接进老年代</b>：比如很长的数组，避免在 Eden 和 Survivor 之间来回复制。</li></ol>
<p><b>空间分配担保</b>：Minor GC 前，JVM 检查老年代最大连续可用空间是否大于新生代所有对象总大小。大于就放心 Minor GC；否则看老年代剩余空间是否大于<b>历次晋升的平均大小</b>，大于就冒险做 Minor GC，不行就先做 Full GC。意思是"万一 Survivor 放不下，老年代给兜底"。</p>`,
    trap: `<p><code>-XX:PretenureSizeThreshold</code> 只对 Serial、ParNew 有效。G1 里"大对象"是超过 Region 一半大小的对象，放在专门的 Humongous Region。</p>`,
    links: [['对象优先在 Eden 分配', '../../08-JVM/gc/13-对象优先在Eden分配.html'], ['大对象直接进老年代', '../../08-JVM/gc/14-大对象直接进老年代.html'], ['长期存活对象进入老年代', '../../08-JVM/gc/15-长期存活对象进入老年代.html'], ['空间分配担保机制', '../../08-JVM/gc/16-空间分配担保机制.html']] },

  { sec: '垃圾回收', q: '如何判断对象是否可以回收？引用计数法有什么问题？哪些对象可以作为 GC Roots？', star: true,
    a: `<p><b>引用计数法</b>：每个对象带一个计数器，被引用 +1，引用失效 −1，为 0 就回收。简单高效，但<b>解决不了循环引用</b>：A 引用 B、B 引用 A，外部都不用了，计数却永远不为 0。</p>
<p><b>可达性分析</b>（Java 实际用的）：从一组 <b>GC Roots</b> 出发沿引用链往下找，<b>找不到的对象就是不可达的</b>，可以回收。循环引用的 A、B 如果从 Roots 走不到，一样会被回收。</p>
<p><b>可作为 GC Roots 的</b>：</p>
<ul><li>虚拟机栈中局部变量引用的对象（正在执行的方法里用着的）</li>
<li>本地方法栈中 JNI 引用的对象</li>
<li>方法区中类的静态变量、常量引用的对象</li>
<li>被 <code>synchronized</code> 持有的锁对象</li>
<li>JVM 内部引用，如基本类型的 Class 对象、常驻异常对象、系统类加载器</li></ul>`,
    more: `<p>不可达也不是立刻就死：如果对象重写了 <code>finalize()</code> 且还没执行过，会被放进队列执行一次，在里面把自己重新挂到引用链上就能"复活"。但 <code>finalize</code> 执行时机不确定、性能差，JDK 9 起已标记废弃，不要依赖它。</p>`,
    links: [['引用计数法 vs 可达性分析', '../../08-JVM/gc/01-引用计数法vs可达性分析.html'], ['可达性分析', '../../00-Java基础/jvm/07-可达性分析.html'], ['finalize 的角色与陷阱', '../../08-JVM/gc/03-finalize方法的角色与陷阱.html']] },

  { sec: '垃圾回收', q: '强引用、软引用、弱引用和虚引用有什么区别？',
    a: `<table><tr><th>类型</th><th>何时被回收</th><th>典型用途</th></tr>
<tr><td><b>强引用</b> <code>Object o = new Object()</code></td><td>只要还有强引用就<b>绝不回收</b>，宁可 OOM</td><td>日常代码</td></tr>
<tr><td><b>软引用</b> <code>SoftReference</code></td><td><b>内存不够时</b>才回收</td><td>内存敏感的缓存</td></tr>
<tr><td><b>弱引用</b> <code>WeakReference</code></td><td><b>下次 GC 就回收</b>，不管内存够不够</td><td><code>WeakHashMap</code>、ThreadLocalMap 的 key</td></tr>
<tr><td><b>虚引用</b> <code>PhantomReference</code></td><td>不影响回收，<code>get()</code> 永远返回 null</td><td>配合 <code>ReferenceQueue</code> 得知对象被回收，做资源清理（如 Cleaner 释放直接内存）</td></tr></table>`,
    trap: `<p>软/弱/虚引用本身也是一个对象，被回收的只是它指向的那个对象。另外软引用做缓存不好控制：回收时机由 JVM 决定，内存紧张时可能一下子全被清掉，实际项目更常用 Caffeine 这类有明确淘汰策略的缓存。</p>`,
    links: [['四种引用类型', '../../08-JVM/gc/02-四种引用类型.html'], ['引用类型', '../../00-Java基础/jvm/06-引用类型.html']] },

  { sec: '垃圾回收', q: '标记-清除、复制和标记-整理算法各有什么优缺点？为什么要分代收集？', star: true,
    a: `<table><tr><th>算法</th><th>做法</th><th>优点</th><th>缺点</th></tr>
<tr><td><b>标记-清除</b></td><td>标记存活对象，清掉其余</td><td>简单，不移动对象</td><td>产生<b>内存碎片</b>；对象多时效率低</td></tr>
<tr><td><b>标记-复制</b></td><td>内存分两块，把存活对象复制到另一块，原块整个清空</td><td>无碎片，存活少时很快</td><td>浪费一部分空间；存活多时复制成本高</td></tr>
<tr><td><b>标记-整理</b></td><td>标记后把存活对象往一端移动，清掉边界外的</td><td>无碎片，不浪费空间</td><td>移动对象要更新引用，且通常要暂停用户线程</td></tr></table>
<p><b>分代收集</b>基于一个观察："<b>绝大多数对象朝生夕死</b>，熬过多次 GC 的对象很难再死"。所以：</p>
<ul><li><b>新生代</b>每次只有少量存活 → 用<b>复制</b>，代价小。Eden:Survivor = 8:1:1，只"浪费"10%。</li>
<li><b>老年代</b>存活率高、没有额外空间做担保 → 用<b>标记-清除</b>或<b>标记-整理</b>。</li></ul>`,
    links: [['标记清除', '../../08-JVM/gc/04-标记清除算法.html'], ['标记复制', '../../08-JVM/gc/05-标记复制算法.html'], ['标记整理', '../../08-JVM/gc/06-标记整理算法.html'], ['分代收集理论', '../../08-JVM/gc/07-分代收集理论.html']] },

  { sec: '垃圾回收', q: 'Minor GC、Major GC 和 Full GC 有什么区别？哪些情况会触发 Full GC？',
    a: `<ul><li><b>Minor GC / Young GC</b>：只回收新生代。Eden 满时触发，频繁但通常很快。</li>
<li><b>Major GC / Old GC</b>：只回收老年代，只有 CMS 有单独的老年代并发回收。这个词在不同资料里含义不统一，有人用它指 Full GC。</li>
<li><b>Mixed GC</b>：G1 特有，回收整个新生代 + 部分老年代 Region。</li>
<li><b>Full GC</b>：回收整个堆和方法区，停顿通常最长。</li></ul>
<p><b>常见触发 Full GC 的原因</b>：</p>
<ul><li>老年代空间不足（晋升太多、大对象太多）</li>
<li>空间分配担保失败</li>
<li>元空间达到阈值</li>
<li>代码调用了 <code>System.gc()</code>（只是建议，JVM 可以不理）</li>
<li>CMS 的 concurrent mode failure、G1 的 to-space exhausted 等收集器退化</li></ul>`,
    trap: `<p>不同收集器、不同 JDK 版本的 GC 日志里事件名称不一样，回答时先说明"以 G1 / JDK 17 为例"再展开，能避免追问时自相矛盾。</p>`,
    links: [['GC 算法', '../../00-Java基础/jvm/08-GC算法.html']] },

  { sec: '垃圾回收', q: 'Serial、Parallel、CMS、G1 和 ZGC 的目标和适用场景有什么不同？', star: true,
    a: `<table><tr><th>收集器</th><th>特点</th><th>目标 / 场景</th></tr>
<tr><td><b>Serial / Serial Old</b></td><td>单线程，回收时暂停所有用户线程（STW）</td><td>客户端、小内存、单核</td></tr>
<tr><td><b>ParNew</b></td><td>Serial 的多线程版</td><td>过去常与 CMS 搭配</td></tr>
<tr><td><b>Parallel Scavenge / Old</b></td><td>多线程，关注<b>吞吐量</b></td><td>后台批处理；<b>JDK 8 默认</b></td></tr>
<tr><td><b>CMS</b></td><td>老年代并发标记-清除，关注<b>低停顿</b></td><td>JDK 9 废弃，<b>JDK 14 移除</b></td></tr>
<tr><td><b>G1</b></td><td>Region 化，可设停顿目标，兼顾吞吐和延迟</td><td><b>JDK 9 起默认</b>，通用首选</td></tr>
<tr><td><b>ZGC</b></td><td>几乎全并发，停顿通常在毫秒以下，支持 TB 级堆</td><td>超低延迟、大堆；JDK 15 可用于生产</td></tr></table>
<p><b>STW</b>（Stop-The-World）：GC 时暂停所有用户线程。吞吐量 = 用户代码时间 /（用户代码时间 + GC 时间）。低停顿和高吞吐往往此消彼长，选收集器就是在这两者和内存占用之间取舍。</p>`,
    more: `<p><b>ZGC 的版本线</b>：JDK 21 引入分代 ZGC（需 <code>-XX:+ZGenerational</code>），JDK 23 起分代模式成为 ZGC 的默认模式，JDK 24 移除了非分代模式。另一个低延迟收集器是 Red Hat 主导的 <b>Shenandoah</b>。</p>`,
    links: [['垃圾收集器', '../../00-Java基础/jvm/09-垃圾收集器.html'], ['Serial / ParNew', '../../08-JVM/gc/08-SerialParNew收集器.html'], ['Parallel Scavenge 与 Parallel Old', '../../08-JVM/gc/09-ParallelScavenge与ParallelOld.html']] },

  { sec: '垃圾回收', q: 'CMS 的回收过程是怎样的？为什么会产生内存碎片和浮动垃圾？',
    a: `<p>CMS（Concurrent Mark Sweep）的 4 个阶段：</p>
<ol><li><b>初始标记</b>（STW）：只标记 GC Roots 直接关联的对象，很快。</li>
<li><b>并发标记</b>：和用户线程一起跑，沿引用链遍历整个对象图，最耗时但不停顿。</li>
<li><b>重新标记</b>（STW）：修正并发标记期间用户线程改动的那部分引用。</li>
<li><b>并发清除</b>：和用户线程一起清理死对象。</li></ol>
<p><b>三大问题</b>：</p>
<ul><li><b>内存碎片</b>：用的是标记-<b>清除</b>，不整理，时间长了大对象找不到连续空间，被迫提前 Full GC。</li>
<li><b>浮动垃圾</b>：并发清除时用户线程还在产生新垃圾，这次标记不到，只能等下次。也因此要预留空间，不能等老年代满了才开始回收。</li>
<li><b>对 CPU 敏感</b>：并发阶段要占用一部分 CPU，核少时用户程序明显变慢。</li></ul>`,
    trap: `<p>预留空间不够时会发生 <b>concurrent mode failure</b>，CMS 退化成单线程的 Serial Old 做 Full GC，停顿反而很长。这是 CMS 线上"突然卡很久"的常见原因。</p>`,
    links: [['CMS 收集器及其问题', '../../08-JVM/gc/10-CMS收集器及其问题.html']] },

  { sec: '垃圾回收', q: 'G1 是怎样通过 Region、回收价值预测和 Mixed GC 控制停顿的？', star: true,
    a: `<ul><li><b>Region 化</b>：把堆切成许多大小相同的 Region（1~32MB，2 的幂）。每个 Region 可以扮演 Eden、Survivor、Old 或 Humongous（大对象）。分代仍然存在，但只是<b>逻辑上</b>的，不再是连续的大块。</li>
<li><b>可预测停顿</b>：用 <code>-XX:MaxGCPauseMillis</code> 设停顿目标（默认 200ms）。G1 记录每个 Region 的<b>回收价值</b>（能回收多少空间、要花多长时间），每次在停顿预算内优先回收价值最高的 Region——"Garbage First" 的名字就这么来的。</li>
<li><b>Mixed GC</b>：并发标记完成后，一次回收全部新生代 + 挑出的一部分老年代 Region，把老年代分多次慢慢清，而不是一次全清。</li></ul>
<p>回收时用<b>复制</b>把存活对象搬到空 Region，所以整体看是标记-整理，<b>不产生碎片</b>。</p>`,
    more: `<p><b>追问：跨 Region 的引用怎么处理？</b>每个 Region 有一个<b>记忆集</b>（Remembered Set），记录"别的 Region 里谁引用了我"，回收某个 Region 时不用扫描整个堆。代价是额外占用内存（通常是堆的 10%~20%）和写屏障的开销，所以 G1 在小堆上不一定比 Parallel 有优势。</p>`,
    trap: `<p>用 G1 时<b>不要</b>用 <code>-Xmn</code> 固定新生代大小，否则 G1 没法通过伸缩新生代来满足停顿目标。停顿目标也别设得过小，否则每次回收太少，垃圾越积越多，最终触发 Full GC。</p>`,
    links: [['G1 收集器', '../../08-JVM/gc/11-G1收集器.html']] },

  { sec: '垃圾回收', q: 'ZGC 怎样降低停顿？低停顿收集器要付出哪些代价？',
    a: `<p>停顿长的根本原因是"<b>移动对象</b>"（整理、复制）通常要暂停用户线程，因为移动后所有引用都要更新。ZGC 的核心是让<b>对象移动也能和用户线程并发</b>：</p>
<ul><li><b>染色指针</b>：在 64 位引用里借几个比特位记录对象的状态（是否被标记、是否已被移动）。</li>
<li><b>读屏障</b>（Load Barrier）：用户线程每次从堆里读引用时插入一小段检查代码。发现对象已经被移走，就当场修正为新地址（"自愈"）。</li></ul>
<p>这样 STW 只剩扫描根等很小的阶段，停顿基本和堆大小无关，通常在 1ms 以内。</p>
<p><b>代价</b>：</p>
<ul><li><b>吞吐量</b>下降：每次读引用都要过屏障，还要并发 GC 线程和用户线程抢 CPU。</li>
<li><b>内存占用</b>更高：并发期间用户线程还在分配，需要更多余量。分配速度太快、GC 跟不上时，用户线程会被阻塞等待（Allocation Stall）。</li></ul>`,
    trap: `<p>"ZGC 不分代"是老说法。JDK 21 引入了分代 ZGC，JDK 23 起成为默认模式。回答时注意说明版本。</p>`,
    links: [['ZGC 与 Shenandoah', '../../08-JVM/gc/12-ZGC与Shenandoah低延迟收集器.html']] },

  // ───────────── JVM 参数与诊断工具 ─────────────
  { sec: 'JVM 参数与诊断工具', q: '-Xms、-Xmx、-Xmn 和 -Xss 分别控制什么？为什么常把 -Xms 和 -Xmx 设为相同值？', star: true,
    a: `<table><tr><th>参数</th><th>含义</th></tr>
<tr><td><code>-Xms</code></td><td>堆的初始大小</td></tr>
<tr><td><code>-Xmx</code></td><td>堆的最大大小</td></tr>
<tr><td><code>-Xmn</code></td><td>新生代大小</td></tr>
<tr><td><code>-Xss</code></td><td>每个线程的栈大小（64 位 Linux 默认 1MB）</td></tr></table>
<p><b>为什么 Xms = Xmx</b>：</p>
<ul><li>避免堆在运行中反复扩容 / 缩容，每次调整都可能伴随 GC 和系统调用。</li>
<li>启动时就把内存要够，问题提前暴露，而不是跑到一半才发现机器内存不足。</li></ul>
<p>元空间参数：<code>-XX:MetaspaceSize</code> 是<b>第一次因元空间触发 GC 的阈值</b>，<code>-XX:MaxMetaspaceSize</code> 是<b>上限</b>（默认不限）。</p>`,
    trap: `<ul><li><code>-XX:MetaspaceSize</code> <b>不是</b>"元空间初始大小"，这是高频误区。</li>
<li>容器里别只设 <code>-Xmx</code> 就把容器内存吃满：还有元空间、线程栈、直接内存、代码缓存要占。更推荐用 <code>-XX:MaxRAMPercentage</code> 按容器内存比例设置堆大小。</li>
<li>G1 下一般不设 <code>-Xmn</code>（见 G1 那题）。</li></ul>`,
    links: [['JVM 常用参数', '../../00-Java基础/jvm/13-JVM常用参数.html'], ['GC 日志分析与常用调优参数', '../../08-JVM/profiling/06-GC日志分析与常用调优参数.html']] },

  { sec: 'JVM 参数与诊断工具', q: '怎样选择垃圾收集器、开启 GC 日志、在 OOM 时自动生成 Heap Dump？',
    a: `<p><b>选收集器</b>：先看 JDK 版本、堆大小和业务对延迟的要求。通用服务 JDK 9+ 默认 G1 就够；批处理追求吞吐用 Parallel（<code>-XX:+UseParallelGC</code>）；大堆且要求极低延迟用 ZGC（<code>-XX:+UseZGC</code>）。切换前先拿到当前的 GC 日志、停顿分布、分配速率作为基线。</p>
<p><b>GC 日志</b>：</p>
<pre><code># JDK 8
-XX:+PrintGCDetails -XX:+PrintGCDateStamps -Xloggc:/path/gc.log
# JDK 9+ 统一日志
-Xlog:gc*:file=/path/gc.log:time,uptime:filecount=10,filesize=50m</code></pre>
<p><b>OOM 时自动 dump</b>：</p>
<pre><code>-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/path/dumps/</code></pre>`,
    trap: `<p>Heap Dump 文件大小接近堆的已用大小，8G 堆可能生成好几 G 的文件。<b>要提前确认磁盘空间</b>，否则 dump 失败或把磁盘写满拖垮其他服务。另外 dump 里可能有用户数据，要注意存放位置和权限。</p>`,
    links: [['GC 日志分析与常用调优参数', '../../08-JVM/profiling/06-GC日志分析与常用调优参数.html']] },

  { sec: 'JVM 参数与诊断工具', q: 'jps、jstat、jinfo、jmap、jstack 和 jcmd 分别适合查什么？', star: true,
    a: `<table><tr><th>工具</th><th>用途</th><th>常用命令</th></tr>
<tr><td><code>jps</code></td><td>列出 Java 进程和 pid</td><td><code>jps -l</code></td></tr>
<tr><td><code>jstat</code></td><td>实时看 GC 统计：各区使用率、GC 次数和耗时</td><td><code>jstat -gcutil pid 1000</code>（每秒一次）</td></tr>
<tr><td><code>jinfo</code></td><td>查看 / 修改运行中进程的 JVM 参数</td><td><code>jinfo -flags pid</code></td></tr>
<tr><td><code>jmap</code></td><td>对象直方图、生成堆转储</td><td><code>jmap -histo:live pid</code>、<code>jmap -dump:live,format=b,file=h.hprof pid</code></td></tr>
<tr><td><code>jstack</code></td><td>线程转储：每个线程的状态和调用栈，能检测死锁</td><td><code>jstack pid</code></td></tr>
<tr><td><code>jcmd</code></td><td>"瑞士军刀"，上面大多数功能都能做，官方推荐</td><td><code>jcmd pid GC.heap_info</code>、<code>Thread.print</code>、<code>JFR.start</code></td></tr></table>
<p>看 <code>jstat -gcutil</code> 的输出：盯住 O（老年代使用率）是否持续上涨、FGC（Full GC 次数）是否快速增加、YGC 频率和 YGCT 平均耗时。</p>`,
    more: `<p>图形化 / 进阶工具：<b>VisualVM、JConsole</b> 看实时监控；<b>JFR</b>（Java Flight Recorder）以很低的开销持续记录运行事件，适合线上长期开启，用 <b>JMC</b> 分析；<b>Arthas</b> 可以在线看方法耗时、反编译、热更新，线上排查非常常用。</p>`,
    trap: `<p><code>jmap -dump</code> 和 <code>-histo:live</code> 会触发 Full GC、<b>暂停整个应用</b>，大堆可能停顿很久。生产环境执行前要评估影响，最好先把实例摘流量。</p>`,
    links: [['jps / jstat / jmap / jstack 速查', '../../08-JVM/profiling/01-jps-jstat-jmap-jstack速查.html'], ['JConsole 与 VisualVM', '../../08-JVM/profiling/02-JConsole与VisualVM.html'], ['Arthas 实战', '../../08-JVM/profiling/03-Arthas实战.html']] },

  { sec: 'JVM 参数与诊断工具', q: 'Heap Dump 和线程转储有什么区别？kill -3 生成的是哪一种？MAT 怎么用？',
    a: `<table><tr><th></th><th>Heap Dump（堆转储）</th><th>Thread Dump（线程转储）</th></tr>
<tr><td>内容</td><td>某一时刻堆里所有对象及其引用关系</td><td>所有线程的状态和调用栈、持有和等待的锁</td></tr>
<tr><td>用来查</td><td>内存泄漏、OOM、谁占了内存</td><td>CPU 飙高、死锁、线程阻塞、响应慢</td></tr>
<tr><td>大小 / 代价</td><td>大（接近堆已用量），生成时停顿明显</td><td>小，开销低，可以连续抓几次</td></tr>
<tr><td>工具</td><td><code>jmap -dump</code>、<code>jcmd GC.heap_dump</code></td><td><code>jstack</code>、<code>jcmd Thread.print</code>、<code>kill -3</code></td></tr></table>
<p><b><code>kill -3 pid</code></b> 生成的是<b>线程转储</b>，输出到进程的标准输出（通常是控制台日志），进程不会退出。</p>
<p><b>MAT 分析 Heap Dump</b>：</p>
<ul><li><b>Dominator Tree（支配树）</b>：按"如果回收这个对象，能连带释放多少内存（Retained Heap）"排序，一眼找出占内存最多的对象。</li>
<li><b>Path to GC Roots</b>：看某个大对象被谁引用着、为什么回收不掉，从而定位是哪段代码持有它。</li></ul>`,
    trap: `<p><code>kill -9</code> 是强杀进程，别和 <code>kill -3</code> 搞混。</p>` },

  // ───────────── JVM 线上问题排查 ─────────────
  { sec: 'JVM 线上问题排查', q: 'CPU 飙高时，怎样从进程定位到线程和具体代码？', star: true,
    a: `<ol><li><code>top</code>：找到 CPU 高的 Java 进程 pid。</li>
<li><code>top -Hp pid</code>：看这个进程里哪些<b>线程</b> CPU 高，记下线程 id（十进制）。</li>
<li><code>printf '%x\\n' tid</code>：转成<b>十六进制</b>，因为 jstack 里线程 id 用十六进制的 <code>nid=0x...</code> 表示。</li>
<li><code>jstack pid | grep -A 30 'nid=0x十六进制id'</code>：看这个线程的调用栈，定位到代码行。</li>
<li><b>隔几秒多抓几次</b>，确认线程持续卡在同一段代码，而不是偶然。</li></ol>
<p>也可以直接用 Arthas：<code>thread -n 3</code> 列出 CPU 最高的 3 个线程及其栈。</p>
<p><b>常见原因</b>：死循环、正则回溯、大量序列化/计算；还有<b>频繁 GC</b>——如果高 CPU 的线程是 GC 线程，问题其实在内存，要转去看 GC。</p>`,
    links: [['CPU 飙高排查思路', '../../08-JVM/profiling/05-CPU飙高排查思路.html'], ['jstack / jmap / jstat', '../../00-Java基础/jvm/16-jstack-jmap-jstat.html']] },

  { sec: 'JVM 线上问题排查', q: 'Java 进程 OOM 或内存持续上涨，怎样判断问题在堆、元空间、直接内存还是本地内存？', star: true,
    a: `<p><b>第一步看 OOM 的提示信息</b>，它直接告诉你是哪块：<code>Java heap space</code> → 堆；<code>Metaspace</code> → 元空间；<code>Direct buffer memory</code> → 直接内存；<code>unable to create native thread</code> → 线程太多。</p>
<p><b>堆的问题</b>：分析 Heap Dump（MAT 看支配树），区分两种情况：</p>
<ul><li><b>内存泄漏</b>：对象用完了却还被引用着，比如只增不删的 static 集合、没 remove 的 ThreadLocal、没关闭的连接。特征是<b>每次 Full GC 后老年代的底线在持续升高</b>。</li>
<li><b>内存溢出</b>：对象确实都要用，只是太多了，比如一次查出百万行数据、缓存没设上限。要么限制数据量，要么加大堆。</li></ul>
<p><b>元空间</b>：看加载的类数量是否一直涨（<code>jstat -class</code>），常见于动态代理、Groovy 脚本反复编译、类加载器泄漏。</p>
<p><b>堆外 / 本地内存</b>：进程 RSS 远大于堆 + 元空间时，开 <code>-XX:NativeMemoryTracking=summary</code> 再用 <code>jcmd pid VM.native_memory</code> 看各部分占用。</p>`,
    trap: `<p>只回答"把 -Xmx 调大"是减分项：泄漏的话调大只是推迟 OOM；直接内存、元空间、线程数的问题和堆大小根本无关。</p>`,
    links: [['常见 OOM 场景排查', '../../08-JVM/memory/11-常见OOM场景排查.html'], ['内存泄漏排查思路', '../../08-JVM/profiling/04-内存泄漏排查思路.html'], ['OOM 排查', '../../00-Java基础/jvm/15-OOM排查.html']] },

  { sec: 'JVM 线上问题排查', q: 'Young GC 很频繁或 Full GC 很频繁时，应该怎样排查？', star: true,
    a: `<p><b>Young GC 频繁但每次很快</b>：说明<b>对象分配速度太快</b>或<b>新生代太小</b>。</p>
<ul><li>查分配热点：哪里在大量创建临时对象（循环里拼字符串、频繁装箱、大对象序列化）。</li>
<li>新生代是否太小（非 G1 下可调大 <code>-Xmn</code>）。</li></ul>
<p><b>Full GC 频繁</b>：用 <code>jstat -gcutil pid 1000</code> 和 GC 日志观察：</p>
<ul><li><b>老年代每次 Full GC 后能降下来</b>：说明对象晋升太快。可能是 Survivor 太小、动态年龄判定导致过早晋升，或者大对象太多。</li>
<li><b>Full GC 后老年代几乎降不下来</b>：大概率是<b>内存泄漏</b>，dump 堆用 MAT 分析。</li>
<li>还要排除：代码显式 <code>System.gc()</code>、元空间满、CMS/G1 并发回收跟不上导致退化。</li></ul>
<p><b>修复后验证</b>：对比 GC 频率、平均和最大停顿、老年代增长斜率、接口 P99 延迟，确认问题真的消失而不是被推迟。</p>`,
    links: [['GC 日志分析与常用调优参数', '../../08-JVM/profiling/06-GC日志分析与常用调优参数.html'], ['内存泄漏排查思路', '../../08-JVM/profiling/04-内存泄漏排查思路.html']] },

  { sec: 'JVM 线上问题排查', q: '接口很慢但 CPU 使用率正常（或 CPU 不高但 Load 很高），怎样排查？',
    a: `<p>CPU 不高说明线程大多不在"算"，而是在<b>等</b>。关键工具是<b>线程转储</b>，看线程都卡在哪、是什么状态：</p>
<ul><li>大量 <b>BLOCKED</b>：在抢 synchronized 锁，看它们等的是哪个锁、被谁持有；jstack 会直接报告死锁。</li>
<li>大量 <b>WAITING / TIMED_WAITING</b> 在 <code>getConnection</code> 之类的方法上：<b>连接池耗尽</b>（数据库、HTTP、Redis）。</li>
<li>大量 <b>RUNNABLE</b> 但栈停在 socket read：在等<b>下游</b>响应，去查下游或慢 SQL。</li>
<li>线程池队列堆积：业务线程都在等，任务排队，响应时间被拉长——看线程池的活跃线程数和队列长度监控。</li></ul>
<p><b>Load 高 CPU 不高</b>：Linux 的 Load 统计的不只是在跑的进程，还包括在等磁盘 I/O 的进程（D 状态）。用 <code>vmstat</code>、<code>iostat</code> 看 I/O 等待（wa）是否高，比如大量写日志、磁盘满、swap。</p>`,
    trap: `<p>面试中讲没亲身经历过的排查题时，可以按"先保留证据（时间点、指标、线程栈）→ 缩小范围 → 定位 → 修复 → 验证指标"的框架讲自己会怎么做，但<b>不要把学习案例说成亲历的生产事故</b>，追问几句就露馅。</p>`,
    links: [['死锁', '../../02-并发/advanced/09-死锁.html'], ['Arthas 实战', '../../08-JVM/profiling/03-Arthas实战.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
