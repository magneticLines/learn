const PAGE_KEY = 'interview:java:08';
const QA = [
  // ───────────── ThreadLocal ─────────────
  { sec: 'ThreadLocal', q: 'ThreadLocal 有什么用？',
    a: `<p>一句话：<b>让每个线程拥有一份自己专属的变量副本</b>，线程之间互不干扰，从而不用加锁也不会有线程安全问题。</p>
<p>类比：多个人去收集东西，共用一个袋子就得抢（加锁）；每人发一个袋子（ThreadLocal），就没有竞争了。</p>
<pre><code>private static final ThreadLocal&lt;SimpleDateFormat&gt; FMT =
    ThreadLocal.withInitial(() -&gt; new SimpleDateFormat("yyyy-MM-dd"));
FMT.get().format(new Date());  // 每个线程拿到的是自己那个实例</code></pre>
<p><b>典型场景</b>：保存请求级上下文（当前登录用户、traceId）、让非线程安全的对象（如 <code>SimpleDateFormat</code>）每线程一份、Spring 事务里把数据库连接绑定到当前线程。</p>`,
    more: `<p>这种思路叫<b>线程封闭</b>：数据只让一个线程访问，就天然线程安全。它和加锁是两条路：加锁是"大家共享，但排队用"；ThreadLocal 是"干脆不共享"，用空间换时间。</p>`,
    links: [['线程封闭', '../../02-并发/basics/08-线程封闭.html']] },

  { sec: 'ThreadLocal', q: 'ThreadLocal 的原理是什么？', star: true,
    a: `<p>关键点：<b>值不是存在 ThreadLocal 对象里，而是存在每个 Thread 对象里。</b></p>
<ol><li><code>Thread</code> 类有个字段 <code>threadLocals</code>，类型是 <code>ThreadLocal.ThreadLocalMap</code>（一个定制的哈希表）。</li>
<li>调用 <code>tl.set(v)</code> 时：先拿到当前线程，再拿到它的 ThreadLocalMap，以<b>这个 ThreadLocal 对象为 key</b>、v 为 value 存进去。</li>
<li>调用 <code>tl.get()</code> 时：同样到当前线程的 map 里，用自己当 key 去查。</li></ol>
<p>所以 ThreadLocal 本身只是一把"钥匙"，真正的"柜子"在每个线程身上。一个线程可以有多个 ThreadLocal，它们都存在这个线程的同一个 map 里。</p>`,
    more: `<p><b>追问：ThreadLocalMap 怎么解决哈希冲突？</b>它不是 HashMap 那种"数组 + 链表"，而是用<b>开放地址法（线性探测）</b>：算出的下标被占了就往后找下一个空位。每个 ThreadLocal 的哈希值用一个固定增量 <code>0x61c88647</code>（斐波那契散列）递增生成，能让下标分布得比较均匀。</p>
<p>Map 里的元素是 <code>Entry extends WeakReference&lt;ThreadLocal&lt;?&gt;&gt;</code>：key 是弱引用，value 是普通强引用——这正是下一题内存泄漏的根源。</p>` },

  { sec: 'ThreadLocal', q: 'ThreadLocal 内存泄露问题是怎么导致的？key 为什么设计成弱引用？', star: true,
    a: `<p><b>原因</b>：Entry 的 <b>key 是弱引用，value 是强引用</b>。</p>
<ul><li><b>弱引用</b>：只被弱引用指向的对象，下次 GC 就会被回收。</li>
<li>当外部不再持有 ThreadLocal 对象（强引用断了），GC 后 key 变成 <code>null</code>，但 value 还被 Entry 强引用着，回收不掉。</li>
<li>如果线程一直活着（<b>线程池里的线程</b>就是这样），引用链 <code>Thread → ThreadLocalMap → Entry → value</code> 一直在，value 就泄漏了。</li></ul>
<p><b>解决</b>：用完一定 <code>remove()</code>，并放在 <code>finally</code> 里：</p>
<pre><code>try { CTX.set(user); doBusiness(); }
finally { CTX.remove(); }  // 异常时也能清理</code></pre>
<p><b>为什么 key 用弱引用</b>：如果 key 是强引用，忘了 remove 时 ThreadLocal 对象和 value <b>都</b>回收不了。用弱引用后至少 key 能被回收，ThreadLocalMap 在 <code>get/set/remove</code> 时会顺手清理 key 为 null 的过期条目，相当于多了一道兜底。</p>`,
    more: `<p><b>线程池让问题更严重</b>：除了内存泄漏，还会有<b>脏数据</b>——上一个任务留下的值没清，下一个复用这个线程的任务读到了，比如用户 A 的请求读到用户 B 的身份信息（"串号"事故）。阿里规约把"必须回收自定义 ThreadLocal 变量、用 try-finally 回收"列为<b>强制</b>。</p>
<p>ThreadLocal 一般声明成 <code>static final</code>：避免每次调用都新建实例，旧实例失去引用后留下一堆过期条目。</p>`,
    trap: `<ul><li>"弱引用导致了内存泄漏"是<b>误解</b>。泄漏的根本原因是 value 强引用 + 线程长期存活；弱引用反而是在<b>降低</b>泄漏风险。</li>
<li>自清理是<b>被动</b>的，只在调用 get/set/remove 时顺带发生，不保证及时，不能指望它代替 <code>remove()</code>。</li></ul>`,
    links: [['四种引用类型', '../../08-JVM/gc/02-四种引用类型.html']] },

  { sec: 'ThreadLocal', q: '如何跨线程传递 ThreadLocal 的值？', star: true,
    a: `<p>先说为什么会"丢"：值存在<b>线程自己</b>的 map 里，异步任务换了一个线程执行，自然读不到原线程的值。</p>
<table><tr><th>方案</th><th>原理</th><th>局限</th></tr>
<tr><td><code>InheritableThreadLocal</code>（JDK 自带）</td><td><b>创建子线程时</b>，把父线程的 inheritableThreadLocals 拷贝一份给子线程</td><td>只在 new Thread 那一刻复制；线程池里的线程是复用的、早就建好了，所以<b>线程池场景失效</b></td></tr>
<tr><td><code>TransmittableThreadLocal</code>（阿里 TTL）</td><td>在<b>提交任务时</b>抓取当前线程的上下文，任务执行前在工作线程里回放，执行完再恢复原状</td><td>要用 TTL 包装线程池 / 任务，或者挂 Java Agent</td></tr></table>
<p>日志链路追踪（traceId 跨线程池传递）是 TTL 的典型用法。</p>`,
    more: `<p>InheritableThreadLocal 的复制发生在 <code>Thread</code> 的构造过程里：如果父线程的 <code>inheritableThreadLocals</code> 不为空，就创建一个新 map 把它复制过去。复制是<b>浅拷贝</b>，父子线程拿到的是同一个 value 对象引用；想要独立副本可以重写 <code>childValue()</code>。</p>`,
    trap: `<p>即使用了 TTL，也要记得用完清理；而且 TTL 必须配合包装后的 Executor（<code>TtlExecutors</code>）或 Agent 才生效，直接用普通线程池是传不过去的。</p>` },

  // ───────────── 线程池 ─────────────
  { sec: '线程池', q: '什么是线程池？',
    a: `<p>线程池就是<b>预先准备好、可以反复使用的一组线程</b>。任务来了从池里取一个线程执行，执行完线程不销毁，回到池子里等下一个任务。</p>
<p>Java 里的核心实现是 <code>ThreadPoolExecutor</code>，它把"任务提交"和"任务怎么执行"解耦：你只管 <code>execute(task)</code>，用哪个线程、要不要排队由线程池决定。</p>`,
    links: [['Executor 框架', '../../02-并发/exec/01-Executor框架.html'], ['ThreadPoolExecutor', '../../02-并发/exec/04-ThreadPoolExecutor.html']] },

  { sec: '线程池', q: '为什么要用线程池？', star: true,
    a: `<p>池化思想（和数据库连接池一样）：减少每次获取资源的开销，提高资源利用率。具体 3 点：</p>
<ol><li><b>降低资源消耗</b>：线程复用，避免频繁创建和销毁。Java 线程对应一个操作系统线程，创建要分配栈内存、做系统调用，代价不小。</li>
<li><b>提高响应速度</b>：任务来了直接交给已存在的线程，省掉创建线程的时间。</li>
<li><b>提高可管理性</b>：统一控制线程总数、排队方式和拒绝策略，防止无限制创建线程把内存和 CPU 耗尽；还能监控活跃线程数、队列长度。</li></ol>` },

  { sec: '线程池', q: '如何创建线程池？',
    a: `<p>两种方式：</p>
<ol><li><b>直接 new <code>ThreadPoolExecutor</code>（推荐）</b>：显式指定核心线程数、最大线程数、队列、拒绝策略等，运行规则一目了然。</li>
<li><b>用 <code>Executors</code> 工具类（生产不推荐）</b>：<code>newFixedThreadPool</code>（固定线程数）、<code>newSingleThreadExecutor</code>（单线程）、<code>newCachedThreadPool</code>（按需扩张）、<code>newScheduledThreadPool</code>（定时/周期任务）。</li></ol>
<pre><code>ThreadPoolExecutor pool = new ThreadPoolExecutor(
    4, 8, 60, TimeUnit.SECONDS,
    new ArrayBlockingQueue&lt;&gt;(1000),          // 有界队列
    new NamingThreadFactory("order-pool"),     // 起个业务名
    new ThreadPoolExecutor.CallerRunsPolicy());</code></pre>
<p>Spring 项目里也常用 <code>ThreadPoolTaskExecutor</code>，它底层包装的就是 ThreadPoolExecutor。</p>` },

  { sec: '线程池', q: '为什么不推荐使用 Executors 创建的内置线程池？', star: true,
    a: `<p>因为它们都藏着一个"<b>无界</b>"，压力大时会 OOM。阿里规约把"不允许用 Executors 创建线程池"列为强制。</p>
<table><tr><th>方法</th><th>问题</th></tr>
<tr><td><code>newFixedThreadPool</code> / <code>newSingleThreadExecutor</code></td><td>队列是 <code>LinkedBlockingQueue</code>，默认容量 <code>Integer.MAX_VALUE</code>，任务无限堆积 → OOM</td></tr>
<tr><td><code>newCachedThreadPool</code></td><td>最大线程数 <code>Integer.MAX_VALUE</code> + <code>SynchronousQueue</code>，任务多又慢时无限建线程 → OOM / CPU 打满</td></tr>
<tr><td><code>newScheduledThreadPool</code></td><td><code>DelayedWorkQueue</code> 无界，任务无限堆积 → OOM</td></tr></table>
<p>自己 new ThreadPoolExecutor，就被迫把队列容量、最大线程数、拒绝策略想清楚。</p>`,
    trap: `<p>"OOM 的原因"要说对：Fixed 是<b>队列</b>撑爆，Cached 是<b>线程数</b>失控。线程多了除了占内存，还可能直接报 <code>unable to create native thread</code>——这是本地内存或系统线程数上限耗尽，不是堆满。</p>`,
    links: [['为什么不用 Executors', '../../02-并发/exec/06-为什么不用Executors.html']] },

  { sec: '线程池', q: '线程池有哪些常见参数？分别是什么含义？', star: true,
    a: `<p>构造函数 7 个参数，前 3 个最重要：</p>
<ul><li><b><code>corePoolSize</code></b> 核心线程数：常驻的线程数，空闲也默认保留。</li>
<li><b><code>maximumPoolSize</code></b> 最大线程数：线程总数上限。</li>
<li><b><code>workQueue</code></b> 任务队列：线程数达到核心数后，新任务先进这里排队。</li>
<li><code>keepAliveTime</code> + <code>unit</code>：线程数超过核心数时，多出来的<b>非核心线程</b>空闲超过这个时间就被回收。</li>
<li><code>threadFactory</code>：创建线程的工厂，通常用来给线程起名字。</li>
<li><code>handler</code>：拒绝策略，线程和队列都满了时怎么处理新任务。</li></ul>
<p>类比银行：核心线程是正式柜员，队列是等候区座位，最大线程数是正式柜员加临时柜员的总数，等候区坐满才叫临时柜员；临时柜员闲太久就下班（keepAliveTime），连临时柜员都满了就拒客（handler）。</p>`,
    trap: `<p>构造时会做参数校验：<code>corePoolSize &lt; 0</code>、<code>maximumPoolSize &lt;= 0</code>、<code>maximumPoolSize &lt; corePoolSize</code>、<code>keepAliveTime &lt; 0</code> 都会抛 <code>IllegalArgumentException</code>。</p>`,
    links: [['ThreadPoolExecutor', '../../02-并发/exec/04-ThreadPoolExecutor.html']] },

  { sec: '线程池', q: '线程池的核心线程会被回收吗？',
    a: `<p><b>默认不会</b>，即使空闲也一直保留，因为核心线程本来就是为了长期复用、省掉创建开销。</p>
<p>如果线程池只是周期性地用、中间有很长空闲，可以调用 <code>allowCoreThreadTimeOut(true)</code>，核心线程空闲超过 <code>keepAliveTime</code> 也会被回收。</p>`,
    trap: `<p>开启 <code>allowCoreThreadTimeOut(true)</code> 时 <code>keepAliveTime</code> 必须大于 0，否则抛 <code>IllegalArgumentException</code>。</p>` },

  { sec: '线程池', q: '核心线程空闲时处于什么状态？',
    a: `<p>空闲的线程都阻塞在"<b>从队列取任务</b>"这一步上，取法由 <code>getTask()</code> 里的 <code>timed</code> 决定：</p>
<pre><code>boolean timed = allowCoreThreadTimeOut || wc &gt; corePoolSize;
Runnable r = timed
    ? workQueue.poll(keepAliveTime, TimeUnit.NANOSECONDS) // 限时等
    : workQueue.take();                                  // 一直等</code></pre>
<ul><li><b>没开核心线程超时</b>：用 <code>take()</code>，线程一直处于 <b>WAITING</b>，永远留在池里。</li>
<li><b>开了超时（或当前是超出核心数的线程）</b>：用 <code>poll(timeout)</code>，线程处于 <b>TIMED_WAITING</b>；超时拿不到任务，<code>getTask()</code> 返回 null，线程退出，最终变成 TERMINATED。</li></ul>
<p>队列里来了任务，被阻塞的线程会被唤醒，回到 RUNNABLE 去执行。</p>`,
    more: `<p>这里能看出一个设计细节：线程池并不区分"哪个线程是核心线程"。线程只是 <code>Worker</code>，谁在 <code>wc &gt; corePoolSize</code> 时恰好超时，谁就退出。所谓"核心线程"只是一个数量概念。</p>`,
    trap: `<p>有些资料笼统说"都是 WAITING"。严格说用 <code>poll(timeout)</code> 限时等待时，jstack 里看到的是 <b>TIMED_WAITING (parking)</b>，因为底层是 <code>LockSupport.parkNanos</code>。</p>` },

  { sec: '线程池', q: '线程池的拒绝策略有哪些？', star: true,
    a: `<p>线程数已到最大、队列也满了时触发，JDK 自带 4 种：</p>
<table><tr><th>策略</th><th>行为</th></tr>
<tr><td><code>AbortPolicy</code>（<b>默认</b>）</td><td>抛 <code>RejectedExecutionException</code></td></tr>
<tr><td><code>CallerRunsPolicy</code></td><td>让<b>提交任务的那个线程</b>自己执行这个任务；线程池已关闭则丢弃</td></tr>
<tr><td><code>DiscardPolicy</code></td><td>静默丢弃新任务，不报错</td></tr>
<tr><td><code>DiscardOldestPolicy</code></td><td>丢弃队列里最老的任务，再尝试提交新任务</td></tr></table>
<p>不指定时，<code>ThreadPoolExecutor</code> 和 Spring 的 <code>ThreadPoolTaskExecutor</code> 默认都是 AbortPolicy。也可以实现 <code>RejectedExecutionHandler</code> 自定义，比如记日志 + 落库。</p>`,
    trap: `<p>Discard 类策略"悄悄丢任务"，出了问题很难发现，用的话至少要加日志或监控告警。</p>`,
    links: [['拒绝策略', '../../02-并发/exec/05-拒绝策略.html']] },

  { sec: '线程池', q: '如果希望线程池饱和时尽量不丢弃任务，应该选择哪个拒绝策略？',
    a: `<p>选 <b><code>CallerRunsPolicy</code></b>：只要线程池没关闭，被拒绝的任务就交给调用 <code>execute()</code> 的线程同步执行。</p>
<pre><code>public void rejectedExecution(Runnable r, ThreadPoolExecutor e) {
    if (!e.isShutdown()) r.run();   // 调用者线程直接跑
}</code></pre>
<p>它还自带<b>反压</b>效果：提交者忙着执行任务，就没空继续提交，上游自然被放慢。</p>`,
    trap: `<p>它<b>不是</b>"绝对不丢"：线程池关闭后任务照样丢；进程挂了，内存里的任务也全没了。真要强保证，要把任务持久化（数据库、消息队列）。</p>` },

  { sec: '线程池', q: 'CallerRunsPolicy 拒绝策略有什么风险？如何解决？',
    a: `<p><b>风险</b>：被拒绝的任务如果很耗时，而提交任务的是主线程或 Tomcat 请求线程，这个线程就会被卡住，后面的任务都提交不了、请求也处理不了，严重时整个服务响应变慢。</p>
<p><b>解决思路</b>，由浅到深：</p>
<ol><li>内存允许时，适当<b>加大队列容量</b>和<b>最大线程数</b>，减少走到拒绝策略的概率。</li>
<li>资源到顶时换思路——<b>任务持久化</b>：自定义拒绝策略把任务写入 MySQL / Redis / 消息队列；再自定义一个阻塞队列，<code>take()</code> 时优先取持久化的任务，空了再取内存队列。</li>
<li>参考框架做法：Netty 在拒绝时新建一个池外的临时线程执行；ActiveMQ 在拒绝时限时阻塞重试入队（<code>offer(r, 60, SECONDS)</code>），超时才真正拒绝。</li></ol>`,
    trap: `<p>Netty 那种"拒绝就新开线程"的做法，本质上绕开了线程数上限，线程无法被监控，量大时同样会把系统拖垮，不能照搬。</p>` },

  { sec: '线程池', q: '线程池常用的阻塞队列有哪些？',
    a: `<table><tr><th>队列</th><th>特点</th><th>谁在用</th></tr>
<tr><td><code>LinkedBlockingQueue</code></td><td>链表，默认容量 <code>Integer.MAX_VALUE</code>，可看作无界</td><td>Fixed、SingleThread</td></tr>
<tr><td><code>SynchronousQueue</code></td><td><b>没有容量</b>，每个放入都要等一个取出；有空闲线程就交给它，没有就新建线程</td><td>Cached</td></tr>
<tr><td><code>DelayedWorkQueue</code></td><td>按到期时间排序的<b>堆</b>，会自动扩容，永远放不满</td><td>Scheduled</td></tr>
<tr><td><code>ArrayBlockingQueue</code></td><td>数组，<b>有界</b>，容量创建后不能改</td><td>自定义线程池常用</td></tr>
<tr><td><code>PriorityBlockingQueue</code></td><td>按优先级出队，无界</td><td>优先级线程池</td></tr></table>`,
    more: `<p><b>追问：为什么 ScheduledThreadPool 的最大线程数没意义？</b>因为只有"队列满了"才会创建超过核心数的线程，而 DelayedWorkQueue 永远不会满，所以线程数永远不会超过 corePoolSize。</p>`,
    links: [['BlockingQueue', '../../02-并发/blocks/04-BlockingQueue.html']] },

  { sec: '线程池', q: '线程池处理任务的流程是怎样的？', star: true,
    a: `<p>这就是 <code>ThreadPoolExecutor.execute()</code> 的逻辑，按顺序判断：</p>
<ol><li>当前线程数 <b>&lt; corePoolSize</b> → 新建一个核心线程执行任务（哪怕别的线程在空闲）。</li>
<li>否则尝试<b>放入队列</b>，成功就排队等。</li>
<li>队列满了，且线程数 <b>&lt; maximumPoolSize</b> → 新建非核心线程执行这个任务。</li>
<li>线程数也到最大了 → 执行<b>拒绝策略</b>。</li></ol>
<p>口诀：<b>核心 → 队列 → 最大 → 拒绝</b>。</p>`,
    more: `<p><b>源码细节</b>：线程池用一个 <code>AtomicInteger ctl</code> 同时存两样东西——高 3 位是运行状态（RUNNING、SHUTDOWN 等），低 29 位是线程数，这样一次 CAS 就能同时判断状态和数量。任务入队后还会再检查一次状态，如果此时线程池已关闭就把任务移除并拒绝；如果线程数为 0，就补一个线程，防止任务在队列里没人处理。</p>
<p><b>追问：能提前创建线程吗？</b>可以，<code>prestartCoreThread()</code> 启动一个核心线程，<code>prestartAllCoreThreads()</code> 启动全部，用来预热。</p>`,
    trap: `<p>最常见的误解是"先把线程开到最大，再排队"。实际是<b>先排队，队列满了才扩到最大线程数</b>。所以如果用无界队列，<code>maximumPoolSize</code> 就形同虚设。Tomcat 的线程池为了"先扩线程再排队"专门改写了这套逻辑。</p>`,
    links: [['ThreadPoolExecutor', '../../02-并发/exec/04-ThreadPoolExecutor.html']] },

  { sec: '线程池', q: '线程池中的线程执行任务抛异常后，是销毁还是复用？', star: true,
    a: `<p>看提交方式：</p>
<ul><li><b><code>execute()</code></b>：异常没被任务自己捕获，会一直抛出 <code>runWorker</code>，这个工作线程<b>终止</b>，异常打印出来；线程池发现少了一个线程，会<b>新建一个替补</b>。</li>
<li><b><code>submit()</code></b>：任务被包装成 <code>FutureTask</code>，异常被它捕获并存起来，线程<b>不会终止、继续复用</b>。异常只有在调用 <code>Future.get()</code> 时才以 <code>ExecutionException</code> 的形式抛出。</li></ul>`,
    trap: `<p><b>submit 吞异常</b>是个大坑：提交后如果从不调用 <code>get()</code>，异常就无声无息消失了，日志里什么都没有。所以要么在任务里自己 try-catch 记日志，要么重写 <code>afterExecute</code> 统一处理。</p>
<p>另外 execute 方式下频繁抛异常会导致线程反复销毁重建，失去了线程池复用的意义。</p>` },

  { sec: '线程池', q: '如何给线程池命名？为什么要命名？', star: true,
    a: `<p><b>为什么</b>：默认线程名是 <code>pool-1-thread-3</code> 这样，没有业务含义。线上看日志或 jstack 时，有名字才能一眼看出是哪个业务的线程池出了问题。</p>
<p><b>怎么做</b>：通过 <code>ThreadFactory</code> 设置名字前缀。</p>
<ul><li>用 Guava：<code>new ThreadFactoryBuilder().setNameFormat("order-pool-%d").build()</code></li>
<li>自己实现：</li></ul>
<pre><code>public Thread newThread(Runnable r) {
    Thread t = new Thread(r);
    // 用原子计数器编号，因为多个线程可能并发调用工厂
    t.setName(prefix + "-" + counter.incrementAndGet());
    return t;
}</code></pre>
<p>Spring 的 <code>ThreadPoolTaskExecutor</code> 直接 <code>setThreadNamePrefix("order-")</code> 即可。</p>` },

  { sec: '线程池', q: '如何设定线程池的大小？',
    a: `<p>太小：任务排长队甚至被拒绝，CPU 没吃满；太大：线程争抢 CPU，大量<b>上下文切换</b>（CPU 保存一个线程的执行现场、再加载另一个线程的现场），反而变慢。</p>
<p>经验公式（N = CPU 核数）：</p>
<ul><li><b>CPU 密集型</b>（大量计算，如排序、加解密）：<b>N + 1</b>。多 1 个是为了在某个线程偶尔因缺页中断等原因暂停时，CPU 不闲着。</li>
<li><b>I/O 密集型</b>（网络请求、读写文件、查数据库）：<b>2N</b>。线程等 I/O 时不占 CPU，可以多开。</li></ul>
<p>更严谨的公式：<b>线程数 = N × (1 + WT / ST)</b>，WT 是线程等待时间，ST 是计算时间。等待占比越高，需要的线程越多。</p>`,
    more: `<p>公式只是起点。真实做法是压测 + 线上监控（队列长度、活跃线程数、任务耗时），再配合动态调参逐步调整。CPU 核数用 <code>Runtime.getRuntime().availableProcessors()</code> 获取，容器环境下较新的 JDK 能识别 cgroup 的 CPU 限制。</p>` },

  { sec: '线程池', q: '如何动态修改线程池的参数？', star: true,
    a: `<p>思路来自美团的动态线程池实践：把最关键的三个参数 <b>corePoolSize、maximumPoolSize、workQueue</b> 做成可以在配置中心修改，改完实时生效。</p>
<ul><li><code>ThreadPoolExecutor</code> 本身就提供了 <code>setCorePoolSize()</code>、<code>setMaximumPoolSize()</code>、<code>setKeepAliveTime()</code>、<code>setRejectedExecutionHandler()</code> 等 setter，可以运行时调用。</li>
<li><b>队列容量没有 setter</b>：<code>LinkedBlockingQueue</code> 的 capacity 是 final 的。美团的做法是自定义一个 <code>ResizableCapacityLinkedBlockingQueue</code>，把 capacity 改成可变。</li></ul>
<p>现成的开源方案：<b>Hippo4j</b>、<b>Dynamic TP</b>，支持动态调参 + 监控告警，对接 Nacos、Apollo 等配置中心。</p>`,
    more: `<p><code>setCorePoolSize</code> 调小时，多出来的线程会在下次空闲时退出；调大时，如果队列里有积压任务，会立刻按需启动新线程。</p>`,
    trap: `<p>调参顺序有坑：<code>setCorePoolSize</code> 设成比当前 maximumPoolSize 还大，或把 maximumPoolSize 调得比 corePoolSize 小，会抛 <code>IllegalArgumentException</code>（较新 JDK 都有这个校验）。扩容时先调 max 再调 core，缩容时反过来。</p>` },

  { sec: '线程池', q: '如何设计一个能按任务优先级执行的线程池？', star: true,
    a: `<p>核心：把任务队列换成 <b><code>PriorityBlockingQueue</code></b>（线程安全的优先级阻塞队列，底层是小顶堆，值最小的先出队）。</p>
<p>任务要能比较大小，二选一：任务实现 <code>Comparable</code>；或者创建队列时传入 <code>Comparator</code>（推荐，不侵入任务类）。</p>
<p><b>要主动说出的问题和对策</b>：</p>
<ul><li><b>无界 → OOM</b>：继承它重写 <code>offer()</code>，超过指定数量返回 false，让线程池走拒绝策略。</li>
<li><b>饥饿</b>：低优先级任务可能一直轮不到。可以让等待过久的任务提升优先级后重新入队。</li>
<li><b>性能</b>：入队出队要维护堆、要加锁（内部用 <code>ReentrantLock</code>），有损耗，但多数业务可以接受。</li></ul>`,
    trap: `<p>用 <code>submit()</code> 提交时，任务会先被包装成 <code>FutureTask</code>，而 FutureTask 没实现 Comparable，放进 PriorityBlockingQueue 会抛 <code>ClassCastException</code>。要么用 <code>execute()</code> 提交，要么重写 <code>newTaskFor</code> 返回可比较的包装类。</p>` },

  // ───────────── Future ─────────────
  { sec: 'Future', q: 'Future 接口有什么用？',
    a: `<p>Future 代表"<b>一个将来才会有的结果</b>"。把耗时任务交给别的线程异步执行，自己先去做别的事，需要结果时再通过 Future 去取。</p>
<p>它提供 4 类能力：</p>
<ul><li>取消任务：<code>cancel(boolean mayInterruptIfRunning)</code></li>
<li>是否已取消：<code>isCancelled()</code></li>
<li>是否已完成：<code>isDone()</code></li>
<li>获取结果：<code>get()</code>（阻塞等）/ <code>get(timeout, unit)</code>（超时抛 <code>TimeoutException</code>）</li></ul>
<p>JDK 19 起又加了 <code>resultNow()</code>、<code>exceptionNow()</code>、<code>state()</code> 几个默认方法。</p>`,
    trap: `<p>Future 最大的缺点是<b>拿结果只能阻塞 get() 或轮询 isDone()</b>，没法"完成后自动回调"，多个任务之间也不好编排。这正是 CompletableFuture 要解决的问题。</p>`,
    links: [['Callable 与 Future', '../../02-并发/exec/02-Callable-Future.html']] },

  { sec: 'Future', q: 'Callable 和 Future 有什么关系？',
    a: `<ul><li><b><code>Callable</code></b>：描述"要做的任务"，和 Runnable 的区别是它<b>有返回值、能抛受检异常</b>。</li>
<li><b><code>Future</code></b>：描述"任务的结果"，用来取结果、查状态、取消。</li></ul>
<p>把两者粘在一起的是 <b><code>FutureTask</code></b>：它同时实现了 <code>Runnable</code> 和 <code>Future</code>（通过 <code>RunnableFuture</code> 接口），内部持有一个 Callable。线程执行它的 <code>run()</code> 时调用 <code>callable.call()</code>，把结果或异常存起来，<code>get()</code> 再从里面取。</p>
<p><code>ExecutorService.submit(callable)</code> 返回的其实就是一个 FutureTask。传入 Runnable 也会被适配成 Callable（返回 null 或指定的 result）。</p>`,
    links: [['Callable 与 Future', '../../02-并发/exec/02-Callable-Future.html']] },

  { sec: 'Future', q: 'CompletableFuture 类有什么用？',
    a: `<p>JDK 8 引入，弥补 Future 的不足：<b>支持回调、任务编排和异常处理</b>，不用再阻塞 get。</p>
<p>它实现了 <code>Future</code> 和 <code>CompletionStage</code> 两个接口，后者提供了一大堆可以链式调用的方法：</p>
<ul><li>创建：<code>supplyAsync</code>（有返回值）、<code>runAsync</code>（无返回值）</li>
<li>串行：<code>thenApply</code>（转换结果）、<code>thenAccept</code>（消费结果）、<code>thenCompose</code>（结果再发起一个异步任务）</li>
<li>组合：<code>thenCombine</code>（两个都完成后合并）、<code>allOf</code>（全部完成）、<code>anyOf</code>（任一完成）</li>
<li>异常：<code>exceptionally</code>、<code>handle</code>、<code>whenComplete</code></li></ul>
<pre><code>CompletableFuture.supplyAsync(() -&gt; queryUser(id), pool)
    .thenApply(User::getName)
    .thenAccept(System.out::println);</code></pre>`,
    trap: `<p>带 <code>Async</code> 后缀的方法（如 <code>thenApplyAsync</code>）会把回调提交到线程池执行；不带的，回调可能由完成上一步的线程执行，也可能由调用线程直接执行。</p>`,
    links: [['CompletableFuture', '../../02-并发/exec/03-CompletableFuture.html']] },

  { sec: 'Future', q: '一个任务需要依赖另外两个任务执行完之后再执行，怎么设计？', star: true,
    a: `<p>用 <code>CompletableFuture.allOf</code> 组合 T1、T2，完成后再执行 T3：</p>
<pre><code>CompletableFuture&lt;Void&gt; t1 = CompletableFuture.runAsync(() -&gt; task1(), pool);
CompletableFuture&lt;Void&gt; t2 = CompletableFuture.runAsync(() -&gt; task2(), pool);
CompletableFuture.allOf(t1, t2)
    .thenRunAsync(() -&gt; task3(), pool);</code></pre>
<p>如果 T3 需要用到 T1、T2 的结果，用 <code>t1.thenCombine(t2, (r1, r2) -&gt; ...)</code> 更直接。</p>
<p>不用 CompletableFuture 的话，也可以用 <code>CountDownLatch(2)</code>：T1、T2 完成时各 <code>countDown()</code>，T3 先 <code>await()</code>。</p>`,
    trap: `<p>T1、T2 之所以并行，是因为它们各自用 <code>runAsync</code> 提交了；<code>allOf</code> 只是"等它们都完成"，本身不负责并行。另外 allOf 返回的是 <code>CompletableFuture&lt;Void&gt;</code>，拿不到各任务结果，要再分别 <code>join()</code>。</p>` },

  { sec: 'Future', q: '使用 CompletableFuture 时，有一个任务失败了，如何处理异常？', star: true,
    a: `<p>三个方法按用途区分：</p>
<table><tr><th>方法</th><th>何时执行</th><th>能否改变结果</th></tr>
<tr><td><code>whenComplete</code></td><td>正常 / 异常都执行</td><td>不改变，原结果或原异常继续往下传；适合记日志</td></tr>
<tr><td><code>exceptionally</code></td><td>只在异常时执行</td><td>用返回值把异常"恢复"成正常结果（兜底默认值）</td></tr>
<tr><td><code>handle</code></td><td>正常 / 异常都执行</td><td>根据结果和异常生成一个新结果</td></tr></table>
<p><code>allOf</code> 组合时，只要有一个任务异常，整体就异常完成；但想知道具体哪个失败、各自结果是什么，还得逐个检查。</p>`,
    trap: `<ul><li>异常在回调里拿到时通常被包成了 <code>CompletionException</code>，真正的原因要看 <code>getCause()</code>。</li>
<li>链路里一个异常处理都不加，异常就只存在 future 里，没人 join/get 就悄悄丢了。</li></ul>` },

  { sec: 'Future', q: '使用 CompletableFuture 时为什么要自定义线程池？', star: true,
    a: `<p>不传 Executor 时，异步方法默认用全局共享的 <b><code>ForkJoinPool.commonPool()</code></b>。它的线程数默认是 CPU 核数 − 1，整个 JVM 共用（并行流 <code>parallelStream</code> 也用它）。</p>
<p>问题：业务里的异步任务大多是 I/O（调接口、查库），几个慢任务就能把这点线程占满，其他所有用 commonPool 的地方一起被拖慢，甚至"饿死"。</p>
<p>自定义线程池的好处：</p>
<ul><li><b>隔离</b>：不同业务互不影响，一个业务慢了不会连累别人。</li>
<li><b>可控</b>：按任务特性设线程数、队列、拒绝策略。</li>
<li><b>可排查</b>：通过 ThreadFactory 命名线程、统一处理异常。</li></ul>
<pre><code>CompletableFuture.supplyAsync(() -&gt; callRemote(), bizPool);</code></pre>`,
    more: `<p>commonPool 本来是为 Fork/Join 这种<b>CPU 密集、会拆分子任务</b>的场景设计的，线程少、靠工作窃取提高利用率；拿它跑阻塞 I/O 是用错了地方。</p>`,
    links: [['ForkJoinPool 与工作窃取', '../../02-并发/modern/01-ForkJoinPool与工作窃取算法.html']] },

  // ───────────── AQS ─────────────
  { sec: 'AQS', q: 'AQS 是什么？',
    a: `<p>AQS 全称 <code>AbstractQueuedSynchronizer</code>（抽象队列同步器），JDK 1.5 引入，在 <code>java.util.concurrent.locks</code> 包下。</p>
<p>它是一个<b>构建锁和同步器的框架</b>：把"线程抢不到资源时怎么排队、怎么阻塞、怎么唤醒"这套通用又复杂的逻辑都写好了，具体"资源怎么算抢到"留给子类实现。</p>
<p>基于它实现的有：<code>ReentrantLock</code>、<code>ReentrantReadWriteLock</code>、<code>Semaphore</code>、<code>CountDownLatch</code> 等。</p>
<p>这是典型的<b>模板方法模式</b>：AQS 定义 <code>acquire/release</code> 流程，子类重写 <code>tryAcquire/tryRelease</code>（独占）或 <code>tryAcquireShared/tryReleaseShared</code>（共享）。</p>`,
    links: [['AQS', '../../02-并发/advanced/07-AQS.html']] },

  { sec: 'AQS', q: 'AQS 的原理是什么？', star: true,
    a: `<p>两个核心：<b>一个 state + 一个等待队列</b>。</p>
<ol><li><b><code>volatile int state</code></b>：同步状态，含义由子类定义。通过 <code>getState</code>/<code>setState</code>/<code>compareAndSetState</code>（CAS，比较并交换，一条原子指令）来改。</li>
<li><b>CLH 变体队列</b>：抢不到资源的线程被包装成 Node，加入一个<b>双向链表</b>队尾，然后用 <code>LockSupport.park()</code> 挂起；持有者释放时唤醒队头的下一个节点去重新抢。</li></ol>
<p><b>state 在不同同步器里的含义</b>：</p>
<ul><li><code>ReentrantLock</code>：0 = 没人持有；线程 lock 一次 +1，<b>同一个线程重入再 +1</b>，unlock 一次 −1，减到 0 才真正释放。</li>
<li><code>CountDownLatch</code>：初始为 N，每次 countDown −1，到 0 唤醒所有 await 的线程。</li>
<li><code>Semaphore</code>：剩余许可数。</li></ul>`,
    more: `<p><b>什么是 CLH 队列</b>：原版 CLH 锁是一个<b>单向链表的自旋锁</b>，每个线程自旋盯着前驱节点的状态，前驱释放了自己就拿到锁。AQS 对它做了两处改造：</p>
<ul><li><b>自旋 → 自旋 + 阻塞</b>：短暂自旋失败后 park，避免长时间空转浪费 CPU。</li>
<li><b>单向 → 双向</b>：因为线程被阻塞了，释放者需要找到后继节点去唤醒它，所以加了 next 指针；prev 指针则方便处理取消的节点。</li></ul>
<p>JDK 8 的 Node 用 <code>waitStatus</code>（如 SIGNAL = −1 表示"释放后要唤醒后继"）标记状态；JDK 17 之后内部实现改动较大，但 state + 队列 + 模板方法的思想不变。</p>`,
    trap: `<p>重入几次就要释放几次，少 unlock 一次 state 就回不到 0，其他线程永远拿不到锁。所以 <code>unlock()</code> 一定要写在 <code>finally</code> 里。</p>`,
    links: [['AQS', '../../02-并发/advanced/07-AQS.html'], ['CAS 与原子类', '../../02-并发/advanced/05-CAS与原子类.html'], ['ReentrantLock', '../../02-并发/advanced/02-ReentrantLock.html']] },

  { sec: 'AQS', q: 'Semaphore 有什么用？',
    a: `<p><b>Semaphore（信号量）控制同时访问某个资源的线程数量</b>。synchronized 和 ReentrantLock 一次只放一个线程，Semaphore 可以一次放 N 个。</p>
<pre><code>Semaphore sem = new Semaphore(5);   // 5 个许可
sem.acquire();                       // 拿许可，没了就阻塞
try { accessResource(); }
finally { sem.release(); }           // 归还许可</code></pre>
<p><b>场景</b>：限流，比如最多 5 个线程同时调用某个下游接口、控制数据库连接并发数。</p>
<p>也分公平模式和非公平模式（默认非公平）。</p>`,
    trap: `<p>Semaphore 通常只适合<b>单机</b>限流，分布式限流要用 Redis、Sentinel 等。另外 <code>release()</code> 不校验调用者是否真的拿过许可，多调一次许可数就会变多。</p>`,
    links: [['Semaphore', '../../02-并发/blocks/06-Semaphore.html']] },

  { sec: 'AQS', q: 'Semaphore 的原理是什么？',
    a: `<p>基于 AQS 的<b>共享模式</b>，<code>state</code> = 剩余许可数。</p>
<ul><li><code>acquire()</code>：调用 <code>tryAcquireShared</code>，用 CAS 把 state 减 1。减完 ≥ 0 就成功；不够了就进 AQS 队列阻塞。</li>
<li><code>release()</code>：调用 <code>tryReleaseShared</code>，CAS 把 state 加 1，然后唤醒队列里等待的线程。</li></ul>
<p>"共享"的意思是：同一时刻可以有多个线程同时成功获取（只要许可够）；对比 ReentrantLock 的"独占"，同一时刻只有一个线程能成功。</p>`,
    links: [['AQS', '../../02-并发/advanced/07-AQS.html']] },

  { sec: 'AQS', q: 'CountDownLatch 有什么用？',
    a: `<p><b>让一个或多个线程等待，直到计数器被减到 0</b>。计数器 N 表示"要等多少次事件"，每发生一次调用 <code>countDown()</code>。</p>
<p>类比：火箭发射倒计时，数到 0 才发射。</p>
<p>它是<b>一次性</b>的：计数只能在构造时设置，减到 0 后不能重置复用。</p>`,
    trap: `<p>N 是<b>事件次数</b>，不是线程数。同一个线程可以 countDown 多次，多个线程也可以各 countDown 一次。忘了 countDown（比如任务抛异常没走到）会让 await 的线程永远卡住，所以 countDown 要放 finally 里，await 最好用带超时的版本。</p>`,
    links: [['CountDownLatch', '../../02-并发/blocks/05-CountDownLatch.html']] },

  { sec: 'AQS', q: 'CountDownLatch 的原理是什么？',
    a: `<p>也是 AQS <b>共享模式</b>：构造时 <code>state = count</code>。</p>
<ul><li><code>countDown()</code>：通过 <code>tryReleaseShared</code> 用 CAS 把 state 减 1；减到 0 的那一次，唤醒所有等待的线程。</li>
<li><code>await()</code>：<code>tryAcquireShared</code> 判断 state 是否为 0，是就直接返回，否则进队列阻塞。</li></ul>
<p>返回规则：计数归零，<code>await()</code> 正常返回，<code>await(timeout)</code> 返回 true；超时返回 false；等待中被中断抛 <code>InterruptedException</code>。</p>`,
    more: `<p>为什么用共享模式？因为 state 到 0 时要让<b>所有</b>等待的线程一起通过，唤醒是从队头一个接一个传播下去的；独占模式一次只唤醒一个。</p>` },

  { sec: 'AQS', q: '用过 CountDownLatch 么？什么场景下用的？',
    a: `<p>给一个口述模板：</p>
<p>"有个需求要读取并处理 6 个互不依赖的文件，最后汇总结果返回。我用线程池并行处理，创建 <code>new CountDownLatch(6)</code>，每个任务处理完在 finally 里 <code>countDown()</code>，主线程 <code>await()</code> 等 6 个都完成后再汇总。"</p>
<pre><code>CountDownLatch latch = new CountDownLatch(6);
for (File f : files) {
    pool.execute(() -&gt; {
        try { process(f); } finally { latch.countDown(); }
    });
}
latch.await(30, TimeUnit.SECONDS);   // 别无限等
summarize();</code></pre>`,
    more: `<p><b>追问：有更好的写法吗？</b>JDK 8 起可以用 <code>CompletableFuture.allOf(...)</code> 实现同样的"等全部完成"，还能直接拿到每个任务的结果、统一处理异常，代码更清晰。</p>` },

  { sec: 'AQS', q: 'CyclicBarrier 有什么用？和 CountDownLatch 有什么区别？',
    a: `<p><b>CyclicBarrier（循环屏障）让一组线程互相等待</b>：每个线程到达屏障点调用 <code>await()</code> 后阻塞，等最后一个线程也到了，所有线程一起放行。还可以指定一个 <code>barrierAction</code>，由最后到达的线程在放行前执行。</p>
<table><tr><th></th><th>CountDownLatch</th><th>CyclicBarrier</th></tr>
<tr><td>谁等谁</td><td>一个/多个线程等<b>其他线程</b>完成事件</td><td>一组线程<b>互相</b>等，到齐了一起走</td></tr>
<tr><td>能否复用</td><td>一次性</td><td>可循环使用，一轮结束自动重置</td></tr>
<tr><td>实现</td><td>AQS 共享模式</td><td><code>ReentrantLock</code> + <code>Condition</code></td></tr></table>
<p>场景：多线程分段计算，每一阶段所有线程都算完后再汇总、进入下一阶段。</p>`,
    links: [['CyclicBarrier', '../../02-并发/blocks/07-CyclicBarrier.html']] },

  { sec: 'AQS', q: 'CyclicBarrier 的原理是什么？',
    a: `<p>内部是 <code>ReentrantLock</code> + <code>Condition trip</code>，外加两个字段：<code>parties</code>（每轮要拦截的线程数）和 <code>count</code>（本轮还差几个）。</p>
<ol><li>线程调用 <code>await()</code>：先加锁，<code>count</code> 减 1。</li>
<li>如果 count 还没到 0：在 <code>trip.await()</code> 上等待，同时释放锁。</li>
<li>如果 count 变成 0（我是最后一个）：执行 barrierAction，然后 <code>trip.signalAll()</code> 唤醒所有人，并调用 <code>nextGeneration()</code> 把 count 重置为 parties，开启新一代——这就是"Cyclic"的由来。</li></ol>`,
    more: `<p>它用一个 <code>Generation</code> 对象标记"第几轮"。如果某个等待线程被中断或超时，屏障会被标记为 <b>broken</b>，其他等待的线程都会抛 <code>BrokenBarrierException</code>，避免大家一直干等一个不会来的线程。需要手动 <code>reset()</code> 才能恢复。</p>`,
    links: [['Condition', '../../02-并发/advanced/04-Condition.html']] },

  // ───────────── 虚拟线程 ─────────────
  { sec: '虚拟线程', q: '什么是虚拟线程？它和平台线程有什么关系？',
    a: `<p><b>虚拟线程</b>（Virtual Thread）是 Java 21 正式发布的轻量级线程，由 <b>JVM 调度</b>，而不是操作系统。</p>
<ul><li><b>平台线程</b>：就是以前的 <code>Thread</code>，和操作系统线程 1:1 对应，创建成本高、栈内存大，一般只能开几千个。</li>
<li><b>虚拟线程</b>：很多个虚拟线程挂载在少量平台线程（叫<b>载体线程</b>，默认由一个 ForkJoinPool 提供）上运行，是 M:N 的关系。遇到阻塞 I/O 时，虚拟线程会从载体线程上<b>卸载</b>，载体线程转去跑别的虚拟线程，I/O 好了再挂回来继续执行。</li></ul>
<p><b>优点</b>：创建极便宜，可以开几十万甚至上百万；可以继续写同步阻塞风格的代码，却有接近异步的吞吐。适合大量 I/O 等待的服务端场景。</p>
<pre><code>Thread.ofVirtual().start(() -&gt; handle());
try (var exec = Executors.newVirtualThreadPerTaskExecutor()) { ... }</code></pre>`,
    trap: `<ul><li>对 <b>CPU 密集型</b>任务没有帮助，CPU 核数不会变多。</li>
<li>虚拟线程很便宜，<b>不需要池化</b>，一个任务一个就行；要限制并发访问某个资源，用 Semaphore。</li>
<li>JDK 21 中在 <code>synchronized</code> 块里阻塞会把虚拟线程"钉"（pin）在载体线程上卸载不了，JDK 24 起（JEP 491）已经解决了这个问题。</li>
<li>大量虚拟线程配 ThreadLocal 放大对象，内存占用会很可观。</li></ul>`,
    links: [['虚拟线程简介', '../../02-并发/modern/06-虚拟线程VirtualThreads简介.html'], ['线程实现与协程简介', '../../08-JVM/concurrency/02-线程实现与协程简介.html']] },
];

/* ───────────── 渲染与交互 ───────────── */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 已掌握标记只是个人刷题的便利，存浏览器本地；隐私模式等拿不到存储时静默降级
const store = {
  get() { try { return JSON.parse(localStorage.getItem(PAGE_KEY) || '[]'); } catch (e) { return []; } },
  set(v) { try { localStorage.setItem(PAGE_KEY, JSON.stringify(v)); } catch (e) {} }
};
let done = new Set(store.get());
let onlyStar = false, onlyUndone = false;

function render() {
  const qBox = document.getElementById('questions'), aBox = document.getElementById('answers');
  let qHtml = '', aHtml = '', lastSec = '';
  QA.forEach((it, i) => {
    const no = 'Q' + (i + 1), star = it.star ? '<span class="star">⭐</span>' : '';
    if (it.sec !== lastSec) {
      if (lastSec) qHtml += '</ol>';
      qHtml += `<h3 class="sec">${esc(it.sec)}</h3><ol class="qlist">`;
      aHtml += `<h3 class="sec">${esc(it.sec)}</h3>`;
      lastSec = it.sec;
    }
    qHtml += `<li id="q${i}" data-i="${i}"><span class="no">${no}</span><a href="#a${i}">${esc(it.q)}${star}</a><button class="mark" title="标记为已掌握">✓</button></li>`;
    let body = `<span class="label l-a">🎯 面试这样答</span>${it.a}`;
    if (it.more) body += `<span class="label l-more">🔍 深入 / 追问</span>${it.more}`;
    if (it.trap) body += `<span class="label l-trap">⚠️ 陷阱</span>${it.trap}`;
    if (it.links) body += `<span class="label l-link">📚 本站笔记</span><p>${it.links.map(([t, h]) => `<a href="${h}">${esc(t)}</a>`).join(' · ')}</p>`;
    body += `<p><a class="back" href="#q${i}">↑ 回到题目 ${no}</a></p>`;
    aHtml += `<details class="ans" id="a${i}" data-i="${i}"><summary><span class="no">${no}</span>${esc(it.q)}${star}</summary><div class="body">${body}</div></details>`;
  });
  qBox.innerHTML = qHtml + '</ol>';
  aBox.innerHTML = aHtml;
}

function refresh() {
  document.querySelectorAll('[data-i]').forEach(el => {
    const i = +el.dataset.i, it = QA[i];
    const hide = (onlyStar && !it.star) || (onlyUndone && done.has(i));
    el.classList.toggle('hidden', hide);
    if (el.tagName === 'LI') el.classList.toggle('done', done.has(i));
  });
  // 某小节的题全被筛掉时，连同小节标题一起隐藏
  document.querySelectorAll('h3.sec').forEach(h => {
    const next = h.nextElementSibling;
    if (next && next.tagName === 'OL') h.classList.toggle('hidden', !next.querySelector('li:not(.hidden)'));
  });
  const stars = QA.filter(x => x.star).length;
  document.getElementById('stat').textContent = `已掌握 ${done.size}/${QA.length} · ⭐ ${stars} 题`;
  document.getElementById('btn-star').classList.toggle('on', onlyStar);
  document.getElementById('btn-undone').classList.toggle('on', onlyUndone);
}

render(); refresh();

document.getElementById('questions').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const i = +li.dataset.i;
  if (e.target.classList.contains('mark')) {
    done.has(i) ? done.delete(i) : done.add(i);
    store.set([...done]); refresh(); return;
  }
  // 点题目时自动展开对应答案，省得跳过去还要再点一次
  if (e.target.closest('a')) document.getElementById('a' + i).open = true;
});
document.getElementById('btn-star').onclick = () => { onlyStar = !onlyStar; refresh(); };
document.getElementById('btn-undone').onclick = () => { onlyUndone = !onlyUndone; refresh(); };
document.getElementById('btn-open').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = true);
document.getElementById('btn-close').onclick = () => document.querySelectorAll('details.ans').forEach(d => d.open = false);
document.getElementById('btn-reset').onclick = () => { if (confirm('清空本页所有「已掌握」标记？')) { done.clear(); store.set([]); refresh(); } };
</script>
</body>
